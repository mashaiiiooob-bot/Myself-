// paintWheelSheet syncs the sheet with the cooldown: the rule, or the wait.
function paintWheelSheet(){
  const slot=$('whsub'), go=$('whgo');
  if(!slot || !go) return;
  if(WHEEL_WAIT>0){
    slot.textContent=(fa?'چرخش بعدی ':'Next spin in ')+waitText(WHEEL_WAIT)+(fa?' دیگر':'');
    go.disabled=true; go.textContent='⏳ '+waitText(WHEEL_WAIT);
  } else {
    slot.textContent=fa?'روزی یک چرخش، سکه رایگان':'One free spin a day';
    go.disabled=false; go.textContent=fa?'بچرخان':'Spin';
  }
}

// whEase is the spin's motion: a short throw, then friction. Friction is a
// constant deceleration, which integrates to q*(2-q) — so the wheel loses speed
// evenly and is still turning on the last frame before it stops, the way a real
// wheel does. (A steeper curve, e.g. easeOutQuint, is done moving a second
// before the timer is: the wheel freezes, then the sheet reacts out of nowhere.)
function whEase(p){
  const A=0.07, share=0.035;       // the throw: 3.5% of the distance getting up to speed
  if(p<A){ const q=p/A; return share*q*q; }
  const q=(p-A)/(1-A);             // then coast down to a dead stop
  return share + (1-share)*q*(2-q);
}

let whAngle=0, whBusy=false;
async function spinWheelRun(){
  if(whBusy) return;
  whBusy=true;
  const go=$('whgo'), stage=$('whstage'), disc=$('whdisc'), pin=$('whpin'), slot=$('whsub');
  go.disabled=true; go.textContent=fa?'در حال چرخش…':'Spinning…';
  haptic('light'); whAudio(); // open the audio context while we're still inside the tap
  let r={};
  try{
    const res=await fetchT('spin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData})});
    r=await res.json();
  }catch(e){ r={err:e.message||String(e)}; }

  if(!r.ok){
    whBusy=false;
    WHEEL_WAIT=r.wheel|0; paintWheelSheet(); paintWheel(WHEEL_WAIT);
    if(r.err) toast('⚠️ '+r.err);
    return;
  }

  // The server already picked the prize; the wheel just has to land on it.
  const n=WHEEL_SEGS.length, seg=360/n;
  let idx=WHEEL_SEGS.indexOf(r.prize); if(idx<0) idx=0;
  const jit=(Math.random()-0.5)*seg*0.55;             // never dead-centre twice
  const from=whAngle;
  const want=((-idx*seg+jit)%360+360)%360, cur=((from%360)+360)%360;
  const to=from+360*6+((want-cur)+360)%360;
  const DUR=WH_REDUCED?700:4800;

  const finish=()=>{ whAngle=to; whReveal(r); };
  if(WH_REDUCED){ disc.style.transform='rotate('+to.toFixed(2)+'deg)'; setTimeout(finish, DUR); whBusy=true; return; }

  let t0=0, wedge=null, kick=0, lastTick=0;
  const frame=ts=>{
    if(!t0) t0=ts;
    const p=Math.min(1,(ts-t0)/DUR);
    const a=from+(to-from)*whEase(p);
    // A wedge edge just passed the pointer: kick it, and click once — the ticks
    // thin out on their own as the wheel slows, which is the whole feel of it.
    const w=Math.floor(a/seg);
    if(wedge!==null && w!==wedge){
      kick=1;
      if(ts-lastTick>55){ haptic('light'); whBeep(1150, 30, 0.05, 'square'); lastTick=ts; }
    }
    wedge=w;
    kick*=0.80;
    disc.style.transform='rotate('+a.toFixed(2)+'deg)';
    pin.style.transform='rotate('+(kick*13).toFixed(2)+'deg)';
    if(p<1) requestAnimationFrame(frame); else whSettle(disc, pin, to, finish);
  };
  requestAnimationFrame(frame);
}

// whSettle is the last 400ms: the disc rocks back against the pointer and stops.
// Without it the wheel just ends, which reads as a bug rather than a stop.
function whSettle(disc, pin, at, done){
  let s0=0;
  const step=ts=>{
    if(!s0) s0=ts;
    const q=Math.min(1,(ts-s0)/420);
    const off=Math.sin(q*Math.PI*1.4)*2.8*(1-q);
    disc.style.transform='rotate('+(at-off).toFixed(2)+'deg)';
    pin.style.transform='rotate('+(off*2.4).toFixed(2)+'deg)';
    if(q<1) requestAnimationFrame(step);
    else { pin.style.transform='rotate(0deg)'; done(); }
  };
  requestAnimationFrame(step);
}

// whReveal swaps the rule line for the prize, counts it up, and celebrates in
// proportion: confetti only for a prize above the middle of the wheel.
function whReveal(r){
  const stage=$('whstage'), slot=$('whsub');
  haptic('ok');
  if(stage) stage.classList.add('won');
  if(slot){
    slot.className='whprize pop'; slot.id='whprize';
    slot.innerHTML='🪙 <span id="whprizen">0</span> <small>'+(fa?'سکه':'coins')+'</small>';
    whCountUp($('whprizen'), r.prize, 620);
  }
  const sorted=WHEEL_SEGS.slice().sort((a,b)=>a-b);
  const big=r.prize>=sorted[Math.floor(sorted.length/2)];
  whFanfare(big);
  if(big) confettiBurst();
  WHEEL_WAIT=r.wheel|0;
  const go=$('whgo');
  if(go){ go.disabled=true; go.textContent='⏳ '+waitText(WHEEL_WAIT); }
  paintWheel(WHEEL_WAIT);
  whBusy=false;
  fillMe(); // the balance in the profile just changed
  setTimeout(()=>{ if(stage) stage.classList.remove('won'); }, 1500);
}

function whCountUp(el, to, ms){
  if(!el) return;
  let t0=0;
  const step=ts=>{
    if(!t0) t0=ts;
    const q=Math.min(1,(ts-t0)/ms);
    el.textContent=nf(Math.round(to*(1-Math.pow(1-q,3))));
    if(q<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// confettiBurst throws a handful of squares from the middle of the sheet and
// removes them the moment they land — no library, no leftovers.
function confettiBurst(){
  const box=$('whconf'); if(!box) return;
  const frag=document.createDocumentFragment();
  for(let i=0;i<22;i++){
    const c=document.createElement('i');
    c.style.background=WH_CONF[i%WH_CONF.length];
    c.style.setProperty('--dx', ((Math.random()*2-1)*170).toFixed(0)+'px');
    c.style.setProperty('--dy', (60+Math.random()*230).toFixed(0)+'px');
    c.style.setProperty('--rot', (Math.random()*720-360).toFixed(0)+'deg');
    c.style.animationDelay=(Math.random()*140).toFixed(0)+'ms';
    frag.appendChild(c);
  }
  box.appendChild(frag);
  setTimeout(()=>{ box.innerHTML=''; }, 1900);
}

// applyMe paints an answer we already have. Split out from the fetch because a
// cached open builds the welcome card TWICE — once from the cached hub, once when
// the server's reconcile repaints it — and each card asked /me again. Returns
// false when the answer ended the screen (expired), so the caller stops.
let meLast=null, meAt=0, meInflight=null;
// getMeOnce collapses the two calls a cached open makes into one request. Caching
// the RESULT is not enough: both cards are built within a few milliseconds of each
// other, so the second one still finds an empty cache and fires its own fetch
// while the first is in flight. Share the promise, not just its answer.
async function getMeOnce(){
  if(meLast && Date.now()-meAt < 4000) return meLast;
  if(!meInflight) meInflight = getMe().finally(()=>{ meInflight=null; });
  const m = await meInflight;
  if(m){ meLast=m; meAt=Date.now(); }
  return m;
}
function applyMe(m){
  if(m.bot) BOT=m.bot;                                          // for the signup deep link
  if(m.admin && !isAdmin){ isAdmin=true; renderAdminButton(); } // admin controls appear
  if(m.has && m.dead){ showExpired(); return false; }
  paintRuntime(m);
  paintWheel(m.wheel|0, m.wheelSegs);
  return true;
}
async function fillMe(){
  try { await fillMeInner(); } catch(e){ console.error('fillMe', e); toast('⚠️ '+(e.message||e)); }
}
async function fillMeInner(){
  // Balance and runtime cannot have moved in the time one /api took, so the
  // reconcile paints from the answer already in hand or in flight rather than
  // spending a second round trip. In-memory only: a reopen is a fresh page.
  const m=await getMeOnce(); if(!m) return;
  if(!applyMe(m)) return;
  // The open triggers a session re-check on the server; confirm shortly after.
  if(m.has && !meRechecked){ meRechecked=true; setTimeout(async()=>{ const r=await getMe(); if(r&&r.has&&r.dead) showExpired(); }, 2600); }
}

/* One SVG glyph per movement kind, from the app's own sprite. This map used to

const KIND_ICON = {
  trial_grant:'i-gift', start_fee:'i-rocket', runtime_burn:'i-hourglass',

function svgi(name){ return '<svg class="i"><use href="#'+name+'"/></svg>'; }

// Rows are grouped under a date heading, so a row shows only its time.
function ledgerTime(ts){
  const d=new Date((ts||0)*1000);
  try{ return d.toLocaleTimeString(fa?'fa-IR':'en-GB',{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return String(ts); }
}
const dayKey = d => d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
function ledgerDay(ts){
  const d=new Date((ts||0)*1000), now=new Date();
  if(dayKey(d)===dayKey(now)) return fa?'امروز':'Today';
  const y=new Date(now.getTime()-86400000);
  if(dayKey(d)===dayKey(y)) return fa?'دیروز':'Yesterday';
  try{ return d.toLocaleDateString(fa?'fa-IR':'en-GB',{year:'numeric',month:'short',day:'numeric'}); }
  catch(e){ return dayKey(d); }
}

/* The ledger is three jobs — an overview, a journal, and a person lookup — and
   stacking them in one scroll is why nothing in it could be found. One segment
   is shown at a time, under a scope bar that always states whose books are open. */
let ledgerTab='sum';
const LEDGER_KINDS_SHOWN = 6;
let ledgerKindsOpen = false;
let ledgerTotals=null;

async function openLedger(ctx){
  ledgerCtx=Object.assign({uid:0,ref:'',kind:'',who:''},ctx||{});
  ledgerRows=[]; ledgerNext=0; ledgerTotals=null;
  if(ctx && ctx.tab) ledgerTab=ctx.tab;
  // Back out of a narrowed view to the whole fleet rather than out of the ledger
  // altogether: drilling into a person and then wanting the fleet again is the
  // commonest move here.
  const narrowed = !!(ledgerCtx.uid || ledgerCtx.ref);
  backAction = narrowed ? (()=>openLedger({tab:ledgerTab})) : openAdmin;
  showBack('🧾 '+(fa?'دفتر مالی':'Finance ledger')); showSearch(false);
  $('status').style.display='none';
  const stage=$('stage'); stage.innerHTML=
    '<div id="ledscope"></div><div id="ledseg"></div><div id="ledbody"></div>';
  paintLedgerChrome();
  await paintLedgerTab();
}

/* The scope bar and the segments — the two things that never change while you
   are inside the ledger, so they are painted once per open and then left alone. */
function paintLedgerChrome(){
  const sc=$('ledscope');
  if(sc){
    const person = !!(ledgerCtx.uid || ledgerCtx.ref);
    const title = ledgerCtx.uid ? (ledgerCtx.who || ('#'+ledgerCtx.uid))
                : ledgerCtx.ref ? (fa?'لینک ':'Link ')+ledgerCtx.ref
                : (fa?'کل مجموعه':'Whole fleet');
    const sub = ledgerCtx.uid ? String(ledgerCtx.uid)
              : ledgerCtx.ref ? (fa?'همه حرکت های این لینک':'every movement on this link')
              : (fa?'همه کاربران، از ابتدا':'every user, all time');
    sc.className='ledscope';
    sc.innerHTML='<span class="sg">'+svgi(ledgerCtx.uid?'i-user':ledgerCtx.ref?'i-link':'i-globe')+'</span>'+
      '<span class="st"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></span>'+
      (person?'<button class="sx" id="ledunscope" aria-label="'+(fa?'کل مجموعه':'Whole fleet')+'">'+svgi('i-x')+'</button>':'');
    const un=sc.querySelector('#ledunscope');
    if(un) un.onclick=()=>openLedger({tab:ledgerTab});
  }
  const sg=$('ledseg');
  if(sg){
    const tabs=[['sum',fa?'خلاصه':'Summary','i-activity'],
                ['act',fa?'گردش':'Activity','i-clock'],
                ['find',fa?'جستجو':'Find','i-search']];
    sg.className='ledseg';
    sg.innerHTML=tabs.map(([k,l,i])=>
      '<button data-tab="'+k+'"'+(k===ledgerTab?' class="on"':'')+'>'+svgi(i)+l+'</button>').join('');
    sg.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
      if(b.dataset.tab===ledgerTab) return;
      ledgerTab=b.dataset.tab; paintLedgerChrome(); paintLedgerTab();
    });
  }
}

async function paintLedgerTab(){
  const body=$('ledbody'); if(!body) return;
  if(ledgerTab==='find') return paintLedgerFind(body);
  if(ledgerTab==='act')  return paintLedgerActivity(body);
  return paintLedgerSummary(body);
}

/* ---- summary: where the money went ---- */
async function paintLedgerSummary(body){
  // Reserve the shape before the numbers land, so the screen does not jump.
  if(!ledgerTotals) body.innerHTML=ledgerSkeleton();
  const t = ledgerTotals || (ledgerTotals = await adminReq('ledger_totals',{uid:ledgerCtx.uid}));
  if(!t){ body.innerHTML='<div class="empty">'+(fa?'در دسترس نیست':'unavailable')+'</div>'; return; }
  if(ledgerTab!=='sum') return;   // the operator moved on while this was in flight
  ledgerCtx.who = t.who || ledgerCtx.who;

  const inv=Math.round(t['in']||0), outv=Math.round(t.out||0), net=inv-outv;
  let h='<div class="lednet '+(net<0?'neg':'pos')+'">'+
    '<div class="cap">'+(fa?'خالص':'NET')+'</div>'+
    '<div class="fig"><b class="num">'+(net>0?'+':'')+nf(net)+'</b>'+
    '<span class="u">'+(fa?'سکه':'coins')+'</span></div></div>'+
    '<div class="ledduo">'+
      '<div class="h in"><span class="g">'+svgi('i-in')+'</span><span><span class="k">'+
        (fa?'وارد شده':'Received')+'</span><span class="v num">'+nf(inv)+'</span></span></div>'+
      '<div class="h out"><span class="g">'+svgi('i-out')+'</span><span><span class="k">'+
        (fa?'خارج شده':'Spent')+'</span><span class="v num">'+nf(outv)+'</span></span></div>'+
    '</div>';
  if(t.balance!=null)
    h+='<div class="ledbal"><span>'+(fa?'موجودی فعلی':'Balance now')+'</span>'+
       '<b class="num">'+nf(Math.round(t.balance))+' 🪙</b></div>';

  const kinds=t.kinds||[];
  if(kinds.length){
    const shown = ledgerKindsOpen ? kinds : kinds.slice(0, LEDGER_KINDS_SHOWN);
    const max=Math.max.apply(null,kinds.map(k=>Math.max(k['in'],k.out)).concat([1]));
    h+='<div class="subhead">'+(fa?'به تفکیک نوع — بزنید تا در «گردش» فیلتر شود'
                                 :'By kind — tap to filter Activity')+'</div><div class="ledkinds">';
    shown.forEach(k=>{
      h+='<button class="ledkind'+(k.kind===ledgerCtx.kind?' on':'')+'" data-kind="'+esc(k.kind)+'">'+
        '<span class="kg">'+kindIcon(k.kind)+'</span>'+
        '<span class="kn">'+esc(kindLabel(k.kind))+'</span>'+
        '<span class="kb"><i class="in"><u style="width:'+Math.round(100*k['in']/max)+'%"></u></i>'+
        '<i class="out"><u style="width:'+Math.round(100*k.out/max)+'%"></u></i></span>'+
        '<span class="kv num">'+(k['in']?'<span class="p">+'+nf(Math.round(k['in']))+'</span>':'')+
          (k.out?'<span class="m">-'+nf(Math.round(k.out))+'</span>':'')+'</span></button>';
    });
    h+='</div>';
    if(kinds.length > LEDGER_KINDS_SHOWN)
      h+='<button class="ledmorekinds" id="ledkindsmore">'+(ledgerKindsOpen
        ? (fa?'کمتر':'Show less')
        : '+'+nf(kinds.length-LEDGER_KINDS_SHOWN)+' '+(fa?'نوع دیگر':'more'))+'</button>';
  }
  body.innerHTML=h;
  // Tapping a kind is how the overview becomes a way INTO the detail rather than
  // a wall beside it.
  body.querySelectorAll('.ledkind').forEach(b=>b.onclick=()=>{
    ledgerCtx.kind = (ledgerCtx.kind===b.dataset.kind) ? '' : b.dataset.kind;
    ledgerTab='act'; ledgerRows=[]; ledgerNext=0;
    paintLedgerChrome(); paintLedgerTab();
  });
  const mk=body.querySelector('#ledkindsmore');
  if(mk) mk.onclick=()=>{ ledgerKindsOpen=!ledgerKindsOpen; paintLedgerSummary(body); };
}

function ledgerSkeleton(){
  return '<div class="lednet"><div class="cap">&nbsp;</div><div class="fig"><b>&nbsp;</b></div></div>'+
    '<div class="ledduo"><div class="h in"><span class="g"></span><span><span class="k">&nbsp;</span>'+
    '<span class="v">&nbsp;</span></span></div><div class="h out"><span class="g"></span>'+
    '<span><span class="k">&nbsp;</span><span class="v">&nbsp;</span></span></div></div>'+
    '<div class="subhead">&nbsp;</div><div class="ledkinds">'+
    '<div class="ledkind sk"></div>'.repeat(5)+'</div>';
}

/* ---- activity: the journal ---- */
async function paintLedgerActivity(body){
  body.innerHTML='<div id="ledfilters" class="ledfilters"></div>'+
    '<div id="ledlist"></div>'+
    '<button class="actionbtn" id="ledmore" style="margin-top:12px;display:none">'+
      (fa?'بیشتر':'Load more')+'</button>';
  $('ledmore').onclick=()=>loadLedger(false);
  paintLedgerFilters();
  if(!ledgerRows.length){ ledgerNext=0; await loadLedger(true); }
  else paintLedgerRows();
}

// What is being shown, and one tap to stop showing it.
function paintLedgerFilters(){
  const box=$('ledfilters'); if(!box) return;
  // A chip with no handler is a LABEL, not a button.
  const chip=(cls,inner,onClick,removable)=>{
    const b=document.createElement(onClick?'button':'span'); b.className=cls+(onClick?'':' static');
    b.innerHTML=inner+(removable?' '+svgi('i-x'):'');
    if(onClick) b.onclick=onClick;
    box.appendChild(b);
  };
  box.innerHTML='';
  if(!ledgerCtx.kind){
    chip('all', svgi('i-globe')+(fa?'همه نوع ها':'All kinds'), null, false);
    return;
  }
  chip('scope', kindIcon(ledgerCtx.kind)+esc(kindLabel(ledgerCtx.kind)), ()=>setLedgerKind(''), true);
}

// The one place the kind filter moves.
function setLedgerKind(k){
  ledgerCtx.kind=k; ledgerRows=[]; ledgerNext=0;
  paintLedgerFilters(); loadLedger(true);
}

async function loadLedger(reset){
  if(ledgerBusy) return; ledgerBusy=true;
  const r=await adminReq('ledger',{uid:ledgerCtx.uid, ref:ledgerCtx.ref, kind:ledgerCtx.kind,
                                   before: reset?0:ledgerNext});
  ledgerBusy=false;
  if(!r) return;
  if(reset) ledgerRows=[];
  ledgerRows=ledgerRows.concat(r.entries||[]);
  ledgerNext=r.next||0;
  paintLedgerRows();
}

function paintLedgerRows(){
  const list=$('ledlist'); if(!list) return;
  if(!ledgerRows.length){
    // "Nothing recorded yet" is only true of an unfiltered ledger.
    const filtered = !!(ledgerCtx.kind || ledgerCtx.ref || ledgerCtx.uid);
    list.innerHTML='<div class="lednores"><b>'+(filtered
      ? (fa?'زیر این فیلتر چیزی نیست':'Nothing under this filter')
      : (fa?'هنوز حرکتی ثبت نشده':'Nothing recorded yet'))+'</b>'+
      (filtered?'<button class="ledclear">'+(fa?'برداشتن فیلتر':'Clear the filter')+'</button>':'')+'</div>';
    const cb=list.querySelector('.ledclear');
    if(cb) cb.onclick=()=>openLedger({tab:'act'});
    const mb=$('ledmore'); if(mb) mb.style.display='none';
    return;
  }
  list.innerHTML='';
  let day='', group=null;
  ledgerRows.forEach(e=>{
    const d=ledgerDay(e.at);
    if(d!==day){
      day=d;
      const h=document.createElement('div'); h.className='leddate'; h.textContent=d;
      list.appendChild(h);
      group=document.createElement('div'); group.className='group'; list.appendChild(group);
    }
    // Where this row goes when tapped, decided first: a row that goes nowhere
    // must not carry a chevron and a press animation and then do nothing.
    const linked = e.ref && (e.kind==='gift_link'||e.kind==='transfer_in'||e.kind==='transfer_out'||e.kind==='bet');
    const go = linked ? (()=>openLedger({ref:e.ref, tab:'act'}))
             : (!ledgerCtx.uid ? (()=>openLedger({uid:e.uid, who:e.who, tab:'sum'})) : null);

    const row=document.createElement(go?'button':'div');
    row.className='ledrow '+(e.delta<0?'out':'in')+(go?'':' flat');
    const who = ledgerCtx.uid ? '' : '<span class="ld-who">'+esc(e.who||e.uid)+'</span>';
    let meta = ledgerTime(e.at);
    if(e.peer) meta += ' · '+(fa?'با ':'with ')+esc(e.peerName||e.peer);
    if(e.by)   meta += ' · '+(fa?'توسط مدیر ':'by admin ')+esc(e.by);
    row.innerHTML=
      '<span class="ld-ic">'+kindIcon(e.kind)+'</span>'+
      '<span class="ld-mid"><span class="ld-kind">'+esc(kindLabel(e.kind))+who+'</span>'+
        '<span class="ld-sub num">'+meta+'</span>'+
        (e.note?'<span class="ld-note">'+esc(e.note)+'</span>':'')+'</span>'+
      '<span class="ld-amt num"><b>'+(e.delta>0?'+':'')+nf(Math.round(e.delta))+'</b>'+
        '<i>'+nf(Math.round(e.balance))+'</i></span>';
    if(go) row.onclick=go;
    group.appendChild(row);
  });
  const mb=$('ledmore'); if(mb) mb.style.display = ledgerNext ? '' : 'none';
}

/* ---- find: whose books do I want to read ----
   This calls `findpeople`, NOT `users`. The old search walked the tenant table,
   so it could not match a @username (a tenant record has no username on it) and
   could not find anybody without a userbot — even though the ledger is full of
   them: a referral reward in a pending wallet, a claimed gift link, coins granted
   before signup. Searching for those people returned nothing, which reads exactly
   like a broken search box, because it was one. */
function paintLedgerFind(body){
  body.innerHTML=
    '<div class="ledsbox">'+svgi('i-search')+
      '<input id="ledq" type="text" autocomplete="off" enterkeyhint="search" placeholder="'+
      (fa?'نام، آیدی عددی، @یوزرنیم یا شماره':'Name, id, @username or phone')+'"></div>'+
    '<div class="ledhint">'+(fa
      ?'هر کسی که با ربات کار کرده پیدا می شود — حتی اگر سلف نساخته باشد. شماره را به هر شکلی بنویسید.'
      :'Finds anybody who has used the bot, with or without a userbot. Phone in any format.')+'</div>'+
    '<div id="ledpeople"></div>';
  const input=$('ledq');
  let t;
  input.addEventListener('input', e=>{
    clearTimeout(t);
    const q=e.target.value.trim();
    if(!q){ $('ledpeople').innerHTML=''; return; }
    t=setTimeout(async()=>{
      const r=await adminReq('findpeople',{q});
      if(r && ledgerTab==='find') paintLedgerPeople(r.people||[], q);
    }, 280);
  });
  setTimeout(()=>input.focus(), 60);
}

function paintLedgerPeople(people, q){
  const box=$('ledpeople'); if(!box) return;
  if(!people.length){
    // Never a dead end: say what else can be searched.
    box.innerHTML='<div class="lednores"><div class="big">'+svgi('i-search')+'</div>'+
      '<b>'+(fa?'کسی با «'+esc(q)+'» پیدا نشد':'Nobody matches “'+esc(q)+'”')+'</b>'+
      '<span>'+(fa
        ?'با آیدی عددی، @یوزرنیم یا شماره هم می توانید جستجو کنید.<br>شماره را به هر شکلی بنویسید — ۰۹۱۲… یا ۹۸۹۱۲…'
        :'You can also search by numeric id, @username or phone.<br>Any phone format works — 0912… or +98912…')+'</span></div>';
    return;
  }
  box.innerHTML='<div class="group">'+people.map(p=>{
    const name = p.name || ('#'+p.uid);
    const bits = [];
    if(p.username) bits.push('@'+p.username);
    bits.push(String(p.uid));
    if(p.phone) bits.push(p.phone);
    return '<button class="ledperson" data-uid="'+p.uid+'" data-name="'+esc(name)+'">'+
      '<span class="pav'+(p.hasBot?' bot':'')+'">'+esc(name.trim().charAt(0)||'#')+'</span>'+
      '<span><span class="pn">'+esc(name)+'</span><span class="pu num">'+esc(bits.join(' · '))+'</span></span>'+
      '<span class="pc num">'+(p.hasBot?nf(p.coins)+'<i>'+(fa?'سکه':'coins')+'</i>'
                                        :'<i>'+(fa?'بدون سلف':'no bot')+'</i>')+'</span></button>';
  }).join('')+'</div>';
  box.querySelectorAll('.ledperson').forEach(b=>b.onclick=()=>
    openLedger({uid:Number(b.dataset.uid), who:b.dataset.name, tab:'sum'}));
}

/* ---------- admin dashboard (MANAGER_ADMINS only) ---------- */
let isAdmin=false;
function renderAdminButton(){
  const slot=$('adminslot'); if(!slot) return;
  slot.innerHTML='<button class="adminbtn">🛠 '+(fa?'مدیریت سرور':'Server Admin')+'</button>';
  slot.querySelector('button').onclick=openAdmin;
}
async function adminReq(op, extra){
  bar(true);
  try{
    const r=await fetchT('admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({initData:tg.initData,op},extra||{}))});
    if(!r.ok){ toast(httpErr(r.status)); return null; }
    return await r.json();
  }catch(e){ toast('⚠️ '+(e.message||'')); return null; } finally{ bar(false); }
}
async function openAdmin(){ return send('p:'+chatId+':admin');
  stopSupportPolling();
  silentNav=false; featureKey=null; itemCtx=null;
  const ov=await adminReq('overview'); if(!ov) return;
  adminOv=ov;
  renderAdmin(ov);
}
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function medalOf(i){ return i===0?'🥇':i===1?'🥈':i===2?'🥉':String(i+1); }
function nf(n){ return (Number(n)||0).toLocaleString('en-US'); }
function statCard(v,label,extra){ return '<div class="stat"><div class="sv">'+v+'</div><div class="sl">'+label+'</div>'+(extra||'')+'</div>'; }
function fmtUptime(s){ const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60); return fa?(d+' روز '+h+' ساعت '+m+' دقیقه'):(d+'d '+h+'h '+m+'m'); }
/* The admin dashboard is a hub, not a scroll.
   It used to be one page carrying the stats, the fleet-wide tools, the invite
   challenge, the cook lock, the process table, two leaderboards and the user
   search — eleven blocks deep, so the thing you came for was almost never the
   thing you could see. What stays on the landing screen is the number you read
   at a glance; everything you ACT on is one tap away and gets a whole screen to
   itself, with the page's own .tiles vocabulary doing the navigating. */
let adminOv=null;

/* adminScreen is the shell every admin sub-screen uses: back goes to the hub, the
   title says where you are, and the stage is rebuilt with the same transition the
   rest of the app uses. */
function adminScreen(title, build){
  silentNav=false;
  backAction=openAdmin;
  showBack(title); showSearch(false);
  $('status').style.display='none';
  const stage=$('stage'); stage.classList.add('out');
  setTimeout(()=>{ stage.innerHTML=''; build(stage); stage.classList.remove('out'); },110);
}

/* adminTiles renders the hub's destinations. badge is the count that makes a tile
   worth tapping right now — unread support, settings still on the builder's
   defaults — and is left off when there is nothing to say. */
function adminTiles(stage, items){
  const grid=document.createElement('div'); grid.className='tiles';
  items.forEach(it=>{
    const el=document.createElement('button'); el.type='button'; el.className='tile';
    el.style.setProperty('--h', hueOf(it.key));
    el.innerHTML='<span class="ic"></span><span class="tl"></span>';
    el.querySelector('.ic').textContent=it.icon;
    el.querySelector('.tl').textContent=it.label;
    if(it.badge){
      const v=document.createElement('span'); v.className='tv on'; v.textContent=it.badge;
      el.appendChild(v); el.classList.add('is-on');
    }
    el.onclick=it.go;
    grid.appendChild(el);
  });
  stage.appendChild(grid);
}

function renderAdmin(ov){
  backAction=()=>send('p:'+chatId+':@manage');
  showBack(fa?'مدیریت سرور':'Server Admin'); showSearch(false);
  $('status').style.display='none';
  const stage=$('stage'); stage.classList.add('out');
  setTimeout(()=>{
    stage.innerHTML='';
    const conv = ov.started? Math.round(ov.tenants*100/ov.started):0; // signup → userbot funnel
    const sub = s => '<div class="sl">'+s+'</div>';
    const sect = t => { const h=document.createElement('div'); h.className='subhead'; h.textContent=t; stage.appendChild(h); };
    const grid = html => { const g=document.createElement('div'); g.className='statgrid'; g.innerHTML=html; stage.appendChild(g); };

    /* Read first, act second. The two grids are the whole answer to "how is it

    adminTiles(stage, [
      {key:'adm_users',    icon:'👥', label:fa?'کاربران':'Users',                go:openAdminUsers},
      {key:'adm_support',  icon:'💬', label:fa?'پیام های پشتیبانی':'Support inbox',
       badge:(ov.supportUnread||0)?String(ov.supportUnread):'',                 go:openSupportInbox},
      {key:'adm_finance',  icon:'🧾', label:fa?'دفتر مالی':'Finance ledger',     go:()=>openLedger({tab:'sum'})},
      {key:'adm_sales',    icon:'⚙️', label:fa?'تنظیمات فروش':'Sales settings',
       badge:(ov.brandUnset||0)?('⚠️ '+ov.brandUnset):'',                       go:openBrand},
      {key:'adm_tools',    icon:'⚡', label:fa?'ابزارهای همگانی':'Fleet actions', go:openAdminTools},
      {key:'adm_chal',     icon:'🏁', label:fa?'چالش دعوت':'Invite challenge',    go:openAdminChallenge},
      {key:'adm_cook',     icon:'🍳', label:fa?'قفل آشپز':'Cook lock',            go:openAdminCook},
      ...(ov.apiRequestsAllowed?[{key:'adm_api', icon:'📡', label:fa?'درخواست های API':'API requests',
        badge:nf(ov.apiRequests||0),                                               go:openAdminAPI}]:[]),
      {key:'adm_server',   icon:'🖥', label:fa?'سرور و مصرف':'Server & usage',    go:openAdminServer},
    ]);
    stage.classList.remove('out');
  },110);
}

/* Fleet-wide tools: give every user coins, or message everyone who ever started
   the bot. Both are irreversible and hit every user, so each one asks for the
   admin password on the same card and re-checks it server-side on every call —
   nothing about a previous step is trusted from a web page. */
/* Referral challenge: open a window of N days, or close the running one. While
   one is open every invite board — here, in the bot, and the public one — counts
   only that window, so this is where a competition is actually run from. */
function renderChallenge(stage, tp){
  const c = tp.challenge;
  const h=document.createElement('div'); h.className='subhead';
  h.textContent=fa?'🏁 چالش دعوت':'🏁 Invite challenge'; stage.appendChild(h);

  const box=document.createElement('div'); box.className='tool';
  let inner='';
  if(c){
    inner+='<h4>'+(fa?'در حال اجرا':'Running')+' · '+esc(challengeLeft(c.left))+'</h4>';
    inner+=challengeRules(c);
    if(c.board && c.board.length){
      // Whoever wins has to be paid, so every row carries a handle that works:
      // the name to recognise them by, the @username to reach them, the id that
      // is always there. Tapping a row opens their admin card.
      inner+='<div class="chalboard">'+c.board.map((r,i)=>
        '<div class="urow" data-uid="'+r.uid+'">'+
          '<span class="rankbadge'+(i<3?' m'+(i+1):'')+'">'+medalOf(i)+'</span>'+
          '<div class="uinfo"><div class="uname">'+esc(r.name||('#'+r.uid))+
            (r.username?' <span class="usub">@'+esc(r.username)+'</span>':'')+'</div>'+
            '<div class="usub">'+r.uid+'</div></div>'+
          '<div class="ucoins">🤝 '+nf(r.count)+(r.prize>0?'<br>🪙 '+nf(r.prize):'')+'</div></div>').join('')+'</div>';
    } else {
      inner+='<div class="toolnote">'+(fa?'هنوز کسی دعوتی ثبت نکرده است.':'nobody has scored yet')+'</div>';
    }
    inner+='<input id="ch_pw" type="password" placeholder="'+(fa?'رمز مدیریت':'Admin password')+'">'+
           '<button id="ch_stop">'+(fa?'پایان دادن به چالش':'End the challenge')+'</button>';
  } else {
    inner+='<h4>'+(fa?'خاموش':'Off')+'</h4>'+
      '<div class="toolnote">'+(fa
        ?'جدول دعوت الان مجموع کل زمان را نشان می دهد، پس هر کس زودتر آمده همیشه بالاتر است. یک چالش باز کنید تا فقط دعوت های همان بازه شمرده شود.'
        :'The invite board shows lifetime totals, so whoever joined first always leads. Open a challenge to count only that window.')+'</div>'+
      '<input id="ch_days" type="number" min="1" max="365" value="1" placeholder="'+(fa?'چند روز':'Days')+'">'+
      '<input id="ch_pw" type="password" placeholder="'+(fa?'رمز مدیریت':'Admin password')+'">'+
      '<button id="ch_go">'+(fa?'شروع چالش':'Start the challenge')+'</button>';
  }
  inner+='<div class="toolnote" id="ch_note"></div>';
  // Finished challenges keep their results — the window is all it takes to score
  // them again — so the podium of each stays readable after it ends.
  const past = tp.pastChallenges || [];
  if(past.length){
    inner+='<div class="toolnote"><b>'+(fa?'📜 چالش های گذشته':'📜 Past challenges')+'</b><br>'+
      past.map(p=>{
        const head=(p.days>=1 ? (fa? p.days+' روزه':p.days+'d') : (fa?'کوتاه':'short'))+
                   ' · '+esc(challengeAgo(p.ago));
        const rows=(p.top||[]).length
          ? p.top.map((r,i)=>medalOf(i)+' '+esc(r.name||('#'+r.uid))+
              (r.username?' @'+esc(r.username):'')+' — '+nf(r.count)+
              (r.prize>0?' · 🪙 '+nf(r.prize):'')).join('<br>')
          : (fa?'بدون دعوت':'no invites');
        // Whether the money actually left, not only what was promised.
        const paid=(p.prizes&&p.prizes.length)
          ? '<br>'+(p.settled?(fa?'جایزه ها پرداخت شد ✅':'prizes paid ✅')
                             :(fa?'جایزه ها هنوز پرداخت نشده':'prizes not paid yet'))
          : '';
        return '<div style="margin:6px 0">'+head+'<br>'+rows+paid+'</div>';
      }).join('')+'</div>';
  }
  if(tp.myref){
    inner+='<div class="toolnote">'+(fa?'🔗 لینک «لینک دعوت من را بده» برای گذاشتن در کانال:':'🔗 Public "give me my link" link:')+
      '<br><code>'+esc(tp.myref)+'</code></div>';
  }
  box.innerHTML=inner;
  stage.appendChild(box);

  box.querySelectorAll('.chalboard .urow').forEach(row=>{
    row.onclick=()=>openAdminUser(Number(row.dataset.uid));
  });
  const note=box.querySelector('#ch_note');
  const run=async(payload)=>{
    const pw=box.querySelector('#ch_pw').value.trim();
    if(!pw){ note.textContent=fa?'رمز مدیریت لازم است.':'Admin password required.'; return; }
    const r=await adminReq('challenge', Object.assign({pw}, payload));
    note.textContent = r ? (r.note||'') : (fa?'انجام نشد.':'failed');
    if(r && r.ok) setTimeout(openAdmin, 600);
  };
  const stop=box.querySelector('#ch_stop');
  if(stop) stop.onclick=()=>askConfirm(fa?'چالش بسته شود؟':'End the challenge?', ()=>run({action:'stop'}));
  const go=box.querySelector('#ch_go');
  if(go) go.onclick=()=>run({days: parseInt(box.querySelector('#ch_days').value,10)||0});
  // The rules the NEXT challenge opens with. Shown whether or not one is running,
  // because a running challenge's own rules are frozen and these are the only ones
  // still editable.
  renderChallengeSettings(stage, tp.chalDefaults||{}, async payload=>{
    const r=await adminReq('challenge', payload);
    note.textContent = r ? (r.note||'') : (fa?'انجام نشد.':'failed');
    return (r && r.ok) ? r.defaults : null;
  });
}
/* A challenge's rules in one block: what each place wins, the bar for winning
   anything, and whether a number from outside Iran counts. Used for the running
   challenge (its own frozen rules) and for the settings the next one will be
   opened with, because those are the same three facts asked at two moments. */
function challengeRules(c){
  const p=c.prizes||[], d=c.days||[];
  let s='<div class="toolnote"><b>🎁 '+(fa?'جایزه':'Prizes')+'</b><br>';
  s+= p.length
    ? p.map((v,i)=>medalOf(i)+' '+(fa?'نفر ':'')+nf(i+1)+(fa?'':'.')+' — '+
        nf(d[i]||0)+(fa?' روز':'d')+' ('+nf(v)+' 🪙)').join('<br>')+
      '<br>'+(fa?'جمع: ':'Total: ')+nf(p.reduce((a,b)=>a+b,0))+' 🪙'
    : (fa?'ندارد — فقط جدول نشان داده می شود':'None — scoreboard only');
  s+='<br><br><b>⚙️ '+(fa?'شرایط':'Conditions')+'</b><br>';
  s+= (fa?'حداقل دعوت برای جایزه: ':'Minimum invites to win: ')+nf(c.minRefs||1)+'<br>';
  s+= (fa?'شماره های غیر ایران: ':'Non-Iranian numbers: ')+
      (c.virtual ? (fa?'شمرده می شوند (بدون سکه دعوت)':'count (they still earn no invite coins)')
                 : (fa?'شمرده نمی شوند':'do not count'));
  return s+'</div>';
}
/* The next challenge's prize ladder and conditions. Saves repaint from the
   server's returned defaults so the operator stays on this screen. */
const PRIZE_PRESETS = [
  [fa?'۱۰ / ۵ / ۳ روز':'10 / 5 / 3 d', '10,5,3'],
  [fa?'۷ / ۳ / ۱ روز':'7 / 3 / 1 d',   '7,3,1'],
  [fa?'۳ / ۲ / ۱ روز':'3 / 2 / 1 d',   '3,2,1'],
  [fa?'فقط نفر اول: ۷ روز':'1st only: 7 d', '7'],
];
const MINREF_PRESETS = [1, 3, 5, 10];

function renderChallengeSettings(stage, d0, send){
  const wrap=document.createElement('div'); wrap.className='tool';
  stage.appendChild(wrap);

  const paint=(d)=>{
    const days=d.days||[], prizes=d.prizes||[];
    const cpd=d.coinsPerDay||48, cur=days.join(',');
    const prizeRow=(i,v)=>'<div class="ch-prize-row"><label for="ch_prize_'+i+'">'+medalOf(i)+' '+
      (fa?'نفر ':'Place ')+nf(i+1)+'<small class="ch_prize_coins"></small></label>'+
      '<input class="ch_prize_day" id="ch_prize_'+i+'" type="text" inputmode="numeric" value="'+
      (v==null?'':Number(v))+'" placeholder="'+(fa?'روز':'days')+'"></div>';
    let h='<h4>🎁 '+(fa?'جایزه و شرایط چالش بعدی':'Next challenge: prizes and conditions')+'</h4>';
    h+='<div class="toolnote" style="text-align:start">'+(fa
      ?'جایزه هر نفر را به روز وارد کنید. سکه آن محاسبه می شود و پایان چالش خودکار پرداخت می شود.'
      :'Enter each place’s prize in days. Its coin value is calculated and paid when the challenge ends.')+'</div>';
    h+='<div id="ch_prizerows">'+days.map((v,i)=>prizeRow(i,v)).join('')+'</div>'+
      '<div class="ch-prize-total" id="ch_prize_total"></div>'+
      '<div class="ch-prize-actions"><button id="ch_addplace">＋ '+(fa?'افزودن نفر':'Add place')+'</button>'+
      '<button id="ch_removeplace">− '+(fa?'حذف نفر آخر':'Remove last')+'</button></div>'+
      '<button id="ch_saveprizes" style="margin-top:8px">'+(fa?'ذخیره جایزه ها':'Save prizes')+'</button>'+
      '<div class="toolnote" id="ch_prize_error" role="status"></div>'+
      '<div class="toolnote" style="text-align:start;margin-top:14px">'+(fa?'انتخاب سریع:':'Quick choices:')+'</div>'+
      '<div class="chips">'+PRIZE_PRESETS.map(([lab,v])=>
        '<button data-p="'+v+'"'+(v===cur?' class="on"':'')+'>'+lab+'</button>').join('')+
      '<button data-p="">⛔ '+(fa?'بدون جایزه':'No prizes')+'</button></div>';

    h+='<div class="toolnote" style="text-align:start;margin-top:14px"><b>'+
       (fa?'حداقل دعوت برای جایزه':'Minimum invites to win')+'</b><br>'+
       (fa?'کسی که کمتر از این تعداد دعوت کند در جدول نمی آید و جایزه نمی گیرد.'
          :'Anybody below this is off the board and cannot win.')+'</div>';
    h+='<div class="chips">'+MINREF_PRESETS.map(n=>
        '<button data-m="'+n+'"'+(n===(d.minRefs||1)?' class="on"':'')+'>'+nf(n)+'</button>').join('')+
      '<input id="ch_minc" type="number" min="1" placeholder="'+(fa?'دلخواه':'other')+'">'+
      '<button id="ch_mingo">'+(fa?'ذخیره':'Save')+'</button></div>';

    h+='<div class="toolnote" style="text-align:start;margin-top:14px"><b>'+
       (fa?'دعوت های قدیمی بی پاداش':'Legacy unrewarded invites')+'</b><br>'+(fa
      ?'دعوت هایی که با قانون قدیمی شماره تایید کردند ولی سکه ای نگرفتند، در جدول چالش شمرده شوند یا نه. دعوت های جدید به شماره نیازی ندارند و در هر حال شمرده می شوند.'
      :'Whether invites left unpaid by the old phone rule score in the challenge. New invites need no number and always count.')+'</div>';
    h+='<div class="chips"><button data-v="1"'+(d.virtual?' class="on"':'')+'>'+
       (d.virtual?'✅ ':'')+(fa?'شمرده می شوند':'They count')+'</button>'+
       '<button data-v="0"'+(d.virtual?'':' class="on"')+'>'+
       (d.virtual?'':'✅ ')+(fa?'شمرده نمی شوند':'They do not')+'</button></div>';
    wrap.innerHTML=h;

    const rows=wrap.querySelector('#ch_prizerows');
    const error=wrap.querySelector('#ch_prize_error');
    let dirty=false;
    const refresh=()=>{
      let total=0, valid=true;
      rows.querySelectorAll('.ch_prize_day').forEach((input,i)=>{
        const n=Number(fold(input.value)), ok=Number.isInteger(n) && n>=1 && n<=3650;
        const coins=!dirty && prizes[i]!=null ? Number(prizes[i]) : n*cpd;
        input.closest('.ch-prize-row').querySelector('.ch_prize_coins').textContent=
          ok ? nf(n)+(fa?' روز · ':' days · ')+nf(coins)+' 🪙' : (fa?'جایزه به روز':'Prize in days');
        if(ok) total+=coins; else valid=false;
      });
      const count=rows.children.length;
      wrap.querySelector('#ch_removeplace').disabled=!count;
      wrap.querySelector('#ch_saveprizes').disabled=!count;
      wrap.querySelector('#ch_prize_total').textContent=count
        ? (fa?'جمع جایزه '+nf(count)+' نفر: ':'Total for '+nf(count)+' places: ')+(valid?nf(total)+' 🪙':'—')
        : (fa?'فعلا بدون جایزه است. برای شروع یک نفر اضافه کنید.':'No prizes yet. Add a place to start.');
    };
    rows.oninput=()=>{ dirty=true; error.textContent=''; refresh(); };
    wrap.querySelector('#ch_addplace').onclick=()=>{
      rows.insertAdjacentHTML('beforeend',prizeRow(rows.children.length,null));
      dirty=true;
      refresh(); rows.lastElementChild.querySelector('input').focus();
    };
    wrap.querySelector('#ch_removeplace').onclick=()=>{
      rows.lastElementChild?.remove(); dirty=true; error.textContent=''; refresh();
    };
    wrap.querySelector('#ch_saveprizes').onclick=async()=>{
      const inputs=[...rows.querySelectorAll('.ch_prize_day')];
      const values=inputs.map(input=>Number(fold(input.value)));
      const bad=inputs.find((input,i)=>!Number.isInteger(values[i]) || values[i]<1 || values[i]>3650);
      if(bad){
        error.textContent=fa?'جایزه هر نفر باید عدد صحیح بین ۱ تا ۳۶۵۰ روز باشد.':'Each prize must be a whole number from 1 to 3650 days.';
        bad.focus(); return;
      }
      const save=wrap.querySelector('#ch_saveprizes'); save.disabled=true;
      const payload={action:'prizes', text:values.join(',')};
      const next=await send(payload);
      if(next) paint(next);
      else { save.disabled=false; error.textContent=fa?'جایزه ها ذخیره نشد. دوباره تلاش کنید.':'Prizes were not saved. Try again.'; }
    };
    refresh();
    const act=async(payload)=>{
      const next=await send(payload);
      if(next) paint(next);           // repaint in place — never navigate away
    };
    wrap.querySelectorAll('[data-p]').forEach(b=>
      b.onclick=()=>act({action:'prizes', text:b.dataset.p}));
    wrap.querySelectorAll('[data-m]').forEach(b=>
      b.onclick=()=>act({action:'minrefs', days:+b.dataset.m}));
    wrap.querySelector('#ch_mingo').onclick=()=>{
      const n=parseInt(wrap.querySelector('#ch_minc').value,10);
      if(n>=1) act({action:'minrefs', days:n});
    };
    wrap.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
      if((b.dataset.v==='1')!==!!d.virtual) act({action:'virtual'});
    });
  };
  paint(d0);
}
/* Telegram's native confirm; window.confirm is blocked in some clients. */
function askConfirm(msg, run){
  if(tg && tg.showConfirm) tg.showConfirm(msg, ok=>{ if(ok) run(); });
  else if(confirm(msg)) run();
}

/* The auto-cook invite gate: lock the feature behind a number of invites, or
   open it for everyone. Individual users are unlocked from their own card. */
function renderCookLock(stage){
  const box=document.createElement('div'); box.className='tool';
  box.innerHTML=
    '<h4>🍳 '+(fa?'قفل آشپز':'Cook lock')+'</h4>'+
    '<div class="toolnote" id="ck_state">…</div>'+
    '<input id="ck_n" type="number" min="0" placeholder="'+(fa?'تعداد دعوت لازم':'Invites needed')+'">'+
    '<button id="ck_lock" class="danger">'+(fa?'قفل کن با این تعداد':'Lock at this count')+'</button>'+
    '<button id="ck_open">'+(fa?'باز کن برای همه':'Open for everyone')+'</button>'+
    '<div class="toolnote" id="ck_note"></div>';
  stage.appendChild(box);

  const paint=s=>{
    if(!s) return;
    $('ck_state').textContent = s.locked
      ? (fa?('قفل است — '+nf(s.referrals)+' دعوت لازم است. '+nf(s.unlocked)+' کاربر باز شده ('+nf(s.granted)+' با دست شما).')
           :('Locked — '+nf(s.referrals)+' invites needed. '+nf(s.unlocked)+' users unlocked ('+nf(s.granted)+' by hand).'))
      : (fa?'باز است برای همه.':'Open for everyone.');
    if($('ck_n').value==='' && s.referrals) $('ck_n').value=s.referrals;
  };
  adminReq('lock',{}).then(paint);

  $('ck_lock').onclick=async()=>{
    const n=parseInt(($('ck_n')||{}).value||'',10);
    if(!(n>=0)){ $('ck_note').textContent=fa?'یک عدد وارد کنید.':'Enter a number.'; return; }
    askConfirm(fa?('آشپز قفل شود و با '+nf(n)+' دعوت باز شود؟'):('Lock cook and open it at '+nf(n)+' invites?'), async()=>{
      const r=await adminReq('lock',{action:'set', locked:true, amount:n});
      if(r){ paint(r); $('ck_note').textContent=''; toast('🔒'); }
    });
  };
  $('ck_open').onclick=async()=>{
    askConfirm(fa?'آشپز برای همه کاربران باز شود؟':'Open cook for every user?', async()=>{
      const r=await adminReq('lock',{action:'set', locked:false, amount:-1});
      if(r){ paint(r); $('ck_note').textContent=''; toast('✅'); }
    });
  };
}

/* ---------- sales settings (MANAGER_ADMINS only) ----------
   The same settings the creator bot's ⚙️ panel edits, over the same server-side
   table: one definition of what a field is, what it validates, how it is stored
   and what it falls back to. This is a second face on it, not a second
   implementation — which is why the labels and prompts arrive from the server
   rather than being written again here.

   The confirmation rules arrive with them. A field that decides where money goes
   asks for the admin password where the deployment has one, and an explicit
   yes/no where it does not; the server re-checks either way, so nothing about
   what this page did a moment ago is trusted. */

}
function brandLabel(o){ return fa ? (o.label_fa||'') : (o.label_en||o.label_fa||''); }

  const stage=$('stage'); stage.classList.add('out');

    if(st.warn && st.warn.length){

      if(note){ const n=document.createElement('div'); n.className='toolnote'; n.textContent=fa?note[0]:note[1]; box.appendChild(n); }

      n.textContent=fa?'جعبه ها به صورت تصادفی در گروه ارسال می شوند. اولین کسی که جعبه را باز کند، جایزه کوچک سکه را می گیرد.'
                      :'Prize boxes appear in the group at random. The first person to open one gets a small coin prize.';
      box.appendChild(n);

    if(st.quiz){

function brandSection(stage, title, keys, extra){
  const box=document.createElement('div'); box.className='tool';
  const h=document.createElement('h4'); h.textContent=title; box.appendChild(h);
  if(extra) box.appendChild(extra);
  (keys||[]).forEach(k=>{ const r=brandRow(k); if(r) box.appendChild(r); });
  stage.appendChild(box);
  return box;
}

function brandRow(key, mark){
  const f=brandState.fields[key]; if(!f) return null;
  const value=key==='loadingpicture' ? (f.raw?(fa?'تصویر سفارشی':'Custom picture'):(fa?'پیش فرض':'Default')) : (f.value||'—');
  const row=document.createElement('div'); row.className='urow';
  row.innerHTML='<div class="uinfo"><div class="uname">'+(mark?mark+' ':'')+esc(brandLabel(f))+'</div>'+
                '<div class="usub">'+esc(value)+'</div></div><div class="ucoins">✏️</div>';
  row.onclick=()=>brandEdit(key);
  return row;

/* One editor at a time, at the top of the screen. Tapping a second row replaces
   it rather than opening another, so there is never a half-filled form scrolled
   out of sight above the one being typed into. */
async function loadingPictureData(file){
  if(!['image/png','image/jpeg','image/webp'].includes(file.type) || file.size>10*1024*1024) throw new Error('image');
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    await new Promise((resolve,reject)=>{ img.onload=resolve; img.onerror=reject; img.src=url; });
    if(!img.naturalWidth || !img.naturalHeight) throw new Error('image');
    const scale=Math.min(1,320/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/png');
  }finally{ URL.revokeObjectURL(url); }
}

/* The public leaderboard, for every user — not an admin screen, and not hidden
   behind a button: it sits at the top of the home screen because it is the one
   thing here that changes daily.

   Design: the top three as a podium (the story), places 4-5 as a thin list, and
   the viewer's own standing as a pill — a leaderboard you can read in a glance
   rather than a table you have to parse. A segmented control swaps the same
   podium between coins and invites, so both boards cost one card of space.

   Read-only by construction: the payload carries labels and numbers, no user
   ids, and nothing on this card is tappable through to an action. */
let boardData=null, boardTab='coins', boardInflight=null;
function boardOnce(){
  if(boardData) return Promise.resolve(boardData);
  if(!boardInflight) boardInflight = fetchBoard().finally(()=>{ boardInflight=null; });
  return boardInflight.then(r=>{ if(r) boardData=r; return boardData; });
}
function boardCard(){
  const box=document.createElement('div'); box.className='board'; box.id='boardcard';
  box.innerHTML=
    '<div class="bhead"><span>🏆</span><span class="btitle">'+(fa?'برترین ها':'Leaderboard')+'</span>'+
      '<span class="bseg">'+
        '<button id="btab_coins" class="on">🪙 '+(fa?'سکه':'Coins')+'</button>'+
        '<button id="btab_refs">🤝 '+(fa?'دعوت':'Invites')+'</button>'+
      '</span></div>'+
    '<div id="bbody"><div class="pval" style="padding:14px 0;text-align:center">…</div></div>';
  box.querySelector('#btab_coins').onclick=()=>switchBoard('coins');
  box.querySelector('#btab_refs').onclick=()=>switchBoard('refs');
  // Same as getMeOnce: a cached open builds this card twice, milliseconds apart,
  // so the standings have to be shared as an in-flight promise and not merely as
  // a result — the second card would otherwise still see an empty cache.
  // Never called synchronously: paintBoard looks the card up by id and this box is
  // not in the document until the caller appends it.
  boardOnce().then(paintBoard);
  return box;
}
function switchBoard(tab){
  boardTab=tab;
  const c=$('btab_coins'), i=$('btab_refs');
  if(c&&i){ c.classList.toggle('on', tab==='coins'); i.classList.toggle('on', tab==='refs'); }

async function fetchBoard(){

function initials(name){
  const n=String(name||'').trim();
  if(!n) return '?';

  return (parts.length>1 ? parts[0][0]+parts[1][0] : n.slice(0,2)).toUpperCase();
}
// challengeLeft says how long a challenge has to run, in the largest unit that
// is still true.
// challengeAgo is how long ago a challenge ended.
function challengeAgo(sec){
  sec=Math.max(0, Number(sec)||0);
  const d=Math.floor(sec/86400), h=Math.floor(sec/3600);
  if(d>=1) return fa? (d+' روز پیش') : (d+'d ago');
  if(h>=1) return fa? (h+' ساعت پیش') : (h+'h ago');
  return fa? 'همین الان' : 'just now';
}
function challengeLeft(sec){
  sec=Math.max(0, Number(sec)||0);
  const d=Math.floor(sec/86400), h=Math.floor(sec/3600);
  if(d>=1) return fa? (d+' روز مانده') : (d+'d left');
  if(h>=1) return fa? (h+' ساعت مانده') : (h+'h left');
  return fa? (Math.floor(sec/60)+' دقیقه مانده') : (Math.floor(sec/60)+'m left');
}
function paintBoard(){
  const body=$('bbody'); if(!body) return;

  if(!r){ body.innerHTML='<div class="pval" style="padding:14px 0;text-align:center">'+(fa?'در دسترس نیست':'unavailable')+'</div>'; return; }
  const list=(boardTab==='coins'? r.coins : r.refs)||[];
  const unit=boardTab==='coins' ? '🪙' : (fa?' نفر':'');
  // While a referral challenge is on, the invite board counts only that window.
  // Unlabelled it looks like everyone's invites vanished — and on the first day,
  // when nobody has scored yet, the empty board needs it most.
  const ch = r.challenge;
  // The prize is the reason to enter, so it goes on the banner rather than being
  // something only the admin panel knows.
  const chPrize = (ch && ch.prizes && ch.prizes.length)
    ? '<br>🪙 '+(fa?'جایزه':'Prizes')+' '+ch.prizes.map((v,i)=>medalOf(i)+' '+nf(v)).join(' · ')
    : '';
  const chBar = (ch && ch.minRefs>1)
    ? '<br>'+(fa?'برای جایزه حداقل ':'At least ')+nf(ch.minRefs)+(fa?' دعوت لازم است':' invites to win')

  const banner = (boardTab==='refs' && r.challenge)
    ? '<div class="bme" style="margin:0 0 10px">🏁 '+(fa?'چالش دعوت':'Invite challenge')+
      ' · <b>'+esc(challengeLeft(r.challenge.left))+'</b>'+chPrize+chBar+'</div>'
    : '';
  if(!list.length){
    body.innerHTML=banner+'<div class="pval" style="padding:16px 0;text-align:center">'+(fa?'هنوز کسی اینجا نیست — اولین نفر باشید':'nobody here yet — be the first')+'</div>';
    return;
  }
  const me=r.me||{};
  const label=x=> x.me ? (fa?'شما':'you') : x.label;
  // Podium order reads left→right as 2nd, 1st, 3rd, the way a podium looks.
  const order=[list[1], list[0], list[2]];
  const cls=['p2','p1','p3'];
  let html=banner+'<div class="podium">';
  order.forEach((x,i)=>{
    if(!x){ html+='<div class="pod"></div>'; return; }
    html+='<div class="pod '+cls[i]+'">'+
      '<div class="pav">'+esc(initials(label(x)))+'</div>'+
      '<div class="pname">'+esc(label(x))+'</div>'+
      '<div class="pval">'+nf(x.value)+unit+'</div>'+
      '<div class="pbar">'+x.rank+'</div></div>';
  });
  html+='</div>';
  if(list.length>3){
    html+='<div class="brest">'+list.slice(3).map(x=>
      '<div class="brow"><span class="bp">'+x.rank+'</span><span class="bn">'+esc(label(x))+'</span>'+
      '<span class="bv">'+nf(x.value)+unit+'</span></div>').join('')+'</div>';
  }
  const rank = boardTab==='coins' ? me.coinRank : me.refRank;
  const val  = boardTab==='coins' ? me.coins    : me.refs;
  html+='<div class="bme">📍 '+(fa?'جایگاه شما':'You')+' <b>'+(rank?('#'+nf(rank)):'—')+'</b> · <b>'+nf(val||0)+unit+'</b></div>';
  body.innerHTML=html;
}
/* The machine's usage exactly as htop's header shows it: a CPU meter, a Mem
   meter whose "used" is htop's own figure (total − free − buffers − cache, not
   MemAvailable) with the cache and buffer segments drawn beside it, a Swp meter,
   and the load average. */
function gb(b){
  b=Number(b)||0;
  if(b>=1073741824) return (b/1073741824).toFixed(2)+'G';
  if(b>=1048576) return Math.round(b/1048576)+'M';
  if(b>=1024) return Math.round(b/1024)+'K';
  return String(b);
}
function htopHeader(ov){
  const box=document.createElement('div'); box.className='meter';
  const cpu=(typeof ov.cpu==='number' && ov.cpu>=0)?ov.cpu:null;
  let html=
    '<div class="hrow"><span class="hkey">CPU</span>'+
    '<span class="hbar"><i class="used'+((cpu||0)>80?' hi':'')+'" style="width:'+(cpu||0)+'%"></i></span>'+
    '<span class="hval">'+(cpu===null?'—':cpu+'%')+'</span></div>';
  const m=ov.mem;
  if(m && m.total){
    const pc = v => Math.max(0, Math.min(100, v*100/m.total));
    html+=
      '<div class="hrow"><span class="hkey">Mem</span>'+
      '<span class="hbar">'+
        '<i class="used'+(pc(m.used)>80?' hi':'')+'" style="width:'+pc(m.used)+'%"></i>'+
        '<i class="buf" style="width:'+pc(m.buffers)+'%"></i>'+
        '<i class="cache" style="width:'+pc(m.cached)+'%"></i>'+
      '</span>'+
      '<span class="hval">'+gb(m.used)+' / '+gb(m.total)+'</span></div>';
    if(m.swapTotal){
      html+=
        '<div class="hrow"><span class="hkey">Swp</span>'+
        '<span class="hbar"><i class="used" style="width:'+Math.max(0,Math.min(100,m.swapUsed*100/m.swapTotal))+'%"></i></span>'+
        '<span class="hval">'+gb(m.swapUsed)+' / '+gb(m.swapTotal)+'</span></div>';
    }
    html+='<div class="mfoot">'+(fa?'کش ':'cache ')+gb(m.cached)+' · '+(fa?'بافر ':'buffers ')+gb(m.buffers)+' · '+(fa?'اشتراکی ':'shared ')+gb(m.shared)+'</div>';
  }
  if(ov.load && ov.load.length===3){
    html+='<div class="mfoot">'+(fa?'بار سیستم: ':'load average: ')+ov.load.join(' ')+
      (ov.tasks?('   '+(fa?'پردازش ها: ':'tasks: ')+nf(ov.tasks)):'')+'</div>';
  }
  box.innerHTML=html;
  return box;
}
/* htop, for our own processes: every running userbot with its RSS, heap and CPU
   share, heaviest first. CPU needs two readings a few seconds apart, so the
   first paint shows "—" and the auto-refresh below fills it in. */
async function renderProcs(stage){

async function aiRequest(view,op,extra){
  // Include the body read in the deadline: some WebViews stall after headers.
  const controller=new AbortController();
  const abort=()=>controller.abort();
  view.controller.signal.addEventListener('abort',abort,{once:true});
  let timer;
  try {
    return await Promise.race([
      (async()=>{
        const r=await fetch('ai-chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,
          body:JSON.stringify(Object.assign({initData:tg.initData,op},extra||{}))});
        const data=await r.json();
        if(!r.ok) throw new Error(data.error||'unavailable');
        return data;
      })(),
      new Promise((_,reject)=>{timer=setTimeout(()=>{controller.abort();reject(new Error('network'));},12000);})
    ]);
  } finally {
    clearTimeout(timer); view.controller.signal.removeEventListener('abort',abort);
  }
}

function aiFormatText(node,text,spans){
  // UTF-16 positions match JS strings, but cannot split a surrogate pair.
  // Quotes contain inline styles; malformed crossing ranges lose formatting,
  // never text. Only these three DOM tags are created, never parsed HTML.
  text=typeof text==='string'?text:String(text??'');
  const boundary=i=>i===0||i===text.length||!(text.charCodeAt(i-1)>=0xd800&&text.charCodeAt(i-1)<=0xdbff&&text.charCodeAt(i)>=0xdc00&&text.charCodeAt(i)<=0xdfff);
  const runs=(Array.isArray(spans)?spans.slice(0,512):[]).filter(s=>s&&[0,1,2].includes(s.Kind)&&Number.isSafeInteger(s.Offset)&&Number.isSafeInteger(s.Length)&&s.Offset>=0&&s.Length>0&&s.Offset+s.Length<=text.length&&boundary(s.Offset)&&boundary(s.Offset+s.Length))
    .map(s=>({kind:s.Kind,start:s.Offset,end:s.Offset+s.Length,children:[]}))
    .sort((a,b)=>a.start-b.start||b.end-a.end||(a.kind===2?-1:a.kind)-(b.kind===2?-1:b.kind));
  const quotes=[];
  for(const run of runs){
    if(run.kind===2&&(!quotes.length||run.start>=quotes[quotes.length-1].end))quotes.push(run);
  }
  const root={start:0,end:text.length,children:[]},stack=[root],seen=new Set();
  for(const run of runs){
    if(run.kind===2){if(!quotes.includes(run))continue;}
    else if(quotes.some(q=>run.start<q.end&&q.start<run.end&&!(run.start>=q.start&&run.end<=q.end)))continue;
    const key=run.kind+':'+run.start+':'+run.end;if(seen.has(key))continue;seen.add(key);
    while(stack.length>1&&run.start>=stack[stack.length-1].end)stack.pop();
    const parent=stack[stack.length-1];if(run.end>parent.end)continue;
    parent.children.push(run);stack.push(run);
  }
  function append(parent,range){
    let pos=range.start;
    for(const child of range.children){
      parent.appendChild(document.createTextNode(text.slice(pos,child.start)));
      const el=document.createElement(child.kind===2?'blockquote':child.kind===0?'strong':'code');
      // Let the command's own first strong character choose its direction;
      // isolate it from surrounding prose without changing copyable text.
      if(child.kind===2||child.kind===1)el.dir='auto';
      append(el,child);parent.appendChild(el);pos=child.end;
    }
    parent.appendChild(document.createTextNode(text.slice(pos,range.end)));
  }
  node.replaceChildren();append(node,root);
}
function aiMergeMessages(view,data,older,forceBottom){

      const t=document.createElement('div');t.className='mtext';aiFormatText(t,text,spans);b.appendChild(t);

      row.appendChild(b);chat.appendChild(row);return b;
    }
    bubble(m.question,true);
    const pending=['queued','thinking'].includes(m.state);

async function aiSend(view){

function supportComposer(adminView){
  const c=document.createElement('div'); c.className='composer';

  const sync=()=>{ send.disabled=!input.value.trim(); };
  const submit=async()=>{
    const text=input.value.trim(); if(!text || send.disabled) return;
    send.disabled=true;

function scheduleSupportPoll(){

async function pollSupport(){
  const mode=supportMode; if(!mode) return;
  if(document.hidden){ scheduleSupportPoll(); return; } // backgrounded: skip the fetch, keep the timer alive
  if(mode==='inbox'){
    const data=await supportReq('threads',{q:supportInboxQuery},true);
    if(supportMode!==mode) return;
    if(data){ supportInboxRows=data.threads||[]; paintSupportThreads(); }
  }else{
    const adminView=mode==='admin';
    const op=adminView?'admin_state':'state';
    const extra={after:supportLast}; if(adminView) extra.target=supportTarget;
    const state=await supportReq(op,extra,true);

function filterTiles(){
  const term=fold($('q').value||'');
  const filtered=!!term || dashboardFilter!=='all' || dashboardCategory!=='all';
  $('searchwrap').classList.toggle('filled', !!term);
  let shown=0;
  document.querySelectorAll('#stage .cat').forEach(cat=>{
    // Hide the Quick-access row while searching — its tiles duplicate the real
    // categories, and search should show each feature once.
    // Active-now duplicates the real categories exactly as quick access does, so
    // it is hidden while searching for the same reason: one row per feature.
    if(filtered && (cat.classList.contains('quickcat') || cat.classList.contains('activecat'))){ cat.style.display='none'; return; }
    let any=false;
    cat.querySelectorAll('.tile').forEach(t=>{
      const m=(!term || (t.dataset.s||'').includes(term)) && (dashboardFilter==='all' || t.dataset.state===dashboardFilter) && (dashboardCategory==='all' || cat.dataset.category===dashboardCategory);
      t.style.display=m?'':'none'; if(m){ any=true; shown++; }
    });
    cat.style.display=any?'':'none';
    // A search has to reach into shut categories — a match the owner cannot see is
    // the same as no match. Not written back to storage, so clearing the search
    // restores whatever they had chosen.
    if(cat.classList.contains('foldable')){
      cat.classList.toggle('searching', filtered);
      const h=cat.querySelector('h3');
      h.setAttribute('aria-expanded',String(filtered || cat.classList.contains('open')));
      h.setAttribute('aria-disabled',String(filtered));
      // Search results stay expanded until the query is cleared.
      h.tabIndex=filtered?-1:0;
      h.style.pointerEvents=filtered?'none':'';
    }
  });
  const nr=$('noresult'); if(nr) nr.style.display=shown?'none':'';
  const nra=$('noresultAction'); if(nra) nra.textContent=filtered ? (fa?'پاک کردن فیلترها':'Clear filters') : (fa?'مرور همه قابلیت ها':'Browse all features');
  ['dashboardHeading','dashboardMetrics','dashboardOverview'].forEach(id=>{const el=$(id);if(el)el.style.display=term?'none':'';});
  const hn=$('hubnote'); if(hn) hn.style.display=term?'none':'';
  const w=$('welcome'); if(w) w.style.display=term?'none':'';
  const p=$('hubpulse'); if(p) p.style.display=term?'none':'';
  const b=$('boardcard'); if(b) b.style.display=term?'none':'';
  const cb=$('custombot-tile'); if(cb) cb.style.display=term?'none':'';
  const admin=$('adminslot'); if(admin) admin.style.display=term?'none':'';
  updateBrowse();
}

// Only the router's built-in destinations are known reads. Section.Render may
// mutate state even when its URL looks like navigation (readall:toggle:pv).
// A lost reply is ambiguous: replaying that POST could undo an accepted toggle.
function panelRead(data){ return /^p:-?\d+:@(?:home|manage|close|noop)$/.test(data); }
async function send(data, btn){
  mainButton(null);
  // These paint their own screen and return before the fetch below, so they lift
  // the splash themselves rather than waiting out the failsafe.
  //
  // `support` is one of them because it is a client screen, not a panel section.
  // The boot code has always routed the ?startapp=support deep link "through
  // send()'s support handler" — but no such branch existed, so the literal string
  // "support" was POSTed as panel data, the panel answered "عملیات نامعتبر." with
  // no text and no buttons, and the app sat on its boot skeleton for ever.
  
  if(data==='@signup'){ openSignup(); hideSplash(); return; }
  if(data==='support'){ openSupport(); hideSplash(); return; }
  if(data==='aihelp'){ openAIChat(); hideSplash(); return; }
  if(data==='channelpublisher'){ openChannelPublisher(); hideSplash(); return; }
  if(data==='custombot'){ openCustomBot(); hideSplash(); return; }
  // One navigation at a time — but a swallowed tap used to be indistinguishable
  // from a broken app: the row the owner pressed did nothing, gave nothing back,
  // and the only sign anything was happening was a 2.5px line at the top of the
  // screen. Say no out loud instead. (The tap that IS in flight is already
  // dimmed by .busy, so this only ever fires on a second, different one.)
  if(inflight){
    haptic('warn');
    if(btn){ btn.classList.add('wait'); setTimeout(()=>btn.classList.remove('wait'), 320); }
    return;
  }
  stopSupportPolling();
  const navigation=featureEpoch;
  inflight=true;
  // Remember what was tapped, so a screen that turns out to be native can put its
  // name in the header while it loads instead of leaving the previous one there.
  // A tile's textContent carries its status value too ("Auto replyOn"), so prefer
  // the label span when there is one.
  if(btn){ const lb=btn.querySelector && (btn.querySelector('.tile-name') || btn.querySelector('.tl'));
    pendingTitle=stripLead(((lb?lb.textContent:btn.textContent)||'').trim()); }
  data=data.replace(/:@home$/, ':@manage');   // the hub is our home
  lastData=data.replace(/:[tcv]_[^:]+$/,''); featureKey=null;              // a panel navigation leaves feature mode
  if(silentNav){ silentNav=false; } else { haptic('light'); } // back doesn't buzz
  if(btn){ btn.classList.add('busy'); }
  document.querySelectorAll('button.btn').forEach(b=>{ if(b!==btn) b.disabled=true; });
  
  bar(true);
  const startedAt=Date.now();
  armWatchdog(startedAt);
  try{
    // Recover a lost hub load, but never replay a section's possible action.
    const res=await fetchT('api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,data})},12000,panelRead(data)?2:1);
    if(navigation!==featureEpoch) return;
    if(!res.ok){
      // Read this BEFORE failScreen paints, or it is always false afterwards.
      const wasEmpty=nothingOnScreen();
      toast(httpErr(res.status)); failScreen(httpErr(res.status));
      if(wasEmpty) report('http '+res.status, Date.now()-startedAt, data);
      return;
    }
    const v=await res.json();
    if(aiChatView) return;
    if(v.bot) BOT=v.bot;                              // stash the bot @username for the signup deep link
    syncLang(v);                                      // adopt the bot's language
    if(v.closed){ tg.close(); return; }
    if(v.native){ openFeature(v.native); return; }   // this section has a native settings screen
    if(v.inactive){ showSignup(v); return; }          // no live userbot → the onboarding screen
    if(isHub(data)) await renderHub(v); else render(v); // wait for the hub before applying library focus
    // A 200 is not a screen. render() bails on a view with no text and no
    // buttons, and that is a real answer from the server, not a bug in it — so
    // check that something actually appeared rather than assuming it did.
    ensurePainted(v.note);
  }catch(e){
    if(navigation!==featureEpoch) return;
    const timedOut = e && (e.name==='AbortError' || /abort/i.test(String(e.message||e)));
    const m = friendlyNetworkError(e);
    const wasEmpty=nothingOnScreen();   // before failScreen paints over it
    toast(m); failScreen(m);
    if(wasEmpty) report(timedOut?'abort (fetch deadline)':'network: '+(e&&e.message||e), Date.now()-startedAt, data);
  }
  finally{
    clearTimeout(watchdogT);
    inflight=false; bar(false); hideSplash();
    // On failure the current screen stays — un-brick it (spinner off, buttons back).
    if(btn) btn.classList.remove('busy');
    document.querySelectorAll('button.btn').forEach(b=>{ b.disabled=false; });
  }
}

async function farmerReq(action, extra){
  const navigation=featureEpoch;
  try{
    const body=Object.assign({initData:tg.initData, action}, extra||{});
    const res=await fetchT('farmers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)},15000, action==='list'||action==='login_status'?3:1);
    if(navigation!==featureEpoch) return null;
    if(!res.ok){
      // A delete may race with its own async cleanup (or a retry from the
      // Telegram webview). Refresh the authoritative list instead of making
      // the user reopen the Mini App to see the deletion.
      if(action==='remove' && res.status===404){
        const refreshed=await farmerReq('list');
        if(refreshed) return refreshed;
      }
      // The manager answers farmer failures with the reason in both
      // languages; only a reply without one falls back to the status text.
      let why=null;
      try{ const j=await res.json(); why=j && (fa?(j.errorFa||j.error):(j.error||j.errorFa)); }catch(e){}
      toast(why?('⚠️ '+why):httpErr(res.status)); return null;
    }
    const data=await res.json();
    return navigation===featureEpoch?data:null;
  }catch(e){ if(navigation===featureEpoch) toast(friendlyNetworkError(e)); return null; }

/* ---------- native feature screen ---------- */
let featureKey=null;
let featureEpoch=0;
function featureTicket(){ return {epoch:featureEpoch,key:featureKey,item:itemCtx,farmer:farmerID,chat:chatId}; }
function featureCurrent(t){ return t.epoch===featureEpoch && t.key===featureKey && t.item===itemCtx && t.farmer===farmerID && t.chat===chatId; }
let itemCtx=null;   // {listKey, itemId, parentKey} while in a per-item detail screen
async function feature(op, field, value){
  bar(true);
  try{
    const body={initData:tg.initData, op, key:featureKey, chatID:+chatId, field, value};
    if(itemCtx){ body.list=itemCtx.listKey; body.item=itemCtx.itemId; }
    // Reads retry; writes do not. A "state" load is idempotent, but a "set" that
    // is actually in flight and merely looks lost would be applied twice — and
    // list adds are not idempotent, so one lost reply could duplicate an entry.
    //
    // And the read deadline here is NOT the render's five seconds. A panel render
    // is a store read and measured 0.105s at its worst; a feature's state load can
    // make Telegram RPCs — listing the owner's groups for a multiselect is the
    // usual one — and legitimately takes several seconds. Measured in Caddy's log
    // after the render deadline was first applied here: /feature answering in
    // 6.2s, and three more aborted at ~5.6s by this very client. A deadline
    // shorter than the work turns a slow screen into a slow screen that also
    // repeats the work.
    const read = op==='state' || op==='itemstate';
    if(farmerID){ body.action=read?'feature_state':'feature_set'; body.id=farmerID; }
    const res=await fetchT(farmerID?'farmers':'feature',{method:'POST',headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)},
                           read?15000:20000, read?2:1);
    if(!res.ok){ toast(httpErr(res.status)); return null; }
    return await res.json();
  }catch(e){ toast(friendlyNetworkError(e)); return null; }
  finally{ bar(false); }
}
// A settings screen takes a round-trip to load — show its shape immediately so
// the tap always answers with something.
// The label of whatever is being opened, captured at the tap. A feature open is
// TWO round trips — the panel answer that says "this section is native", then the
// feature's own state, which legitimately takes seconds when it has to list the
// owner's groups — and until the second one lands there was nothing to render a
// title from. So the whole wait happened under the hub's header: no name for the
// screen being opened, and no back arrow, because showBack() was not called until
// the state arrived. A slow open was a screenful of grey bars with no way out of
// it short of killing the app.
let pendingTitle='';
function featureSkeleton(title){
  $('status').style.display='none';
  showBack(title || pendingTitle || $('hTitle').textContent);
  $('stage').innerHTML=
    '<div class="sk" style="width:58px;height:58px;border-radius:18px;margin:2px auto 16px"></div>'+
    '<div class="group">'+'<div class="sk" style="height:62px;margin:0;border-radius:0"></div>'.repeat(4)+'</div>';
}
async function openFeature(key){ silentNav=false; featureEpoch++;
  itemCtx=null; farmerID=null; featureKey=key;
  // Set BEFORE the request, not after it: a back arrow shown during the wait has
  // to actually go somewhere.
  backAction=featureHome || (()=>send('p:'+chatId+':@manage'));
  featureSkeleton();
  const ticket=featureTicket();
  const st=await feature('state');
  if(!featureCurrent(ticket)) return;
  if(st) renderFeature(st); else send('p:'+chatId+':@manage'); // never strand the user on a skeleton
}
async function openItem(listKey, itemId){
  featureEpoch++;
  itemCtx={listKey, itemId, parentKey:featureKey};
  const parent=featureKey;
  backAction=()=>farmerID ? openFarmerFeature(parent, farmerID) : openFeature(parent);
  featureSkeleton($('hTitle').textContent);

// setSeq makes the LAST change win. A set re-renders the whole screen from the
// state the server sends back, so two taps in quick succession used to fight:
// tap A, tap B, then A's answer lands and repaints a screen in which B had not
// happened yet — B visibly flipped back on its own — and only when B's answer
// arrived did it settle. Anything with a slow load (the chat pickers) made that
// window seconds long. A stale answer is now dropped rather than painted.
let setSeq=0;
// Every control on a settings screen moves the moment it is tapped — a switch
// flips itself because it is a real checkbox, a segment moves on tap, a stepper
// counts up under the finger — and the write that follows can fail: no network,
// a 502, a tenant mid-restart. Without `revert` the screen then shows a value the
// server never took, silently and indefinitely, and the toast is a line of text
// against a control that is still sitting in the wrong position. Every caller
// that moves a control before the answer passes a way to put it back.
async function setField(field, value, revert){
  haptic('light');
  // The custom bot is manager-owned, so its screen is an ordinary settings
  // screen with a different sink. Dispatching on featureKey means it clears
  // itself: every other screen sets featureKey to its own key on the way in.
  if(featureKey==='custombot') return customBotSet(field, value, revert);
  const mine=++setSeq, ticket=featureTicket();
  const st=await feature(itemCtx?'itemset':'set', field, value);
  if(mine!==setSeq || !featureCurrent(ticket)) return;                                          // a newer change is already on its way
  if(st){
    if(featureKey==='monshi' && field==='prompt_reset') delete monshiDrafts.prompt;
    if(featureKey==='monshi' && field==='clear') delete monshiDrafts.reply;
    itemCtx ? renderItem(st, true) : renderFeature(st, true); return;
  } // re-render in place from fresh values
  haptic('warn');
  if(revert) revert();
}
// setMulti persists a multiselect toggle WITHOUT re-rendering — the checkbox
// already reflects the new state, and re-rendering would re-fetch the whole
// (slow) group list and lose scroll position. That makes reverting a failed
// write the ONLY thing that can correct the row, since no server answer will
// ever repaint it.
async function setMulti(field, value, revert){
  haptic('light');
  // Same counter setField uses. This function never repaints, so revert is the
  // ONLY thing that can correct a row — and a stale failure arriving after the
  // owner has re-toggled that row would un-toggle it with no answer coming to
  // put it back. (Two writes racing on the server is not something the client
  // can order; this only stops a superseded ANSWER from being acted on.)
  const mine=++setSeq, ticket=featureTicket();
  const st=await feature(itemCtx?'itemset':'set', field, value);
  if(mine!==setSeq || !featureCurrent(ticket)) return;
  if(!st){ haptic('warn'); if(revert) revert(); return; }
  if(st.note) note(st.note, st.alert);
}
function paintFields(st, iconHTML, keep){
  const ticket=featureTicket();
  $('status').style.display='none';   // the title lives in the header
  const stage=$('stage');
  const paint=()=>{
    if(!featureCurrent(ticket)) return;
    stage.innerHTML='';
    const ic=document.createElement('div'); ic.className='featicon'; ic.innerHTML=iconHTML;
    ic.style.setProperty('--h', hueOf(featureKey||'')); // same hue as the tile that opened it
    stage.appendChild(ic);
    // Arriving on a screen is the moment worth animating: it plays once and rests.
    // Fire and forget — a feature with no animation simply keeps the drawn icon.
    playTGS(ic, itemCtx ? itemCtx.parentKey : featureKey);
    // One line saying what this feature does, above its controls. A title names a
    // feature; it does not explain it, and nobody here reads documentation.
    if(st.summary){
      const su=document.createElement('div'); su.className='featsum'; su.textContent=st.summary;
      stage.appendChild(su);
    }
    // Settings ride together in one card with hairline separators; info banners
    // and action buttons are not settings, so they break the group and stand on
    // their own. Consecutive runs group, so a screen can alternate.
    let group=null;
    // A screen can hide controls for the state it is in — a feature behind a
    // gate returns its explanation and hides the switches, so nothing renders
    // that the server would only refuse.
    const hidden=new Set(((st.values||{})._hide)||[]);
    (st.fields||[]).forEach(f=>{
      if(hidden.has(f.key)) return;
      const el=widget(f, st.values||{});
      if(f.type==='info' || f.type==='action'){ group=null; stage.appendChild(el); return; }
      if(!group){ group=document.createElement('div'); group.className='group'; stage.appendChild(group); }
      el.classList.add('ingroup');
      group.appendChild(el);
    });
    stage.classList.remove('out');
    const liveTitle = st.key==='online' && st.values && typeof st.values.enabled==='boolean'
      ? (st.values.enabled ? '✓ ' : '✗ ') + st.title
      : st.title;
    showBack(liveTitle);

// instead of leaving the English client-language guess in place.
if(deepKey === 'support'){ fa = true; applyLang(); }
// Casino was retired permanently. Treat old startapp links as ordinary hub
// opens so stale buttons cannot resurrect the screen.
const deepCasino = ['casino','casino_slots','casino_roulette'].includes(deepKey);
lastData = (deepKey && !['support','aihelp','sales'].includes(deepKey) && !deepCasino) ? 'p:'+chatId+':'+deepKey : 'p:'+chatId+':@manage';
// Paint the last hub before asking for a new one. The request still goes out and
// renderHub repaints in place when it lands, so the screen is never older than
// one round trip — but the owner sees their panel at once instead of a skeleton.
// Only for an open that is actually heading to the hub: a deep link is going
// somewhere else, and showing the hub first would be a flash of the wrong screen.
const bootFromCache = hubCached && tg.initData && !deepKey;
if(bootFromCache){ renderHub(hubCached, true); hideSplash(); } else { skeleton(); }
if(!tg.initData){
  // No Telegram launch data — don't fire a request that can only 401.
  showOutside();
} else {
  if(deepKey === 'channelpublisher') openChannelPublisher();
  else if(deepKey === 'sales') openBrand().finally(hideSplash);
  else if(deepKey === 'custombot') openCustomBot();
  else if(deepKey === 'aihelp') send('aihelp');
  else send(deepKey === 'support' ? 'support' : lastData);
}
</script>
</body>
</html>
