  .addform { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .addform input {
    width: 100%; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--rule);
    background: var(--sec); color: var(--text); font: inherit;
  }
  .addform .addbtn {
    padding: 13px; border-radius: var(--r-md); border: none; background: var(--accent);
    color: var(--onacc); font: inherit; font-weight: 700; cursor: pointer;
  }
  .addform .addbtn:active { transform: scale(.98); }
  .addnote { color: var(--hint); font-size: 12px; margin-top: 8px; line-height: 1.4; }
  /* The field the Add button is waiting on. */
  .needed { border-color: var(--crit) !important; background: color-mix(in srgb, var(--crit) 8%, transparent) !important; }
  /* info card (explanatory banner inside a screen) */
  /* An explanation, never a control — so it is recessed and carries a left rule
     the way a quote does. It used to be the most decorated non-interactive thing
     on the page (accent wash, accent border), which made it read as the most
     important button on any screen it appeared on. */
  .infocard {
    background: var(--inset);
    border: 0; border-inline-start: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
    border-radius: 0 var(--r-md) var(--r-md) 0; padding: 13px 15px; margin-bottom: 12px;
  }
  .infocard .it { font-weight: 700; font-size: var(--t-body); margin-bottom: 6px; }
  .infocard .ib { font-size: var(--t-sm); color: var(--text); opacity: .82; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .infocard .ib code { font-family: ui-monospace, Menlo, monospace; background: color-mix(in srgb, var(--text) 9%, transparent); padding: 1px 6px; border-radius: 6px; }
  .miner-tutorial { margin-top: 12px; }
  .miner-tutorial summary { cursor: pointer; font-weight: 600; padding-block: 8px; }
  .miner-tutorial video { display: block; width: 100%; max-width: 360px; max-height: 70vh; margin: 12px auto; border-radius: var(--r-md); background: #101827; }
  /* multiselect (group target picker) */
  /* The picker is a real list — one row per group, sometimes hundreds. Rows read
     as one continuous list with hairlines (not 200 floating pills), and each is
     a full-height tap target because the whole row toggles. */
  /* Capped in px AND in viewport height: 360px is a third of a tall phone but
     over half a small one, where it pushed the buttons under the list off the
     screen entirely. Second declaration only, so a WebView without dvh keeps
     the px cap. */
  .msel { max-height: 360px; max-height: min(360px, 50dvh); overflow-y: auto; margin-top: 10px;
    background: color-mix(in srgb, var(--text) 3%, transparent);
    border: 1px solid var(--rule); border-radius: var(--r-md); -webkit-overflow-scrolling: touch; }
  .mrow { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 8px 13px; cursor: pointer; }
  .mrow + .mrow { border-top: 1px solid var(--rule); }
  .mrow:active { background: color-mix(in srgb, var(--text) 5%, transparent); }
  .mrow .mlabel { flex: 1; min-width: 0; font-size: var(--t-sm); line-height: 1.4; word-break: break-word; }
  .mrow .switch { transform: scale(.82); flex: none; }
  .msel .empty { padding: 16px 14px; margin: 0; }
  /* How many of the list are on. It sits under the label, above the search, so
     the answer is on screen before the list is scrolled. */
  .mcount { margin-top: 6px; margin-inline-start: 42px; color: var(--hint); font-size: var(--t-cap); font-variant-numeric: tabular-nums; }
  .mcount.lit { color: var(--ok); font-weight: 650; }
  .mnone { padding: 14px 2px 2px; }
  html[dir=rtl] .mcount { margin-inline-start: 42px; }
  /* hub footer note */
  /* ---- Meow farmers ----
     One card per linked account, laid out like every other settings row:
     [status bubble] [name + state] [switch]. The switch is the whole control
     surface for on/off; everything else on the card is secondary. */
  .farmsum { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 2px 12px; }
  .farmsum .chip { font-size: var(--t-cap); }
  .farmsum .spacer { flex: 1; }
  .farmsum button.btn { flex: 0 0 auto; min-height: 38px; padding: 8px 13px; font-size: var(--t-cap); }
  .farmcard { padding: 0; }
  .farmcard .fmain { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .farmcard .fmain .fic { width: 40px; height: 40px; border-radius: 12px; font-size: 20px;
    background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text); }
  .farmcard.is-running .fmain .fic { background: color-mix(in srgb, var(--ok) 18%, transparent); }
  .farmcard.is-paused  .fmain .fic { background: color-mix(in srgb, var(--warn) 22%, transparent); }
  .farmcard.is-pending .fmain .fic { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .farmcard.is-error   .fmain .fic { background: color-mix(in srgb, var(--crit) 16%, transparent); }
  .farmcard .fmain .grow { flex: 1; min-width: 0; }
  .farmcard .fstate { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px;
    color: var(--hint); font-size: var(--t-cap); line-height: 1.4; }
  .farmcard .fstate::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--hint); flex: none; }
  .farmcard.is-running .fstate { color: var(--ok); }
  .farmcard.is-running .fstate::before { background: var(--ok); animation: livedot 2.4s ease-in-out infinite; }
  .farmcard.is-paused .fstate { color: var(--warn); }
  .farmcard.is-paused .fstate::before { background: var(--warn); }
  .farmcard.is-pending .fstate::before { background: var(--accent); }
  .farmcard.is-error .fstate { color: var(--crit); }
  .farmcard.is-error .fstate::before { background: var(--crit); }
  .farmcard .fphone { color: var(--hint); font-size: var(--t-micro); margin-top: 2px; direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  .farmcard .fearn { color: var(--hint); font-size: var(--t-cap); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .farmcard .fnote { margin: 0 16px 12px; padding: 10px 12px; border-radius: var(--r-md);
    background: color-mix(in srgb, var(--crit) 9%, transparent); color: var(--crit);
    font-size: var(--t-cap); line-height: 1.5; }
  .farmcard .fnote.info { background: color-mix(in srgb, var(--accent) 9%, transparent); color: var(--text); }
  .farmcard .factions { display: flex; gap: 8px; padding: 0 16px 14px; }
  .farmcard .factions button.btn { min-height: 42px; padding: 10px 12px; }
  .farmcard .factions button.btn.quiet { flex: 0 0 auto; background: transparent; color: var(--hint); }
  .farmcard .factions button.btn.danger { flex: 0 0 auto; background: color-mix(in srgb, var(--crit) 12%, transparent); color: var(--crit); border-color: transparent; }
  .farmcard .flogin { padding: 0 16px 14px; }
  .farmcard .flogin .ltitle { font-weight: 650; font-size: var(--t-body); }
  .farmcard .flogin .lhint { color: var(--hint); font-size: var(--t-cap); margin-top: 3px; line-height: 1.5; }
  .farmcard .flogin .textinput { font-size: 22px; letter-spacing: .28em; text-align: center; font-variant-numeric: tabular-nums; direction: ltr; }
  .farmcard .flogin .qr { display: block; width: 210px; max-width: 100%; margin: 12px auto 6px; border-radius: 14px;
    background: #fff; padding: 8px; box-sizing: border-box; }
  .farmcard .flogin .qrwait { text-align: center; color: var(--hint); font-size: var(--t-cap); margin-bottom: 4px; }
  .farmcard .flogin .lrow { display: flex; gap: 8px; margin-top: 10px; }
  .farmcard .flogin .lrow button.btn.quiet { flex: 0 0 auto; background: transparent; color: var(--hint); }
  .farmadd .seg { margin-top: 12px; }
  .farmadd .seg .opt { flex: 1; text-align: center; }
  .farmadd .textinput { direction: ltr; text-align: start; font-variant-numeric: tabular-nums; }
  .farmadd .actionbtn { margin: 12px 0 0; }
  .farmadd .addhint { color: var(--hint); font-size: var(--t-cap); margin-top: 10px; line-height: 1.5; }
  .farmempty { text-align: center; padding: 22px 16px 8px; color: var(--hint); font-size: var(--t-cap); line-height: 1.6; }
  .farmempty .big { font-size: 34px; margin-bottom: 6px; }
  /* Title and description are siblings, not nested: .tiles .tile .tl is a
     two-line clamp box further down, and anything placed inside it flows as
     one run of text. */
  .farmfeat .tile .ttx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; text-align: start; }
  .farmfeat .tile .ttx .tl { flex: none; -webkit-line-clamp: 1; }
  .farmfeat .tile .tsub { color: var(--hint); font-size: var(--t-cap); font-weight: 450; line-height: 1.45;
    unicode-bidi: plaintext; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .hubnote { color: var(--hint); font-size: 12.5px; text-align: center; line-height: 1.5; padding: 24px 20px 4px; }
  /* A hub can be visually calm while still leaving the first question unanswered:
     "is anything running right now?" This strip is deliberately informational,
     not another card to open. It gives the live state a single, stable place
     above the browse list and keeps the action beside the answer. */
  .hubpulse { display: flex; align-items: center; gap: 11px; min-height: 62px;
    margin: -4px 0 18px; padding: 10px 12px 10px 14px;
    background: color-mix(in srgb, var(--ok) 8%, var(--glass));
    border: 1px solid color-mix(in srgb, var(--ok) 28%, var(--rule));
    border-radius: var(--r-lg); box-shadow: var(--shadow); }
  .hubpulse.quiet { background: var(--glass); border-color: var(--rule); }
  .hubpulse .pulse-dot { width: 10px; height: 10px; flex: none; border-radius: 50%;
    background: var(--ok); box-shadow: 0 0 0 5px color-mix(in srgb, var(--ok) 14%, transparent);
    animation: livedot 2.4s ease-in-out infinite; }
  .hubpulse.quiet .pulse-dot { background: var(--hint); box-shadow: 0 0 0 5px color-mix(in srgb, var(--hint) 12%, transparent); animation: none; }
  .hubpulse .pulse-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .hubpulse .pulse-copy b { font-size: var(--t-sm); line-height: 1.25; }
  .hubpulse .pulse-copy small { color: var(--hint); font-size: var(--t-cap); line-height: 1.35; }
  .hubpulse .pulse-action { flex: none; min-height: 38px; padding: 8px 11px; border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
    border-radius: 999px; color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent);
    font: inherit; font-size: var(--t-cap); font-weight: 760; cursor: pointer; }
  .hubpulse.quiet .pulse-action { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 28%, transparent); background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .hubpulse .pulse-action:active { transform: scale(.95); }
  .noresult-action { min-height: 42px; margin-top: 13px; padding: 9px 15px; border: 1px solid var(--rule);
    border-radius: 999px; color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, transparent);
    font: inherit; font-size: var(--t-sm); font-weight: 700; cursor: pointer; }
  .noresult-action:active { transform: scale(.96); }

  /* ---- generic plugin screens as grouped list rows ----
     A panel section without a native widget screen mirrors its inline keyboard.
     Single buttons become settings-style rows in a group card (icon bubble,
     right-aligned value, chevron for drill-ins) so those screens read like the
     native ones instead of a stack of identical grey slabs. */
  .lrow {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px;
    padding: 12px 15px; border: none; background: none; cursor: pointer;
    font: inherit; color: var(--text); text-align: start; transition: background .12s;
  }
  .lrow:active { background: color-mix(in srgb, var(--text) 6%, transparent); }
  .lrow + .lrow { border-top: 1px solid var(--rule); }
  /* Same full-strength treatment as a tile's bubble, hued per feature. It was a
     12% accent wash, i.e. grey, on the rows that carry every generic screen. */
  .lrow .lic { --h: 210; width: 38px; height: 38px; flex: none; border-radius: var(--r-md);
    display: grid; place-items: center; font-size: 19px; color: #fff;
    background: hsl(var(--h) 62% 48%); box-shadow: inset 0 -1px 0 hsl(var(--h) 62% 38%); }
  .lrow .lic .i { width: 20px; height: 20px; }
  .lrow .ltxt { flex: 1; min-width: 0; font-size: var(--t-body); font-weight: 600; line-height: 1.35; }
  .lrow .lval { flex: none; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: var(--t-sm); font-weight: 700; color: var(--hint); font-variant-numeric: tabular-nums; }
  .lrow .lval.on  { color: var(--ok); display: inline-flex; align-items: center; gap: 6px; }
  .lrow .lval.off { color: var(--crit); display: inline-flex; align-items: center; gap: 6px; }
  .lrow .lchev { flex: none; color: var(--hint); font-size: 18px; display: grid; place-items: center; }
  html[dir=rtl] .lrow .lchev { transform: scaleX(-1); }
  .lrow.acc  .ltxt { color: var(--accent); }
  .lrow.ok   .ltxt { color: var(--ok); }
  .lrow.crit .ltxt { color: var(--crit); }
  /* The bubble carries the meaning too, not just the label. A row that turns
     something on is green and a row that wipes something is red before a word of
     it is read — which is what the panel meant by colouring the button and what
     the web view previously threw away into a tint of the text. */
  .lrow.ok   .lic { background: var(--ok);     box-shadow: none; }
  .lrow.crit .lic { background: var(--crit);   box-shadow: none; }
  .lrow.acc  .lic { background: var(--accent); box-shadow: none; }
  .lrow.busy { opacity: .55; pointer-events: none; }

  /* ---- toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--sa-bottom) + 22px);
    transform: translate(-50%, 20px); z-index: 60;
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    padding: 11px 16px; border-radius: var(--r-xl); box-shadow: var(--float);
    max-width: 88%; text-align: center; font-size: 14px; font-weight: 500;
    opacity: 0; transition: opacity .22s, transform .22s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---- bottom tab bar ----
     Shown only on root surfaces (hub / help / language): Home, Help, Support and
     Language are always one tap away instead of a tile group you scroll to find.
     Drill-in screens (features, chat, admin) hide it and use the back arrow. */
  #tabbar {
    position: fixed; left: 12px; right: 12px; bottom: calc(var(--sa-bottom) + 10px); z-index: 30;
    width: auto; max-width: 640px; margin-inline: auto;
    display: none; grid-template-columns: repeat(4, 1fr); gap: 2px;
    padding: 6px;
    background: var(--glass-strong);
    backdrop-filter: saturate(155%) blur(24px); -webkit-backdrop-filter: saturate(155%) blur(24px);
    border: 1px solid var(--rule); border-radius: 22px;
    box-shadow: 0 18px 42px -24px color-mix(in srgb, #000 82%, transparent), var(--float);
  }
  body.tabs #tabbar { display: grid; }
  body.tabs main { padding-bottom: calc(var(--sa-bottom) + 112px); }
  body.tabs #toast { bottom: calc(var(--sa-bottom) + 96px); }
  #tabbar button {
    position: relative; border: none; background: none; color: var(--hint); font: inherit;
    min-height: 54px; font-size: 10.5px; font-weight: 680; cursor: pointer; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px 2px;
    transition: color .15s, transform .1s, background .15s;
  }
  #tabbar button .tic {
    min-width: 38px; height: 25px; padding: 2px 9px; border-radius: 999px;
    font-size: 20px; line-height: 1; opacity: .76;
    transition: opacity .15s, background .15s, transform .15s;
  }
  #tabbar button:active { transform: scale(.92); }
  #tabbar button.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  #tabbar button.on .tic {
    opacity: 1; background: color-mix(in srgb, var(--accent) 15%, transparent); transform: translateY(-1px);
  }
  #tabbar button.on::after { content: ""; position: absolute; bottom: 4px; width: 16px; height: 3px;
    border-radius: 999px; background: var(--accent); box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 65%, transparent); }

  @media (hover:hover) {
    .tile:hover, .cat.foldable h3:hover { border-color: color-mix(in srgb, var(--accent) 34%, var(--rule)); }
    .tiles .tile:hover { background-color: color-mix(in srgb, var(--accent) 6%, transparent); }
    #tabbar button:hover { color: var(--text); background: color-mix(in srgb, var(--text) 5%, transparent); }
  }
  @media (min-width: 560px) {
    .quickcat .tiles { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .quickcat .tiles .tile { flex-direction: column; min-height: 116px; justify-content: center; text-align: center; }
    .quickcat .tiles .tile .tl { text-align: center; }
    .quickcat .tiles .tile::after { position: absolute; inset-inline-end: 12px; top: 50%; transform: translateY(-50%) rotate(45deg); }
    html[dir=rtl] .quickcat .tiles .tile::after { transform: translateY(-50%) rotate(-135deg); }
  }
  @media (max-width: 350px) {
    main { padding-inline: 12px; }
    .searchwrap { padding-inline: 12px; }
    .welcome { padding: 15px; }
    .welcome .av { width: 48px; height: 48px; border-radius: 16px; }
    .welcome .wname { font-size: 19px; }
    .chip { padding-inline: 9px; }
    .rtmetrics { grid-template-columns: 1fr; }
  }

  /* a tapped tile shows it's working until the next screen answers */
  .tile.busy { opacity: .55; transform: scale(.97); }
  /* "Not yet" — the shake a control gives when it is tapped while another
     navigation is still out. Symmetric, so it needs no RTL variant. */
  @keyframes waitnudge { 0%, 100% { transform: none; } 28% { transform: translateX(-3px); } 64% { transform: translateX(3px); } }
  .wait { animation: waitnudge .3s ease; }

  /* ---- Help screen: prose + tap-to-copy command pills ---- */
  .helpbody {
    white-space: pre-wrap;
    text-align: start;
    line-height: 2.1;
    font-size: 14px;
    color: var(--text);
    padding: 6px 14px 14px;
    animation: rise .28s ease both;
  }
  .helpbody code.cmd {
    display: inline-block;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    line-height: 1.4;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
    border-radius: 9px;
    padding: 2px 9px;
    margin: 3px 2px;
    cursor: pointer;
    -webkit-user-select: all; user-select: all;
    transition: transform .1s ease, background .2s, color .2s, border-color .2s;
  }
  .helpbody code.cmd::before { content: "⧉ "; opacity: .55; font-weight: 400; }
  .helpbody code.cmd:active { transform: scale(.95); }
  .helpbody code.cmd.copied {
    color: #34c759;
    background: color-mix(in srgb, #34c759 20%, transparent);
    border-color: color-mix(in srgb, #34c759 45%, transparent);
  }
  .helpbody code.cmd.copied::before { content: "✓ "; opacity: 1; }
  .helpbody .seg-bold { font-weight: 750; }
  .helpbody .seg-italic { font-style: italic; }
  .helpbody .seg-underline { text-decoration: underline; text-underline-offset: 2px; }
  .helpbody .seg-strike { text-decoration: line-through; }
  .helpbody .seg-spoiler { color: transparent; background: var(--rule); border-radius: 4px; }
  .helpbody .seg-spoiler:active, .helpbody .seg-spoiler:hover { color: inherit; }
  .helpbody .seg-blockquote {
    display: inline-block; border-inline-start: 3px solid var(--crit); padding-inline-start: 10px;
    color: var(--crit); font-weight: 650;
  }
  .helpbody pre.seg-pre {
    margin: 8px 0; padding: 10px 12px; overflow-x: auto; white-space: pre-wrap;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent); border-radius: 9px;
  }

  /* ---- Help menu: category headings + plugin chips ---- */
  .cathead {
    font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--hint);
    margin: 18px 4px 10px; padding-inline-start: 9px;
    border-inline-start: 3px solid var(--accent);
    line-height: 1.3;
  }
  .cathead:first-child { margin-top: 4px; }
  .chipgrid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  button.chip {
    flex: 0 1 auto; max-width: 100%;
    font-size: var(--t-sm); font-weight: 600; color: var(--text);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--r-md);
    padding: 11px 15px;
    cursor: pointer; text-align: center;
    transition: transform .1s ease, background .2s, border-color .2s;
  }
  button.chip .lbl { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.chip:active { transform: scale(.95); background: var(--sec); }
  button.chip:hover  { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

  /* ---- support chat + admin inbox ---- */
  .supporttop {
    display: flex; align-items: center; gap: 12px; padding: 14px 15px;
    background: var(--inset); border: 0; border-radius: 16px; margin-bottom: 12px;
  }
  .supporttop .sic {
    width: 44px; height: 44px; flex: none; border-radius: 14px; display: grid; place-items: center;
    font-size: 23px; background: color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .supporttop .stext { min-width: 0; flex: 1; }
  .supporttop .sname { font-size: 15px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .supporttop .smeta { color: var(--hint); font-size: 12px; margin-top: 2px; }
  .regbadge {
    display: inline-flex; align-items: center; border-radius: 8px; padding: 3px 8px;
    font-size: 11px; font-weight: 800; background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green);
  }
  .regbadge.guest { background: color-mix(in srgb, var(--hint) 16%, transparent); color: var(--hint); }
  .chatbox {
    /* dvh, not vh: when the Android keyboard opens the layout viewport shrinks
       but vh does not, so the composer was pushed under the keyboard. */
    min-height: 280px; max-height: min(58vh, 560px); max-height: min(58dvh, 560px);
    overflow-y: auto; padding: 8px 2px 14px;
    scroll-behavior: smooth; overscroll-behavior: contain;
  }
  .chatempty { color: var(--hint); text-align: center; padding: 70px 24px; line-height: 1.7; }
  .msg { display: flex; margin: 7px 0; }
  .msg.mine { justify-content: flex-end; }
  .bubble {
    max-width: 84%; padding: 10px 13px 7px; border-radius: 16px 16px 16px 5px;
    background: var(--card); border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word;
  }
  html[dir=rtl] .bubble { border-radius: 16px 16px 5px 16px; }
  .msg.mine .bubble {
    color: var(--onacc); background: var(--accent); border-color: transparent;
    border-radius: 16px 16px 5px 16px;
  }
  html[dir=rtl] .msg.mine .bubble { border-radius: 16px 16px 16px 5px; }
  .mtext { font-size: 14px; line-height: 1.55; }
  .mtime { opacity: .7; font-size: 10px; margin-top: 4px; text-align: end; font-variant-numeric: tabular-nums; }
  .composer {
    position: sticky; bottom: max(8px, var(--sa-bottom)); display: flex; align-items: flex-end; gap: 8px;
    padding: 9px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--card) 94%, transparent);
    border: 1px solid var(--line); box-shadow: var(--float);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .composer textarea {
    flex: 1; resize: none; min-height: 42px; max-height: 120px; padding: 10px 11px;
    border: none; outline: none; background: transparent; color: var(--text); font: inherit; line-height: 1.4;
  }
  .composer textarea::placeholder { color: var(--hint); }
  .composer button {
    width: 42px; height: 42px; flex: none; border: none; border-radius: var(--r-md);
    background: var(--accent); color: var(--onacc); font-size: 19px; cursor: pointer;
    display: grid; place-items: center;
  }
  .composer button:disabled { opacity: .5; }
  html[dir=rtl] .composer button { transform: scaleX(-1); }
  .unread {
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; display: grid; place-items: center;
    color: #fff; background: var(--red); font-size: 11px; font-weight: 800;
  }
  .lastmsg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* AI Help uses the same theme and bubbles as the existing chat surfaces. */
  .ai-entry { width:100%; margin:10px 0 14px; text-align:start; }
  .ai-toolbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .ai-toolbar b { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ai-button { min-height:42px; padding:8px 13px; border:1px solid var(--rule); border-radius:12px; background:var(--card); color:var(--text); font:inherit; cursor:pointer; }
  .ai-button:disabled { opacity:.5; cursor:default; }
  .ai-button.primary { background:var(--accent); color:var(--onacc); border-color:transparent; }
  .ai-button.danger { color:var(--red); }
  .ai-intro { padding:28px 16px; text-align:center; color:var(--hint); line-height:1.7; }
  .ai-intro h2 { color:var(--text); font-size:22px; margin:10px 0; }
  .ai-suggestions { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:18px; }
  .ai-thread { display:flex; align-items:center; gap:8px; margin:8px 0; }
  .ai-thread .ai-open { flex:1; min-width:0; text-align:start; padding:14px; }
  .ai-open b,.ai-open small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ai-open small { color:var(--hint); font-size:11px; margin-top:6px; }
  .ai-chat .chatbox { min-height:100px; max-height:none; flex:1; }
  .ai-chat { display:flex; flex-direction:column; height:calc(var(--ai-viewport,100dvh) - 160px); min-height:220px; }
  .ai-chat .composer { position:relative; bottom:auto; flex:none; margin-bottom:8px; }
  .ai-chat .composer textarea { min-width:0; }
  .ai-chat .bubble { max-width:92%; min-width:0; }
  .ai-chat .mtext { line-height:1.8; overflow-wrap:anywhere; text-align:start; }
  .ai-chat .mtext strong { font-weight:700; }
  .ai-chat .mtext blockquote { margin:8px 0; padding:9px 12px; border-inline-start:3px solid var(--accent); border-radius:8px; background:var(--inset); color:var(--text); white-space:pre-wrap; unicode-bidi:plaintext; }
  .ai-chat .mtext blockquote:first-child { margin-block-start:0; }
  .ai-chat .mtext blockquote:last-child { margin-block-end:0; }
  .ai-chat code { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:13px; background:var(--inset); color:var(--text); border-radius:4px; padding:2px 4px; unicode-bidi:isolate; overflow-wrap:anywhere; }
  .ai-chat blockquote code { background:var(--card); }
  .ai-chat .ai-pending { color:var(--hint); }
  .ai-chat .ai-retry { display:block; margin-top:9px; }
  .ai-error { color:var(--red); padding:10px 0; line-height:1.5; }
  .ai-notice { color:var(--hint); font-size:12px; line-height:1.6; margin:8px 0; }

  /* ---- finance ledger ----
     Three jobs used to share one scroll: a fleet overview, a chronological
     journal and a person lookup. Nothing led, so nothing could be tracked. They
     are now three segments, one at a time, under a scope bar that always says
     whose books are open.

     Icons are the app's own SVG set, not emoji. Every other screen already used
     .i; this one drew 🎁🤝🎡📥📤🎲 — which render differently on every device,
     sit on their own baseline and carry colours that fight the palette. That one
     inconsistency was most of why the screen read as cheap beside the rest. */

  /* the scope bar: whose books, never a mystery */
  .ledscope { display: flex; align-items: center; gap: 10px; background: var(--inset);
    border-radius: var(--r-md); padding: 9px 11px; margin-bottom: 12px; }
  .ledscope .sg { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center;
    font-size: 15px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .ledscope .st { flex: 1; min-width: 0; }
  .ledscope .st b { display: block; font-size: var(--t-sm); font-weight: 700; letter-spacing: -.1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ledscope .st span { display: block; font-size: var(--t-xs); color: var(--hint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ledscope .sx { width: 30px; height: 30px; border-radius: 999px; border: none; background: transparent;
    color: var(--hint); display: grid; place-items: center; font-size: 14px; cursor: pointer; flex: none; }
  .ledscope .sx:active { background: color-mix(in srgb, var(--text) 8%, transparent); }

  /* the segmented control */
  .ledseg { display: flex; background: var(--inset); border-radius: 999px; padding: 3px; margin-bottom: 16px; }
  .ledseg button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 40px; padding: 9px 6px; border: none; border-radius: 999px; background: transparent;
    color: var(--hint); font: inherit; font-size: var(--t-cap); font-weight: 700; cursor: pointer; }
  .ledseg button .i { font-size: 14px; }
  .ledseg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }

  /* summary: one headline number, not four equal cards */
  .lednet { padding: 2px 2px 16px; }
  .lednet .cap { font-size: var(--t-xs); font-weight: 700; color: var(--hint); letter-spacing: .06em; }
  .lednet .fig { display: flex; align-items: baseline; gap: 8px; margin-top: 3px; }
  .lednet .fig b { font-size: 36px; font-weight: 800; letter-spacing: -1.4px; line-height: 1.02; }
  .lednet .fig .u { font-size: var(--t-cap); color: var(--hint); font-weight: 600; }
  .lednet.pos .fig b { color: var(--green); }
  .lednet.neg .fig b { color: var(--red); }
  .ledduo { display: flex; gap: 10px; }
  .ledduo .h { flex: 1; display: flex; align-items: center; gap: 9px; background: var(--inset);
    border-radius: var(--r-md); padding: 10px 11px; min-width: 0; }
  .ledduo .g { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center;
    font-size: 15px; flex: none; }
  .ledduo .in .g { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
  .ledduo .out .g { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red); }
  .ledduo .k { display: block; font-size: 10.5px; color: var(--hint); font-weight: 600; }
  .ledduo .v { display: block; font-size: var(--t-sm); font-weight: 750; letter-spacing: -.2px; }
  .ledbal { display: flex; align-items: center; justify-content: space-between; background: var(--inset);
    border-radius: var(--r-md); padding: 11px 12px; margin-top: 10px; font-size: var(--t-cap); }
  .ledbal span { color: var(--hint); font-weight: 600; }
  .ledbal b { font-weight: 800; letter-spacing: -.2px; }

  /* by kind: a rail behind each bar, so "small" reads as small and not as missing */
  .ledkinds { display: flex; flex-direction: column; gap: 2px; }
  .ledkind { display: grid; grid-template-columns: 28px 1fr 70px auto 12px; align-items: center; gap: 11px;
    width: 100%; padding: 9px 10px; border: none; border-radius: var(--r-md); background: transparent;
    color: var(--text); font: inherit; font-size: var(--t-sm); text-align: start; cursor: pointer; }
  .ledkind:active { background: var(--inset); }
  .ledkind.on { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .ledkind .kg { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center;
    font-size: 14px; background: var(--inset); color: var(--hint); }
  .ledkind.on .kg { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
  .ledkind .kn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .ledkind .kb { display: flex; flex-direction: column; gap: 3px; }
  .ledkind .kb i { display: block; height: 5px; border-radius: 3px;
    background: color-mix(in srgb, var(--text) 8%, transparent); }
  .ledkind .kb i > u { display: block; height: 100%; border-radius: 3px; }
  .ledkind .kb i.in > u { background: var(--green); }
  .ledkind .kb i.out > u { background: var(--red); }
  .ledkind .kv { text-align: end; font-size: var(--t-xs); font-weight: 700; white-space: nowrap; line-height: 1.35; }
  .ledkind .kv .p { color: var(--green); display: block; }
  .ledkind .kv .m { color: var(--red); display: block; }
  .ledmorekinds { width: 100%; padding: 9px; margin-top: 4px; border: none; border-radius: var(--r-md);
    background: transparent; color: var(--accent); font: inherit; font-size: var(--t-xs);
    font-weight: 700; cursor: pointer; }
  .ledmorekinds:active { background: var(--inset); }

  /* the journal */
  .ledfilters { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 4px; }
  .ledfilters button, .ledfilters .static { display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border: none; border-radius: 999px; background: var(--card); color: var(--text);
    font: inherit; font-size: var(--t-xs); font-weight: 650; cursor: pointer; max-width: 100%; }
  .ledfilters .static { background: var(--inset); color: var(--hint); cursor: default; }
  .ledfilters .scope { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .ledfilters .i { font-size: 12px; }
  .ledfilters button:active { transform: scale(.96); }
  .leddate { padding: 16px 4px 7px; font-size: var(--t-xs); font-weight: 700;
    color: var(--hint); letter-spacing: .06em; }
  .ledrow { display: grid; grid-template-columns: 34px 1fr auto 12px; align-items: center; gap: 11px;
    width: 100%; padding: 11px 13px; border: none; background: transparent; color: var(--text);
    font: inherit; text-align: start; cursor: pointer; }
  .ledrow + .ledrow { border-top: 1px solid color-mix(in srgb, var(--text) 7%, transparent); }
  .ledrow:active { background: var(--inset); }
  /* A row that goes nowhere must not look like it does. */
  .ledrow.flat { cursor: default; }
  .ledrow.flat::after { content: none; }
  .ledrow.flat:active { background: transparent; }
  .ledrow.flat::after { display: none; }
  .ledrow .ld-ic { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center;
    font-size: 17px; }
  .ledrow.in  .ld-ic { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
  .ledrow.out .ld-ic { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
  .ledrow .ld-mid { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .ledrow .ld-kind { font-size: var(--t-sm); font-weight: 650; letter-spacing: -.1px; }
  .ledrow .ld-who { opacity: .55; font-weight: 400; }
  .ledrow .ld-who::before { content: " · "; }
  .ledrow .ld-sub { font-size: var(--t-xs); color: var(--hint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The note says WHY the money moved. As the tail of the meta line it was always
     the part the ellipsis ate, so it never appeared on a phone. */
  .ledrow .ld-note { font-size: var(--t-xs); color: var(--hint); opacity: .85; margin-top: 1px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; overflow-wrap: anywhere; }
  .ledrow .ld-amt { text-align: end; white-space: nowrap; }
  .ledrow .ld-amt b { display: block; font-size: var(--t-sm); font-weight: 800; letter-spacing: -.3px; }
  .ledrow .ld-amt i { display: block; font-style: normal; font-size: 10.5px; color: var(--hint);
    font-weight: 500; margin-top: 1px; }
  .ledrow.in  .ld-amt b { color: var(--green); }
  .ledrow.out .ld-amt b { color: var(--red); }

  /* find a person */
  .ledsbox { position: relative; margin-bottom: 12px; }
  .ledsbox .i { position: absolute; inset-inline-start: 13px; top: 50%; transform: translateY(-50%);
    font-size: 16px; color: var(--hint); pointer-events: none; }
  .ledsbox input { width: 100%; box-sizing: border-box; padding: 13px 14px; padding-inline-start: 40px;
    border-radius: var(--r-md); border: 1px solid var(--rule); background: var(--inset);
    color: var(--text); font: inherit; font-size: var(--t-sm); }
  .ledhint { font-size: var(--t-xs); color: var(--hint); margin: 0 4px 12px; line-height: 1.6; }
  .ledperson { display: grid; grid-template-columns: 36px 1fr auto 12px; align-items: center; gap: 11px;
    width: 100%; padding: 11px 13px; border: none; background: transparent; color: var(--text);
    font: inherit; text-align: start; cursor: pointer; }
  .ledperson + .ledperson { border-top: 1px solid color-mix(in srgb, var(--text) 7%, transparent); }
  .ledperson:active { background: var(--inset); }
  .ledperson .pav { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
    font-size: 14px; font-weight: 800; background: var(--inset); color: var(--hint); }
  .ledperson .pav.bot { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .ledperson .pn { display: block; font-size: var(--t-sm); font-weight: 650;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ledperson .pu { display: block; font-size: var(--t-xs); color: var(--hint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ledperson .pc { text-align: end; font-size: var(--t-xs); font-weight: 700; white-space: nowrap; }
  .ledperson .pc i { display: block; font-style: normal; font-weight: 600; color: var(--hint); margin-top: 2px; }
  .ledperson::after { content: ""; width: 9px; height: 9px; flex: none;
    border-top: 2.5px solid var(--hint); border-inline-end: 2.5px solid var(--hint);
    transform: rotate(45deg); }
  html[dir=rtl] .ledperson::after { transform: rotate(-135deg); }
  /* Never a dead end: say what else can be searched, not just "0 results". */
  .lednores { text-align: center; padding: 28px 16px; color: var(--hint); }
  .lednores .big { font-size: 26px; opacity: .45; display: flex; justify-content: center; margin-bottom: 10px; }
  .lednores b { display: block; color: var(--text); font-size: var(--t-sm); margin-bottom: 5px; }
  .lednores span { font-size: var(--t-xs); line-height: 1.7; }
  .ledclear { display: inline-block; margin-top: 10px; padding: 8px 15px; border: none; border-radius: 999px;
    background: var(--inset); color: var(--accent); font: inherit; font-size: var(--t-xs);
    font-weight: 700; cursor: pointer; }

  /* the head's shape while the numbers are in flight, at the height they will take */
  .stat.sk, .ledkind.sk { background: var(--inset); animation: skpulse 1.2s ease-in-out infinite; }
  .ledkind.sk { height: 40px; display: block; border-radius: var(--r-md); }
  .stat.sk .sv, .stat.sk .sl { color: transparent; }
  @keyframes skpulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
  @media (prefers-reduced-motion: reduce) { .stat.sk, .ledkind.sk { animation: none; } }

  /* ---- casino (mini app) ---- */
  .czwrap { padding-bottom: 18px; }
  .czgames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 2px 0 12px; }
  .czgame { padding: 9px 5px; border: none; border-radius: var(--r-sm); background: var(--sec); color: var(--text);
    font: inherit; font-size: var(--t-xs); font-weight: 800; cursor: pointer; opacity: .72; }
  .czgame.on { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); opacity: 1; }
  .czbal { text-align: center; margin: 2px 0 6px; }
  .czbal b { font-size: 26px; font-weight: 800; letter-spacing: .5px; }
  .czbal i { display: block; font-style: normal; font-size: var(--t-xs); font-weight: 400; opacity: .5; margin-top: 3px; }

  /* The stage: a glow behind the die that only wakes up on a result, so the
     screen is calm until something actually happens. */
  .czstage { position: relative; height: 156px; display: grid; place-items: center; margin: 6px 0 2px; }
  .czglow {
    position: absolute; width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 34%, transparent), transparent 68%);
    opacity: .30; transition: opacity .35s, background .35s;
  }
  .czstage.win  .czglow { opacity: 1; background: radial-gradient(circle, rgba(245,197,24,.65), transparent 68%); }
  .czstage.lose .czglow { opacity: .5; background: radial-gradient(circle, rgba(227,86,80,.4), transparent 68%); }

  /* The die is Telegram's own animation, rendered as SVG into this box. Nothing
     here transforms it — the artwork already contains the throw, and stacking a
     CSS spin on top is what made the previous version look like a knock-off. */
  .czdie { width: 168px; height: 168px; }
  .czdie svg { display: block; width: 100%; height: 100%; }
  /* Fallback only: if the animation cannot be fetched the game still runs, with
     a plain glyph in its place. */
  .czdie.glyph { font-size: 92px; line-height: 168px; text-align: center; }

  /* The one flourish that is ours: a short cheer after it has landed. Applied to
     the container, so it never fights the animation inside it. */
  .czstage.win .czdie { animation: czCheer .62s ease-out 2; }
  @keyframes czCheer { 0%,100% { transform: translateY(0) scale(1); } 45% { transform: translateY(-12px) scale(1.06); } }
  .czstage.lose .czdie { opacity: .75; transition: opacity .3s; }

  .czslots { display: flex; gap: 8px; direction: ltr; }
  .czreel { width: 76px; height: 76px; display: grid; place-items: center; border-radius: var(--r-md);
    background: linear-gradient(145deg, var(--sec), var(--inset)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent);
    font-size: 39px; transition: transform .25s, box-shadow .25s; }
  .czslots.spin .czreel { animation: czReelSpin .16s linear infinite; filter: blur(.35px); }
  .czslots.spin .czreel:nth-child(2) { animation-delay: .045s; }
  .czslots.spin .czreel:nth-child(3) { animation-delay: .09s; }
  @keyframes czReelSpin { 0% { transform: translateY(-10px) scale(.94); opacity: .68; } 50% { transform: translateY(10px) scale(1.04); opacity: 1; } 100% { transform: translateY(-10px) scale(.94); opacity: .68; } }
  .czstage.win .czreel { box-shadow: 0 0 20px rgba(245,197,24,.55); transform: translateY(-5px); }
  .czroulette { width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; position: relative;
    background: conic-gradient(#c83737 0 12.5%, #20242d 12.5% 25%, #c83737 25% 37.5%, #20242d 37.5% 50%,
      #c83737 50% 62.5%, #20242d 62.5% 75%, #c83737 75% 87.5%, #20242d 87.5% 100%);
    box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 16%, transparent), 0 10px 28px rgba(0,0,0,.22); }
  .czroulette::after { content: ''; position: absolute; inset: 17px; border-radius: 50%; background: var(--bg); }
  .czroulette b, .czroulette small { position: relative; z-index: 1; }
  .czroulette b { font-size: 38px; line-height: 1; }
  .czroulette small { margin-top: -34px; font-size: var(--t-xs); opacity: .7; }
  .czroulette.spin { animation: czRouletteSpin 1.35s cubic-bezier(.12,.72,.18,1) both; }
  @keyframes czRouletteSpin { 0% { transform: rotate(0deg) scale(.96); } 72% { transform: rotate(1040deg) scale(1.04); } 100% { transform: rotate(1240deg) scale(1); } }
  .czstage.win .czroulette { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 20%, transparent), 0 0 32px rgba(245,197,24,.68); }
  .czpicks.roulette-grid { gap: 5px; }
  .czpicks.roulette-grid .czpick { min-width: 52px; padding: 8px 5px; font-size: var(--t-xs); }
  .czpick.red.on, .czpick.red { background: #b8383e; color: #fff; }
  .czpick.black.on, .czpick.black { background: #252a34; color: #fff; }
  .czpick.red:not(.on), .czpick.black:not(.on) { opacity: .86; }

  /* Confetti: a couple of dozen spans, thrown once on a win. No library — the
     page runs under a strict CSP, and this is cheaper than one anyway. */
  .czburst { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .czburst i {
    position: absolute; left: 50%; top: 46%; width: 7px; height: 11px; border-radius: 2px;
    animation: czFall 1.25s ease-out forwards; animation-delay: var(--d, 0ms); opacity: 0;
  }
  @keyframes czFall {
    0%   { opacity: 1; transform: translate(0,0) rotate(0); }
    100% { opacity: 0; transform: translate(var(--x,0), 150px) rotate(var(--r,360deg)); }
  }

  .czres { min-height: 26px; text-align: center; font-weight: 800; font-size: 17px; margin: 2px 0 8px; }
  .czres.win  { color: #f5c518; animation: czPop .4s cubic-bezier(.18,1.6,.4,1); }
  .czres.lose { color: var(--red, #e35650); opacity: .85; }
  @keyframes czPop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  .czlab { font-size: var(--t-xs); font-weight: 700; opacity: .55; margin: 12px 0 7px; }
  .czrow { display: flex; flex-wrap: wrap; gap: 7px; }
  .czchip, .czpick {
    flex: 1 1 auto; min-width: 62px; padding: 10px 12px; border: none; border-radius: var(--r-sm);
    background: var(--sec); color: var(--text); font: inherit; font-size: var(--t-sm); font-weight: 600;
    text-align: center; cursor: pointer; transition: transform .08s, background .15s;
  }
  .czchip.all { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .czpick.wide { flex: 1 1 45%; }
  .czpick.on { background: var(--accent); color: #fff; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .czchip:active, .czpick:active { transform: scale(.94); }
  .czin {
    width: 100%; margin-top: 8px; padding: 12px; border: none; border-radius: var(--r-sm);
    background: var(--sec); color: var(--text); font: inherit; font-size: var(--t-sm);
    font-weight: 700; text-align: center;
  }
  .czgo {
    width: 100%; margin-top: 16px; padding: 15px; border: none; border-radius: var(--r-md);
    background: linear-gradient(135deg, #f5c518, #e0a800); color: #241d00;
    font: inherit; font-weight: 800; font-size: 16px; cursor: pointer;
  }
  .czgo small { display: block; font-size: var(--t-xs); font-weight: 600; opacity: .75; margin-top: 2px; }
  .czgo:disabled { opacity: .5; }
  .czgo:active { transform: scale(.985); }

  /* ---- mixed-script labels ----
     LAST in the file on purpose: each of these four labels also has its own rule
     further up setting word-break, and this has to be the final word on all of
     them rather than four scattered edits that the next new rule can undo.

     A row label is rarely one script. A Latin model name, a unit, a price and a
     trend arrow all land inside an RTL row, and the page's own direction then
     reorders them — "📱 iPhone 15 Pro" and "128 MB" came out inside out.
     `unicode-bidi: plaintext` is the whole fix: it gives every label its own base
     direction from its first strong character (what dir="auto" does) AND isolates
     it from the row around it, in one property, with no per-label attribute to
     remember at each of the four places labels are built.

     The clamp is the other half. Farsi runs 30-60% longer than English, so with
     no line limit a row grew silently past its min-height and a card of five rows
     had five different heights; `break-word` also breaks Arabic script mid-word,
     so a word now breaks only when one genuinely cannot fit alone. */
  .lrow .ltxt, .tiles .tile .tl, .mrow .mlabel, .item .txt {
    unicode-bidi: plaintext;
    word-break: normal; overflow-wrap: break-word;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  /* A list item's label IS its content — it is how the owner tells one saved
     answer from another — so it gets a line more before the ellipsis. */
  .item .txt { -webkit-line-clamp: 3; }

  /* Calm surfaces and consistent spacing across the hub and settings. Telegram
     still supplies the palette; semantic colors are reserved for actual state. */
  :root { --r-lg: 18px; --r-xl: 22px; --shadow: 0 2px 6px rgb(0 0 0 / .06); }
  body::before { opacity: .24; }
  body::after { display: none; }
  header { min-height: 60px; background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .hbtn.back .flip { transform: scaleX(-1); }
  html[dir=rtl] .hbtn.back .flip { transform: none; }
  .searchwrap { top: calc(var(--sa-top) + 60px); padding-block: 12px; background: var(--bg); }
  .searchwrap input { border-radius: 14px; background: var(--inset); border-color: transparent; box-shadow: none; }
  .searchwrap input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .searchwrap .sclear { width: 44px; height: 44px; inset-inline-end: 18px; background: transparent; }
  main { padding-top: 12px; }
  .welcome { padding: 20px; gap: 18px; background: var(--card); border-color: var(--rule); box-shadow: none; }
  .welcome::before, .welcome::after { display: none; }
  .welcome .wbrand { opacity: .035; }
  .brandline { padding-bottom: 0; border: 0; }
  .brandline .bmark { width: 30px; height: 30px; border-radius: 9px; box-shadow: none; }
  .brandline .bcopy small { font-size: 12px; }
  .brandline .bdot { box-shadow: none; width: 6px; height: 6px; }
  .welcome .av { box-shadow: none; border-radius: 50%; }
  .welcome .wname { font-size: 23px; font-weight: 700; }
  .brand-actions { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
  .brand-actions button { min-height: 46px; font-size: 13px; font-weight: 600; border-radius: 12px; }
  .brand-actions button.primary { background: var(--accent); box-shadow: none; }
  .brand-actions .balabel { white-space: normal; overflow: visible; }
  .rtmetric { box-shadow: none; border-radius: 12px; }
  .hubpulse { background: var(--inset); border: 0; box-shadow: none; padding: 12px 14px; }
  .hubpulse.quiet { background: var(--inset); }
  .hubpulse .pulse-dot { animation: none; box-shadow: none; width: 8px; height: 8px; }
  .hubpulse .pulse-action { min-height: 44px; border: 0; border-radius: 10px; }
  .hub-browse { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 26px 2px 14px; }
  .hub-browse h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .hub-browse { scroll-margin-top: calc(var(--sa-top) + 142px); }
  .hub-browse p { margin: 3px 0 0; color: var(--hint); font-size: 13px; }
  .hub-browse button { flex: none; min-height: 44px; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 12px; background: var(--card); color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; }
  .cat { margin-bottom: 18px; scroll-margin-top: calc(var(--sa-top) + 142px); }
  .cat h3 { border-inline-start: 0; padding-inline-start: 2px; text-transform: none; letter-spacing: 0; font-size: 14px; }
  .cat.foldable { border: 1px solid var(--rule); border-radius: var(--r-lg); overflow: hidden; background: var(--card); margin-bottom: 10px; }
  .cat.foldable h3, .cat.foldable.open h3, .cat.foldable.searching h3 {
    min-height: 64px; margin: 0; padding: 12px 16px; gap: 12px; border: 0;
    border-radius: 0; background: transparent; box-shadow: none; color: var(--text);
    font-size: 15px; text-transform: none; letter-spacing: 0; backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  .cat.foldable h3 .cic, .cat.foldable.open h3 .cic, .cat.foldable.searching h3 .cic { display: grid; width: 36px; height: 36px; font-size: 18px; border-radius: 10px; background: var(--inset); color: var(--accent); }
  .cat.foldable h3 .n { font-size: 12px; background: var(--inset); box-shadow: none; }
  .tiles, .group { background: var(--card); box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .cat.foldable .tiles { border: 0; border-top: 1px solid var(--rule); border-radius: 0; }
  .tiles .tile { min-height: 70px; padding: 13px 16px; }
  .tiles .tile .ic { width: 38px; height: 38px; border-radius: 11px; box-shadow: none; background: hsl(var(--h) 65% 55% / .12); color: hsl(var(--h) 75% 68%); }
  :root[data-scheme="light"] .tiles .tile .ic { background: hsl(var(--h) 65% 45% / .09); color: hsl(var(--h) 65% 38%); }
  .tiles .tile .tl { font-weight: 550; }
  .tiles .tile::after { width: 7px; height: 7px; border-width: 1.5px; opacity: .65; }
  .tiles .tile .tv { font-size: 12px; max-width: 32%; }
  .tiles .tile .tv.off { color: var(--hint); }
  .tiles .tile .tv.off::before { display: none; }
  .tiles .tile .tv.on::before, .lrow .lval.on::before { animation: none; }
  .quickcat .tiles { gap: 8px; background: none; border: 0; }
  .quickcat .tiles .tile { border: 1px solid var(--rule); border-radius: 14px; background: var(--card); min-height: 68px; }
  .quickcat .tiles .tile + .tile { border-top: 1px solid var(--rule); }
  .field { padding: 18px 16px; }
  .field .fhint { font-size: 13px; line-height: 1.6; }
  .switch input:not(:checked) + .slider { background: color-mix(in srgb, var(--text) 24%, var(--card)); }
  .switch input:checked + .slider { animation: none; box-shadow: none; }
  .featicon { box-shadow: none; }
  #custombot-tile { display: flex; flex-direction: row; align-items: center; gap: 12px; width: 100%; min-height: 70px; padding: 14px 16px; margin-top: 18px; background: var(--card); border: 1px solid var(--rule); box-shadow: none; text-align: start; }
  #custombot-tile .ic { width: 38px; height: 38px; font-size: 21px; box-shadow: none; }
  #custombot-tile .tl { flex: 1; text-align: start; font-size: 15px; }
  #custombot-tile .tv { color: var(--accent); font-size: 13px; }
  #tabbar { bottom: 0; left: 0; right: 0; max-width: 712px; padding: 8px 12px calc(var(--sa-bottom) + 8px); border-radius: 18px 18px 0 0; background: var(--bg); box-shadow: 0 -4px 20px rgb(0 0 0 / .05); }
  #tabbar button { min-height: 56px; font-size: 12px; font-weight: 600; gap: 5px; }
  #tabbar button.on { background: transparent; }
  #tabbar button.on::after { display: none; }
  #tabbar button.on .tic { transform: none; }
  @media (min-width: 560px) {
    .quickcat .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .quickcat .tiles .tile { flex-direction: row; justify-content: flex-start; text-align: start; min-height: 72px; }
    .quickcat .tiles .tile .tl { text-align: start; }
  }
  @media (max-width: 350px) {
    .welcome { padding: 16px; }
    .brand-actions button.primary { grid-column: auto; }
    .brand-actions button { font-size: 12px; }
    .tiles .tile { gap: 9px; padding-inline: 12px; }
  }

  /* Monshi: compact setup cards with a clear reading order in both directions. */
  .monshi-page { display:grid; gap:16px; padding-bottom:20px; }
  .monshi-hero { padding:20px; border-radius:24px; background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 17%,var(--card)),var(--card)); border:1px solid var(--rule); }
  .monshi-heading { display:flex; align-items:center; gap:12px; }
  .monshi-mark { display:grid; place-items:center; flex:0 0 44px; height:44px; border-radius:15px; background:var(--accent); color:var(--onacc); font-size:28px; }
  .monshi-heading h2 { font-size:19px; margin:0 0 5px; }
  .monshi-heading p,.monshi-sub { font-size:12px; line-height:1.7; color:var(--hint); margin:6px 0 12px; }

  /* Workspace design system. Shared by the Telegram WebView and desktop. */
  :root {
    --bg:#101719; --sec:#141e20; --card:#192426; --text:#e9f0ef; --hint:#9eafad;
    --accent:#6dd9bc; --onacc:#102e26; --accent2:#79aeb4;

    --line:#293739; --rule:#354547; --inset:#202e30; --surface:var(--card); --hold:var(--sec);
    --glass:#192426f0; --glass-strong:#192426fa;
    --shadow:0 2px 3px #00000009,0 8px 22px -18px #00000055;
    --float:0 12px 44px #00000044; --dash-rail:236px;
    --r-sm:8px; --r-md:10px; --r-lg:14px; --r-xl:18px;
    --t-body:15px; --t-sm:14px; --t-cap:13px; --t-xs:12px;
  }
  :root[data-scheme="light"] {
    --bg:#f5f7f8; --sec:#fff; --card:#fff; --text:#202d32; --hint:#617278;
    --accent:#137c66; --onacc:#fff; --accent2:#388e9a;
    --green:#168767; --green2:#13745a; --ok:#168767; --warn:#996212; --crit:#c5423a;
    --line:#e9eef0; --rule:#dbe4e6; --inset:#f2f6f6; --surface:#fff; --hold:#f8fafb;
    --glass:#ffffffef; --glass-strong:#fffffffa;
    --shadow:0 2px 3px #16343d03,0 8px 22px -18px #16343d30;
    --float:0 12px 44px #16343d20;

  body { font-size:15px; background:var(--bg); height:auto; min-height:100%; }
  body::before,body::after { display:none; }
  html { color-scheme:dark; }
  html[data-scheme="light"] { color-scheme:light; }
  button,input,select,textarea { font-family:inherit; }
  button { touch-action:manipulation; }
  button:focus-visible,a:focus-visible,select:focus-visible,[role="button"]:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .workspace-nav { display:none; }
  .dash-skip { position:fixed; inset-block-start:8px; inset-inline-start:12px; transform:translateY(-150%); z-index:10000; padding:12px 18px; border-radius:10px; background:var(--accent); color:var(--onacc); }

  .dash-heading { display:flex; align-items:center; justify-content:space-between; gap:18px; margin:5px 0 26px; }

  .dash-heading h1 { margin:8px 0; font-size:clamp(25px,2.6vw,34px); font-weight:700; line-height:1.25; letter-spacing:-1.1px; }

  .dash-side { display:flex; flex-direction:column; gap:14px; min-width:0; }
  .dash-side .dash-assistant { display:flex; align-items:center; gap:14px; margin:0; padding:22px; border:1px solid color-mix(in srgb,var(--accent) 25%,var(--rule)); border-radius:14px; background:color-mix(in srgb,var(--accent) 7%,var(--card)); color:var(--text); text-align:start; width:100%; cursor:pointer; box-shadow:var(--shadow); }

  /* Feature workspace: shared surfaces and controls stay consistent with the shell. */
  .card, .tool, .group, .field, .supporttop, .monshi-card, .monshi-hero {
    background: var(--card); border-color: var(--rule); border-radius: 14px;
    box-shadow: 0 1px 3px rgb(0 0 0 / .035);
  }
  .card, .tool { padding: 22px; margin-bottom: 18px; }
  .card .body { line-height: 1.75; overflow-wrap: anywhere; }
  .group { margin-bottom: 20px; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .field { padding: 22px; margin-bottom: 16px; }
  .field.ingroup { background: transparent; box-shadow: none; }
  .field.ingroup + .field.ingroup { border-top-color: var(--line); }
  .field .fhead { gap: 12px; }
  .field .fic { width: 34px; height: 34px; border-radius: 10px; color: var(--hint); background: var(--inset); }
  .field .flabel { font-size: 15px; font-weight: 600; line-height: 1.55; overflow-wrap: anywhere; }
  .field .fhint { max-width: 65ch; font-size: 13px; line-height: 1.7; margin-top: 4px; overflow-wrap: anywhere; }
  .field.rowflex { gap: 18px; }
  .featicon { width: 50px; height: 50px; font-size: 24px; border-radius: 13px; margin: 8px auto 14px;
    background: color-mix(in srgb, var(--accent) 10%, var(--card)); color: var(--accent); box-shadow: none; }
  :root[data-scheme="light"] .featicon { background: color-mix(in srgb, var(--accent) 8%, var(--card)); color: var(--accent); }
  .featicon.tgs { background: transparent; }
  .featsum { margin: 0 auto 26px; font-size: 15px; line-height: 1.75; max-width: 52ch; }
  .switch { height: 44px; }
  .switch input { position:absolute; inset:0; width:100%; height:100%; margin:0; z-index:1; cursor:pointer; }
  .switch .slider { inset: 7px 0 8px; }
  .switch input:checked + .slider { background: var(--accent); animation: none; box-shadow: none; }
  .switch input:not(:checked) + .slider { background: color-mix(in srgb, var(--hint) 42%, var(--card)); }
  .slider::before { box-shadow: 0 1px 3px rgb(0 0 0 / .18); }
  .seg { gap: 8px; margin-top: 14px; }
  .seg .opt { min-height: 44px; padding: 10px 15px; font-weight: 550; border-radius: 10px;
    background: var(--card); white-space: normal; overflow-wrap: anywhere; }
  .seg .opt.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--card));
    border-color: color-mix(in srgb, var(--accent) 55%, var(--rule)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 16%, transparent); }
  .step { gap: 5px; }
  .step button { width: 44px; height: 44px; border-radius: 10px; background: var(--card); font-weight: 500; }
  .step .val { min-width: 42px; font-weight: 650; font-size: 16px; }
  .inp { gap: 9px; margin-top: 14px; }
  .inp input, .inp textarea, .textinput, .tool input, .tool textarea, .addform input,
  .monshi-editor textarea, .monshi-duration input, .monshi-duration select {
    min-height: 46px; min-width: 0; max-width: 100%; font-size: 16px;
    background: var(--bg); border: 1px solid var(--rule); border-radius: 10px;
    transition: border-color .15s, box-shadow .15s;
  }
  .inp input:focus, .inp textarea:focus, .textinput:focus, .tool input:focus,
  .tool textarea:focus, .addform input:focus, .zsel:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .inp input::placeholder, .inp textarea::placeholder, .textinput::placeholder,
  .tool input::placeholder, .tool textarea::placeholder, .addform input::placeholder { color: var(--hint); opacity: .85; }
  .inp textarea, .tool textarea { min-height: 110px; line-height: 1.7; }
  .inp button, .additem { min-width: 46px; min-height: 46px; flex: none; padding-inline: 14px; border-radius: 10px; }
  .field .inp button.save { color: var(--hint); border: 1px solid var(--rule); background: var(--card); }
  .field.dirty .inp button.save { border-color: var(--accent); background: var(--accent); color: var(--onacc); }
  .zsel { min-height: 46px; margin-top: 14px; font-size: 16px; border-radius: 10px; padding-inline-end: 35px; }
  .addform { gap: 10px; margin-top: 16px; }

  .addnote, .addhint, .toolnote { font-size: 13px; line-height: 1.7; }
  .toolnote { text-align: start; }
  .items { gap: 8px; margin-top: 14px; }

  .item .del { width: 44px; height: 44px; border-radius: 9px; background: transparent; }
  .item.tappable { border-inline-start-width: 2px; }
  .infocard { padding: 18px 20px; margin-bottom: 20px; border: 1px solid var(--line); border-inline-start: 3px solid var(--accent);
    border-radius: 12px; background: color-mix(in srgb, var(--accent) 4%, var(--card)); }
  .infocard .it { font-size: 14px; font-weight: 650; margin-bottom: 5px; }
  .infocard .ib { font-size: 14px; line-height: 1.85; opacity: 1; color: var(--hint); }
  .msel { border-radius: 10px; background: var(--bg); }
  .mrow { min-height: 58px; padding: 7px 14px; }
  .mrow .switch { transform: none; }
  .mrow .mlabel { font-size: 14px; line-height: 1.6; }
  .mcount { margin-inline-start: 46px; font-size: 13px; }
  html[dir=rtl] .mcount { margin-inline-start: 46px; }
  .lrow { min-height: 68px; padding: 15px 20px; }
  .lrow + .lrow { border-top-color: var(--line); }
  .lrow .lic { width: 36px; height: 36px; border-radius: 10px; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 9%, var(--card)); box-shadow: none; }

  .lrow.ok .lic { background: color-mix(in srgb, var(--ok) 10%, var(--card)); color: var(--ok); }
  .lrow.crit .lic { background: color-mix(in srgb, var(--crit) 10%, var(--card)); color: var(--crit); }
  .lrow.acc .lic { background: color-mix(in srgb, var(--accent) 9%, var(--card)); color: var(--accent); }
  button.btn, .actionbtn { min-height: 46px; border-radius: 10px; font-size: 14px; font-weight: 600; line-height: 1.5; }
  button.btn { padding: 11px 15px; background: var(--card); }

  button.btn.success { color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, var(--card)); }
  button.btn.danger { color: var(--crit); background: color-mix(in srgb, var(--crit) 6%, var(--card)); }
  button.btn.on { background: var(--accent); color: var(--onacc); }
  .actionbtn { padding: 12px 18px; margin-bottom: 16px; }
  .tool h4 { font-size: 16px; font-weight: 650; line-height: 1.5; margin-bottom: 16px; }
  .tool button { min-height: 46px; border-radius: 10px; font-size: 14px; font-weight: 600; background: var(--accent); color: var(--onacc); }
  .chips { gap: 8px; }
  .chips button { min-height: 44px; border-radius: 9px; background: var(--bg); color: var(--text); }
  .chips button.on { background: color-mix(in srgb, var(--accent) 10%, var(--card)); border-color: var(--accent); color: var(--accent); }
  .chips input { min-height: 44px; border-radius: 9px; }
  .clock-toolbar { flex-wrap: wrap; }

  .farmcard { padding: 0; }

  .farmcard .factions { padding: 0 20px 18px; flex-wrap: wrap; }
  .farmsum button.btn, .farmcard .factions button.btn { min-height: 44px; }
  .farmcard .fstate::before { animation: none !important; }
  .empty { padding: 12px 0; line-height: 1.7; font-size: 14px; }
  .noresult, .farmempty { padding: 40px 22px; font-size: 14px; line-height: 1.8; }
  .noresult-action { min-height: 44px; border-radius: 10px; }

  /* Readable help, with command pills that remain usable on a narrow phone. */
  .helpbody { padding: 24px; background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
    font-size: 15px; line-height: 1.95; overflow-wrap: anywhere; }
  .helpbody span.seg { display: inline; margin: 0; }

    background: color-mix(in srgb, var(--accent) 6%, var(--card)); border-color: color-mix(in srgb, var(--accent) 22%, var(--rule)); }
  .helpbody pre.seg-pre { padding: 16px; line-height: 1.8; background: var(--bg); color: var(--text); border-color: var(--rule); }
  .cathead { font-size: 13px; text-transform: none; letter-spacing: 0; border: 0; padding-inline-start: 2px; margin: 24px 0 12px; color: var(--text); }
  .chipgrid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }

    border-radius: 10px; background: var(--card); font-size: 14px; font-weight: 550; white-space: normal; }
  .chipgrid button.chip::before { display: none; }

  /* Support and AI chat use the same editor, type scale and quiet conversation surface. */
  .supporttop { padding: 18px 20px; margin-bottom: 20px; border: 1px solid var(--rule); }
  .supporttop .sic { border-radius: 11px; background: color-mix(in srgb, var(--accent) 8%, var(--card)); color: var(--accent); }
  .supporttop .sname { font-size: 16px; font-weight: 650; }
  .supporttop .smeta { font-size: 13px; }

  .mtime { font-size: 11px; margin-top: 7px; }

  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent); }
  .composer textarea { min-width: 0; min-height: 46px; font-size: 16px; padding: 12px; }

  .ai-suggestions { gap: 10px; margin-top: 24px; }

  .ai-notice { font-size: 13px; }

  @media (min-width:1200px) {
    #stage .cp-compose { max-width:1120px; display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); align-items:start; gap:20px; }
    .cp-compose > .cp-card { margin:0; grid-column:1; grid-row:1 / span 2; }
    .cp-compose > .cp-recent { margin:0; grid-column:2; }
    .cp-compose > button { grid-column:2; }
  }

  @media (min-width: 1000px) {
    .field, .group, .helpbody, .infocard, .tool, .supporttop, .chatbox, .composer,
    .ai-toolbar, .ai-thread, .ai-chat, .ai-notice, .chipgrid, .cathead, .farmsum, .farmempty {
      max-width: 900px; margin-inline: auto;
    }
    #stage > .row, #stage > .actionbtn, #stage > .card { max-width: 900px; margin-inline: auto; }
    #stage > .actionbtn { display: block; }
    .field { padding: 24px; }
    .chipgrid { grid-template-columns: repeat(3,minmax(0,1fr)); }
    .ai-chat .chatbox, .ai-chat .composer { width: 100%; }
    .ai-suggestions { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); }
    .clock-picker { grid-template-columns: repeat(4,minmax(0,1fr)); }
  }
  @media (hover: hover) {
    .lrow:hover, .mrow:hover, .item.tappable:hover { background: color-mix(in srgb, var(--accent) 4%, var(--card)); }
    .seg .opt:hover, .step button:not(:disabled):hover, .ai-button:not(:disabled):hover,
    .chipgrid button.chip:hover, .cp .cp-channel:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--rule)); }
  }
  @media (max-width: 599px) {
    .card, .tool, .field { padding: 18px 16px; }
    .field.rowflex:has(.step) { flex-wrap:wrap; }
    .field.rowflex:has(.step) .fhead { flex-basis:100%; }
    .field.rowflex .step { margin-inline-start:auto; }
    .field .fhead { gap: 10px; }
    .field .fic { width: 30px; height: 30px; }
    .field.rowflex { gap: 12px; }
    .lrow { padding: 14px 16px; gap: 10px; }
    .helpbody { padding: 18px 16px; }
    .chipgrid { gap: 8px; }
    .chipgrid button.chip { padding: 12px; }
    .supporttop { padding: 16px; }
    .bubble, .ai-chat .bubble { max-width: 94%; padding: 12px 14px 9px; }
    .ai-intro { padding: 28px 10px; }
    .ai-intro h2 { font-size: 23px; }
    .ai-suggestions { flex-direction: column; align-items: stretch; }
    .ai-toolbar { flex-wrap: wrap; }
    .monshi-hero, .monshi-card { padding: 18px 16px; }
    .monshi-choice { padding: 13px 11px; }
    .monshi-choice.selected { padding: 12px 10px; }
    .monshi-heading { align-items: flex-start; }
    .monshi-heading > div:last-child { min-width: 0; }
    .monshi-live { flex-wrap: wrap; }
    .cp .cp-card { padding: 18px 14px; }
    .cp .cp-history { padding: 10px; }
    .cp .cp-editor { padding: 14px; }
    .cp .cp-row input { flex-basis: 100%; }
  }
  @media (max-width: 380px) {
    .field.rowflex { flex-wrap: wrap; }
    .field.rowflex .fhead { flex: 1 1 135px; }
    .field.rowflex .step { margin-inline-start: auto; }
    .monshi-choices { grid-template-columns: minmax(0,1fr); }
    .monshi-editor-footer { flex-wrap: wrap; }
    .monshi-duration { gap: 8px; }
    .farmcard .factions button.btn { flex-basis: 100%; }
    .ai-toolbar b { flex-basis: 100%; white-space: normal; }
    .lrow .lval { max-width: 30%; }
    .clock-picker { gap: 6px; }
    .clock-style { padding: 12px 6px; }
  }

</style>
</head>
