<!-- Moved down from the head so it no longer blocks the first paint. Still a
     plain sync script, and still ahead of the app: both must have run before
     window.Telegram.WebApp is touched on the next line.

     SERVED FROM OUR OWN ORIGIN, and that is the point. This used to be
     https://telegram.org/js/telegram-web-app.js — a synchronous, cross-origin
     script, which means page parsing STOPS until it resolves. If that host is
     slow or unreachable, the app is dead before it draws anything and, crucially,
     before it can issue a single request or report a single error.

     That failure is not theoretical: in Caddy's access log, real Telegram
     WebViews (X-Requested-With: org.telegram.messenger) fetch the page, answered
     in 10ms, and then make no request at all — around a third of opens. A page
     that loads and issues nothing cannot be explained by our API, which answers
     every request it receives in under 130ms.

     It is now embedded directly in this HTML response. Serving it as a separate
     same-origin asset was still one request too many: Cloudflare's production
     edge was observed accepting that request, returning no bytes to the phone,
     and never forwarding it to Caddy. With one self-contained document there is
     no second network operation that can block the parser. Refresh the vendored
     file from telegram.org when the SDK gains something we need; the APIs this
     page uses (ready/expand/initData/BackButton/MainButton/HapticFeedback/safe
     areas) have been stable for years. webapp.go replaces the marker below. -->
<script>// WebView
(function () {
  var eventHandlers = {};

  var locationHash = '';
  try {
    locationHash = location.hash.toString();
  } catch (e) {}

  var initParams = urlParseHashParams(locationHash);
  var storedParams = sessionStorageGet('initParams');
  if (storedParams) {
    for (var key in storedParams) {
      if (typeof initParams[key] === 'undefined') {
        initParams[key] = storedParams[key];
      }
    }
  }
  sessionStorageSet('initParams', initParams);

  var isIframe = false, iFrameStyle;
  try {
    isIframe = (window.parent != null && window != window.parent);
    if (isIframe) {
      window.addEventListener('message', function (event) {
        if (event.source !== window.parent) return;
        try {
          var dataParsed = JSON.parse(event.data);
        } catch (e) {
          return;
        }
        if (!dataParsed || !dataParsed.eventType) {
          return;
        }
        if (dataParsed.eventType == 'set_custom_style') {
          if (event.origin === 'https://web.telegram.org') {
            iFrameStyle.innerHTML = dataParsed.eventData;
          }
        } else if (dataParsed.eventType == 'reload_iframe') {
          try {
            window.parent.postMessage(JSON.stringify({eventType: 'iframe_will_reload'}), '*');
          } catch (e) {}
          location.reload();
        } else {
          receiveEvent(dataParsed.eventType, dataParsed.eventData);
        }
      });
      iFrameStyle = document.createElement('style');
      document.head.appendChild(iFrameStyle);
      try {
        window.parent.postMessage(JSON.stringify({eventType: 'iframe_ready', eventData: {reload_supported: true}}), '*');
      } catch (e) {}
    }
  } catch (e) {}

  function urlSafeDecode(urlencoded) {
    try {
      urlencoded = urlencoded.replace(/\+/g, '%20');
      return decodeURIComponent(urlencoded);
    } catch (e) {
      return urlencoded;
    }
  }

  function urlParseHashParams(locationHash) {
    locationHash = locationHash.replace(/^#/, '');
    var params = {};
    if (!locationHash.length) {
      return params;
    }
    if (locationHash.indexOf('=') < 0 && locationHash.indexOf('?') < 0) {
      params._path = urlSafeDecode(locationHash);
      return params;
    }
    var qIndex = locationHash.indexOf('?');
    if (qIndex >= 0) {
      var pathParam = locationHash.substr(0, qIndex);
      params._path = urlSafeDecode(pathParam);
      locationHash = locationHash.substr(qIndex + 1);
    }
    var query_params = urlParseQueryString(locationHash);
    for (var k in query_params) {
      params[k] = query_params[k];
    }
    return params;
  }

  function urlParseQueryString(queryString) {
    var params = {};
    if (!queryString.length) {
      return params;
    }
    var queryStringParams = queryString.split('&');
    var i, param, paramName, paramValue;
    for (i = 0; i < queryStringParams.length; i++) {
      param = queryStringParams[i].split('=');
      paramName = urlSafeDecode(param[0]);
      paramValue = param[1] == null ? null : urlSafeDecode(param[1]);
      params[paramName] = paramValue;
    }
    return params;
  }

  // Telegram apps will implement this logic to add service params (e.g. tgShareScoreUrl) to game URL
  function urlAppendHashParams(url, addHash) {
    // url looks like 'https://game.com/path?query=1#hash'
    // addHash looks like 'tgShareScoreUrl=' + encodeURIComponent('tgb://share_game_score?hash=very_long_hash123')

    var ind = url.indexOf('#');
    if (ind < 0) {
      // https://game.com/path -> https://game.com/path#tgShareScoreUrl=etc
      return url + '#' + addHash;
    }
    var curHash = url.substr(ind + 1);
    if (curHash.indexOf('=') >= 0 || curHash.indexOf('?') >= 0) {
      // https://game.com/#hash=1 -> https://game.com/#hash=1&tgShareScoreUrl=etc
      // https://game.com/#path?query -> https://game.com/#path?query&tgShareScoreUrl=etc
      return url + '&' + addHash;
    }
    // https://game.com/#hash -> https://game.com/#hash?tgShareScoreUrl=etc
    if (curHash.length > 0) {
      return url + '?' + addHash;
    }
    // https://game.com/# -> https://game.com/#tgShareScoreUrl=etc
    return url + addHash;
  }

  function postEvent(eventType, callback, eventData) {
    if (!callback) {
      callback = function () {};
    }
    if (eventData === undefined) {
      eventData = '';
    }
    console.log('[Telegram.WebView] > postEvent', eventType, eventData);

    if (window.TelegramWebviewProxy !== undefined) {
      TelegramWebviewProxy.postEvent(eventType, JSON.stringify(eventData));
      callback();
    }
    else if (window.external && 'notify' in window.external) {
      window.external.notify(JSON.stringify({eventType: eventType, eventData: eventData}));
      callback();
    }
    else if (isIframe) {
      try {
        var trustedTarget = 'https://web.telegram.org';
        // For now we don't restrict target, for testing purposes
        trustedTarget = '*';
        window.parent.postMessage(JSON.stringify({eventType: eventType, eventData: eventData}), trustedTarget);
        callback();
      } catch (e) {
        callback(e);
      }
    }
    else {
      callback({notAvailable: true});
    }
  };

  function receiveEvent(eventType, eventData) {
    console.log('[Telegram.WebView] < receiveEvent', eventType, eventData);
    callEventCallbacks(eventType, function(callback) {
      callback(eventType, eventData);
    });
  }

  function callEventCallbacks(eventType, func) {
    var curEventHandlers = eventHandlers[eventType];
    if (curEventHandlers === undefined ||
        !curEventHandlers.length) {
      return;
    }
    for (var i = 0; i < curEventHandlers.length; i++) {
      try {
        func(curEventHandlers[i]);
      } catch (e) {}
    }
  }

  function onEvent(eventType, callback) {
    if (eventHandlers[eventType] === undefined) {
      eventHandlers[eventType] = [];
    }
    var index = eventHandlers[eventType].indexOf(callback);
    if (index === -1) {
      eventHandlers[eventType].push(callback);
    }
  };

  function offEvent(eventType, callback) {
    if (eventHandlers[eventType] === undefined) {
      return;
    }
    var index = eventHandlers[eventType].indexOf(callback);
    if (index === -1) {
      return;
    }
    eventHandlers[eventType].splice(index, 1);
  };

  function openProtoUrl(url) {
    if (!url.match(/^(web\+)?tgb?:\/\/./)) {
      return false;
    }
    var useIframe = navigator.userAgent.match(/iOS|iPhone OS|iPhone|iPod|iPad/i) ? true : false;
    if (useIframe) {
      var iframeContEl = document.getElementById('tgme_frame_cont') || document.body;
      var iframeEl = document.createElement('iframe');
      iframeContEl.appendChild(iframeEl);
      var pageHidden = false;
      var enableHidden = function () {
        pageHidden = true;
      };
      window.addEventListener('pagehide', enableHidden, false);
      window.addEventListener('blur', enableHidden, false);
      if (iframeEl !== null) {
        iframeEl.src = url;
      }
      setTimeout(function() {
        if (!pageHidden) {
          window.location = url;
        }
        window.removeEventListener('pagehide', enableHidden, false);
        window.removeEventListener('blur', enableHidden, false);
      }, 2000);
    }
    else {
      window.location = url;
    }
    return true;
  }

  function sessionStorageSet(key, value) {
    try {
      window.sessionStorage.setItem('__telegram__' + key, JSON.stringify(value));
      return true;
    } catch(e) {}
    return false;
  }
  function sessionStorageGet(key) {
    try {
      return JSON.parse(window.sessionStorage.getItem('__telegram__' + key));
    } catch(e) {}
    return null;
  }

  if (!window.Telegram) {
    window.Telegram = {};
  }
  window.Telegram.WebView = {
    initParams: initParams,
    isIframe: isIframe,
    onEvent: onEvent,
    offEvent: offEvent,
    postEvent: postEvent,
    receiveEvent: receiveEvent,
    callEventCallbacks: callEventCallbacks
  };

  window.Telegram.Utils = {
    urlSafeDecode: urlSafeDecode,
    urlParseQueryString: urlParseQueryString,
    urlParseHashParams: urlParseHashParams,
    urlAppendHashParams: urlAppendHashParams,
    sessionStorageSet: sessionStorageSet,
    sessionStorageGet: sessionStorageGet
  };

  // For Windows Phone app
  window.TelegramGameProxy_receiveEvent = receiveEvent;

  // App backward compatibility
  window.TelegramGameProxy = {
    receiveEvent: receiveEvent
  };
})();

// WebApp
(function () {
  var Utils = window.Telegram.Utils;
  var WebView = window.Telegram.WebView;
  var initParams = WebView.initParams;
  var isIframe = WebView.isIframe;

  var WebApp = {};
  var webAppInitData = '', webAppInitDataUnsafe = {};
  var themeParams = {}, colorScheme = 'light';
  var webAppVersion = '6.0';
  var webAppPlatform = 'unknown';
  var webAppIsActive = true;
  var webAppIsFullscreen = false;
  var webAppIsOrientationLocked = false;
  var webAppBackgroundColor = 'bg_color';
  var webAppHeaderColorKey = 'bg_color';
  var webAppHeaderColor = null;

  if (initParams.tgWebAppData && initParams.tgWebAppData.length) {
    webAppInitData = initParams.tgWebAppData;
    webAppInitDataUnsafe = Utils.urlParseQueryString(webAppInitData);
    for (var key in webAppInitDataUnsafe) {
      var val = webAppInitDataUnsafe[key];
      try {
        if (val.substr(0, 1) == '{' && val.substr(-1) == '}' ||
            val.substr(0, 1) == '[' && val.substr(-1) == ']') {
          webAppInitDataUnsafe[key] = JSON.parse(val);
        }
      } catch (e) {}
    }
  }
  var stored_theme_params = Utils.sessionStorageGet('themeParams');
  if (initParams.tgWebAppThemeParams && initParams.tgWebAppThemeParams.length) {
    var themeParamsRaw = initParams.tgWebAppThemeParams;
    try {
      var theme_params = JSON.parse(themeParamsRaw);
      if (theme_params) {
        setThemeParams(theme_params);
      }
    } catch (e) {}
  }
  if (stored_theme_params) {
    setThemeParams(stored_theme_params);
  }
  var stored_def_colors = Utils.sessionStorageGet('defaultColors');
  if (initParams.tgWebAppDefaultColors && initParams.tgWebAppDefaultColors.length) {
    var defColorsRaw = initParams.tgWebAppDefaultColors;
    try {
      var def_colors = JSON.parse(defColorsRaw);
      if (def_colors) {
        setDefaultColors(def_colors);
      }
    } catch (e) {}
  }
  if (stored_def_colors) {
    setDefaultColors(stored_def_colors);
  }
  if (initParams.tgWebAppVersion) {
    webAppVersion = initParams.tgWebAppVersion;
  }
  if (initParams.tgWebAppPlatform) {
    webAppPlatform = initParams.tgWebAppPlatform;
  }

  var stored_fullscreen = Utils.sessionStorageGet('isFullscreen');
  if (initParams.tgWebAppFullscreen) {
    setFullscreen(true);
  }
  if (stored_fullscreen) {
    setFullscreen(stored_fullscreen == 'yes');
  }

  var stored_orientation_lock = Utils.sessionStorageGet('isOrientationLocked');
  if (stored_orientation_lock) {
    setOrientationLock(stored_orientation_lock == 'yes');
  }

  function onThemeChanged(eventType, eventData) {
    if (eventData.theme_params) {
      setThemeParams(eventData.theme_params);
      window.Telegram.WebApp.MainButton.setParams({});
      window.Telegram.WebApp.SecondaryButton.setParams({});
      updateHeaderColor();
      updateBackgroundColor();
      updateBottomBarColor();
      receiveWebViewEvent('themeChanged');
    }
  }

  var lastWindowHeight = window.innerHeight;
  function onViewportChanged(eventType, eventData) {
    if (eventData.height) {
      window.removeEventListener('resize', onWindowResize);
      setViewportHeight(eventData);
    }
  }

  function onWindowResize(e) {
    if (lastWindowHeight != window.innerHeight) {
      lastWindowHeight = window.innerHeight;
      receiveWebViewEvent('viewportChanged', {
        isStateStable: true
      });
    }
  }

  function onSafeAreaChanged(eventType, eventData) {
    if (eventData) {
      setSafeAreaInset(eventData);
    }
  }
  function onContentSafeAreaChanged(eventType, eventData) {
    if (eventData) {
      setContentSafeAreaInset(eventData);
    }
  }

  function onVisibilityChanged(eventType, eventData) {
    if (eventData.is_visible) {
      webAppIsActive = true;

      g = (g < 16 ? '0' : '') + g.toString(16);

<script>
/* ---------- brand ----------
   The product name arrives in a meta tag, substituted at serve time, so one
   binary serves every deployment: a reseller sets BRAND_NAME and this page says
   their name in the title, on the splash and on the welcome card. Read before
   the SDK check below, because the failure screen there is branded too.

   BRAND_MARK is the monogram shown for the moment before the emblem PNG paints.
   First and last capital of the name: TeleBotCraft -> TC, Safir Self -> SS. */
const metaTxt = n => { const m=document.querySelector('meta[name="'+n+'"]'); return (m && m.content || '').trim(); };
const BRAND = (v => (!v || v.startsWith('__')) ? 'TeleBotCraft' : v)(metaTxt('tbc-brand'));
const BRAND_HOME = (v => v.startsWith('__') ? 'TeleBotCraft' : v.replace(/^@/,''))(metaTxt('tbc-home'));
const BRAND_MARK = (caps => caps.length ? (caps[0]+caps[caps.length-1]) : BRAND.slice(0,2).toUpperCase())(BRAND.match(/\p{Lu}/gu) || []);
document.title = BRAND + ' \u00b7 Control Panel';
(sp => { if(sp) sp.textContent = BRAND_MARK; })(document.querySelector('.sp-fallback span'));

// If the vendored SDK is ever missing or malformed, window.Telegram is undefined
// and the next line would throw, killing the app before it draws anything: no
// skeleton, no error, no retry, just the splash logo for ever. Keep that failure
// recoverable even though the SDK now comes from our own origin.
//
// Nothing on this page can work without initData, so there is no degraded mode to
// fall back to — but there is a difference between a dead logo and a screen that
// says what happened and offers a reload.
if(!(window.Telegram && window.Telegram.WebApp)){
  const t=document.getElementById('spTag'), b=document.getElementById('spBar'), c=document.getElementById('spCta');
  document.dir = 'rtl'; // the message leads in Farsi, like every other manager-owned screen
  if(b) b.hidden = true;
  if(t) t.textContent =
    'اتصال به سرور تلگرام برقرار نشد. اینترنت خود را بررسی کنید و پنل را دوباره باز کنید.\n\n' +
    'Could not load Telegram’s script. Check your connection and reopen the panel.';
  if(c){
    c.textContent = 'تلاش دوباره / Retry';
    c.removeAttribute('target'); c.href = '#';
    c.onclick = e => { e.preventDefault(); location.reload(); };
    c.hidden = false;
  }
  throw new Error('telegram-web-app.js did not load');
}
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
// Light/dark: Telegram hands us its palette in CSS vars, but not the *weight* of
// a shadow or a hairline — those have to flip with the scheme, so mirror it onto
// the root element (and follow the user changing it mid-session).
function applyScheme(){ try{ document.documentElement.dataset.scheme = tg.colorScheme || 'dark'; }catch(e){} }
applyScheme();
try { tg.onEvent && tg.onEvent('themeChanged', applyScheme); } catch(e){}

/* ---------- native chrome ----------
   Telegram already draws a header with a back arrow and a close button, knows
   where the notch and the home indicator are, and owns a bottom action button.
   Re-drawing those in the page is what makes a Mini App feel like a website in
   a frame. Everything here is feature-detected: on a client too old to provide
   it, the page keeps its own controls and nothing changes. */
const atLeast = v => { try { return !!(tg.isVersionAtLeast && tg.isVersionAtLeast(v)); } catch(e){ return false; } };
if (atLeast('6.1') && tg.BackButton) document.body.classList.add('nativeback');
try { tg.setBackgroundColor && tg.setBackgroundColor('bg_color'); } catch(e){}
try { tg.setBottomBarColor && tg.setBottomBarColor('secondary_bg_color'); } catch(e){}

// Safe areas: env(safe-area-inset-*) is the browser's idea of the notch, which
// is wrong inside Telegram's own chrome (and plain missing in fullscreen). When
// the client reports its insets, they win.
function applyInsets(){
  try{
    const r=document.documentElement.style;
    const c=tg.contentSafeAreaInset, s=tg.safeAreaInset;
    if(c) { r.setProperty('--sa-top', (c.top|0)+'px'); }

    if(s) r.setProperty('--sa-bottom', (s.bottom|0)+'px');
  }catch(e){}
}
applyInsets();
try { tg.onEvent && tg.onEvent('safeAreaChanged', applyInsets); } catch(e){}
try { tg.onEvent && tg.onEvent('contentSafeAreaChanged', applyInsets); } catch(e){}

// mainButton drives Telegram's own bottom button for the one primary action a
// screen has (signup, back-to-bot). Called with null it hides again, so leaving
// a screen never strands a stale button at the bottom of the next one.
function mainButton(label, onTap){
  const mb=tg.MainButton; if(!mb) return false;
  try{
    if(mainButton._h){ mb.offClick(mainButton._h); mainButton._h=null; }
    if(!label){ mb.hide(); return true; }
    mainButton._h=onTap; mb.setText(label); mb.onClick(onTap); mb.show();
    return true;
  }catch(e){ return false; }
}

// `lang` on every response — not the Telegram client language — so chrome and
// content never mix.
//
// It used to START from the Telegram client's language, which is a different
// thing and on this fleet is usually the wrong one: the creator bot is Farsi and
// a great many owners run an English Telegram, so every splash and every boot
// skeleton was drawn in English and then snapped to Farsi on the first reply —
// which reads exactly like the app switching your language on you. Worse, when
// the first reply never lands, the English never gets corrected at all.

// So: remember what the bot last answered with and open in that. A first-ever

// The answer is also remembered, so the NEXT open starts in the right language

function syncLang(v){
  if(!v || !v.lang) return false;

}

// start_param deep-links the app: a numeric value picks a chat, a word opens

const queryStartParam = new URLSearchParams(location.search).get('startapp') || '';

let BOT='';   // creator-bot @username, learned from /me or a panel response; used by openSignup

const deepKey = (startParam && !numericStart && /^[a-z_]+$/.test(startParam)) ? startParam : '';

// One inlined, generated master asset serves the launch screen, favicon and the

function brandImage(cls){

// label spelling it with the Arabic ي got NO RESULTS, on an app whose search is
// the only way to find one feature among fifty-three. The same goes for ه/ة,
// the four alefs, the three digit sets, and a ZWNJ pasted in from somewhere
// else — this project writes none, but nothing stops a person typing one.

// failScreen replaces the stage with something the owner can act on.
//
// Every failure used to be a toast over the boot skeleton: the toast cleared
// after 2.4s and the twelve grey placeholder blocks stayed forever, with no
// retry anywhere in the page. That is indistinguishable from "the panel does not
// load" — which is exactly how it was reported — and it is what the owner sees
// during the ~75 seconds a deploy takes, because Caddy answers 5xx while the
// manager restarts.
//
// Bilingual on purpose: a failed request is precisely when the bot's language is
// unknown, since the page only learns it from a successful response.
// fetchT is fetch with a deadline. There was none anywhere in this page, and a
// request that never settles is the worst failure it can have: neither the
// !res.ok branch nor the catch runs, so no error is shown and no retry is
// offered — the boot skeleton simply stays on screen for ever, in English,
// because the language only arrives with a response. That is precisely what an
// owner photographed: a Control Panel header, a search box and grey blocks.
//
// A hang is not hypothetical here. The manager proxies to the owner's tenant
// over a unix socket and Cloudflare sits in front of both; either can hold a
// connection open without answering. Twelve seconds is longer than every healthy
// render measured on the fleet (sub-10ms at the socket) and short enough that a
// person is still watching when it gives up.
// fetchT is attempts, not one long wait — see fetchOnce below for the deadline
// itself.
//
// Measured, not assumed. Five minutes of real fleet traffic through Caddy: the
// slowest /api that ARRIVED took 0.105s, and nothing in the whole window was
// slow. Yet a quarter of page opens produced no /api at the origin at all, and
// the phone's own report says why — the render aborted at its deadline, and then
// that same page successfully posted the report a moment later. The request is
// not slow, it is LOST between the phone and Cloudflare, and a single attempt
// cannot survive that however long you wait for it. Waiting longer only makes
// the dead end slower to reach.
//
// So: a short deadline and another go. Against a 0.1s origin, five seconds is
// already twenty times the worst healthy case, and three attempts cost less
// wall-clock than the single 12s wait they replace while actually recovering.
//
// `tries` is opt-in per call site, because a retry is only safe for a request
// that can be sent twice — a render, a state read, a balance. `set` keeps one
// attempt (see feature()).
async function fetchT(url, opts, ms=12000, tries=1){
  let last;
  const began=Date.now();
  for(let i=0; i<tries; i++){
    try{
      return await fetchOnce(url, opts, ms);
    }catch(e){
      last=e;
      if(i===tries-1) break;
      // Report the recovery too, with the time actually spent — an earlier version
      // reported the nominal deadline instead, so every beacon read "~5s" whatever
      // had happened and the number was worse than useless.
      report('lost, retrying ('+(i+1)+'/'+(tries-1)+'): '+(e && e.name || e), Date.now()-began, url);
    }
  }
  throw last;
}
async function fetchOnce(url, opts, ms){
  if(typeof AbortController!=='function') return fetch(url, opts);  // very old webview
  const ac=new AbortController();
  const t=setTimeout(()=>ac.abort(), ms);
  try{
    const res=await fetch(url, Object.assign({}, opts, {signal:ac.signal}));
    // Read the body INSIDE the armed window, and hand back a pre-read stand-in.
    //
    // This is the half the first attempt missed. fetch() resolves when the
    // response HEADERS arrive, not when the body does, so clearing the timer in
    // a finally around fetch() disarmed the abort before the caller's
    // res.json() ever ran. Headers out, body stalled — which is a real state
    // between a phone and Cloudflare, e.g. a radio handover that drops the TCP
    // connection silently — and res.json() then never settles: no error branch,
    // no catch, no retry, and the boot skeleton stays on screen for ever in
    // English, because the language only arrives with a parsed body. That is
    // exactly the failure this deadline was added to kill, and it survived
    // because the deadline was on the wrong half of the request.
    const body=await res.text();
    return { ok:res.ok, status:res.status,
             json:async()=>JSON.parse(body), text:async()=>body };
  }
  finally{ clearTimeout(t); }
}

// WebViews disagree on the wording of an AbortController failure: some say
// "AbortError", others say "signal is aborted without reason". Neither belongs
// on the owner's screen. Keep the classification in one place so panel and
// feature requests show the same useful message.
function friendlyNetworkError(e){
  const timedOut=e && (e.name==='AbortError' || /abort/i.test(String(e.message||e)));
  return timedOut
    ? (fa?'⚠️ پاسخی از سرور نیامد.':'⚠️ The server did not answer.')
    : (fa?'⚠️ ارتباط برقرار نشد.':'⚠️ Could not reach the server.');
}


// nothingOnScreen: the stage is empty, or all it holds is a loading skeleton.
//
// This replaced an `everRendered` flag that was set as soon as a RESPONSE
// arrived, on the assumption that a response means something is about to paint.
// It does not. A view with no text and no buttons — which is what the server
// answers for an unknown section, and for the `support` deep link — makes
// render() bail out after a toast, and the flag had already declared the screen
// safe, so the failure screen stayed suppressed and the boot skeleton sat there
// for ever. The DOM knows whether anything painted; a flag only knows what we
// hoped would happen.
function nothingOnScreen(){

function failScreen(msg){

// ensurePainted is the backstop for a response that answers fine and then draws
// nothing.
//
// Every renderer paints behind a ~120ms fade, so "did anything appear" cannot be
// answered synchronously — which is why this is a short timer rather than a check
// in send(). It fires only when the stage is still empty or still a skeleton, so
// a screen that painted normally never sees it, and it carries the server's own
// note ("بخش ناشناخته") when there is one, because that is the actual reason.
function ensurePainted(note){
  setTimeout(()=>{
    if(!nothingOnScreen()) return;
    report('answered but painted nothing: '+(note||''), 0, lastData);
    failScreen(note || (fa?'⚠️ چیزی برای نمایش نبود.':'⚠️ There was nothing to show.'));

}

// report tells the server the page gave up. A request that never arrives leaves
// no trace on the server — every render measured there is milliseconds while
// owners photograph a loading skeleton — so the page is the only witness there
// is. keepalive so it still goes out if the WebView is being torn down.
function report(reason, ms, stage){
  try{
    fetch('clientlog', {method:'POST', keepalive:true,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({reason:String(reason||''), ms:ms|0, stage:String(stage||''), initData:tg.initData})});
  }catch(e){}
}

// The watchdog is a WALL CLOCK, and it is deliberately not tied to the request.
//
// fetchT arms an AbortController, which handles a request that stalls — as long
// as aborting it rejects. That is not guaranteed: on some WebViews aborting a
// stalled BODY read never settles the promise at all, so neither the error branch
// nor the catch ever runs, `inflight` stays true for the rest of the session, the
// finally that would call bar(false) and hideSplash() never executes, and the
// boot skeleton sits there under a progress bar frozen at 75% — which is exactly
// what owners keep photographing.
//
// Nothing about that state can be detected by looking at the promise. So this
// looks at the clock and at the screen, and at nothing else. It also releases
// `inflight`: without that the Retry button it draws would be a no-op, because
// send() returns immediately while a request it can no longer see is "running".
const WATCHDOG_MS = 20000;   // > /api's worst case (3 × 5s), so the normal path reports its own reason first
let watchdogT=null, retried=false;
function armWatchdog(started){
  clearTimeout(watchdogT);
  watchdogT=setTimeout(()=>{
    if(!nothingOnScreen()) return;
    const waited=Date.now()-started;
    inflight=false; bar(false);        // abandon it, so a retry can actually go out
    // One silent retry first: a single lost response is the common case, and
    // recovering by itself is worth more than showing anyone an error.
    if(!retried){
      retried=true;
      report('stalled, retrying', waited, lastData);
      send(lastData||'p:0:@manage');
      return;
    }
    report('stalled, gave up', waited, lastData);
    failScreen(fa?'⚠️ پاسخی از سرور نیامد.':'⚠️ The server did not answer.');
  }, WATCHDOG_MS);
}
function toast(msg){
  if(!msg) return;
  const el=$('toast'); el.textContent=msg; el.classList.add('show');
  haptic(/[❌⚠️🚫⛔]/.test(msg)?'warn':/[✅☑️✔️💾]/.test(msg)?'ok':'light');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2400);
}
// A note has two tiers, and the panel has always drawn the line — long, spanning
// lines, or opening with a sign that something needs attention gets the popup in
// Telegram, everything else a toast. The web view was never told which was which,
// so a multi-line error and a one-word confirmation both flashed past in 2.4
// seconds. `alert` now rides along with the note (webapp.go: view.Alert).
//
// Falls back to the toast on a client without showPopup, which is exactly what it
// used to do for everything.
function note(msg, alert){
  if(!msg) return;
  if(alert){
    haptic('warn');
    try{ if(tg.showPopup){ tg.showPopup({message: msg}); return; } }catch(e){}
    try{ if(tg.showAlert){ tg.showAlert(msg); return; } }catch(e){}
  }
  toast(msg);
}

  document.body.classList.toggle('tabs', !!key);
  ['home','help','games','lang'].forEach(k=>{
    const b=$('tb_'+k); if(!b) return;
    b.classList.toggle('on', k===key);
    if(k===key) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
}
function showBack(title){            // a sub-screen: show back arrow + its title
  document.querySelector('header').removeAttribute('data-root');
  setTitle(title); showSearch(false); updateTabs(null);
  setWorkspaceTab(aiChatView?'assistant':featureKey==='custombot'?'custom':featureKey==='channelpublisher'?'channels':farmerID?'farmers':featureKey?'features':null);
  const bb=tg.BackButton; if(bb){ bb.offClick(onBack); bb.onClick(onBack); bb.show(); }
}
function hideBack(){                 // the hub root: no back, show search + tabs
  document.querySelector('header').setAttribute('data-root','1');
  setTitle(T.home); updateTabs('home');
  const bb=tg.BackButton; if(bb){ bb.offClick(onBack); bb.hide(); }
}
function onBack(){ silentNav=true; backAction(); } // navigating back: no vibration

// openSignup deep-links into the bot's create-userbot flow (t.me/<bot>?start=
// create): the bot receives /start create and runs the existing signup steps
// (join gate → share number → login). Falls back to a plain link/navigation.
function openSignup(){
  haptic('light');
  if(!BOT){ toast('⚠️ '+(fa?'کمی بعد دوباره امتحان کنید':'try again in a moment')); return; }
  const url='https://t.me/'+BOT+'?start=create';

/* ---------- hub cache ----------
   The hub is the same ~53 tiles every time and changes only when the binary
   does, but it was refetched and repainted from scratch on every open — so the
   most-opened screen in the app was also the one that made you wait for a
   network round trip to see something you had already seen.

   Keyed on the page's own build: the menu button already opens this app as
   `?v=<IndexVersion>` (a content hash of index.html — manager.go builds that
   URL), so the page can read its own version out of its own URL and no server
   change is needed. A deploy changes the hash, the key stops matching, and the
   stale hub is dropped rather than shown. Opened without a `?v=` — a direct
   link — the key is a constant, which is self-consistent: such a client is
   being served whatever its WebView already cached anyway.

   Only the hub is cached. Settings are not: a value the owner changed on
   another device must never be answered from this one's memory. */
const CACHE_V = (()=>{ try{ return new URLSearchParams(location.search).get('v') || '0'; }catch(e){ return '0'; } })();
function hubCacheSave(v){
  try{ localStorage.setItem('hub2', JSON.stringify({v:CACHE_V, view:v})); }catch(e){}
}
function hubCacheLoad(){
  try{ const c=JSON.parse(localStorage.getItem('hub2')||'null'); return (c && c.v===CACHE_V && c.view) ? c.view : null; }
  catch(e){ return null; }
}
const hubCached = hubCacheLoad();

/* ---------- splash ---------- */
// Called from send()'s finally, so it lifts on the first answer whatever that
// answer was: a rendered panel, the signup screen, or a failure that leaves the
// skeleton behind. A splash that only cleared on success would be a way to get
// stuck looking at a logo.
// SPLASH_MIN is how long the splash stays up no matter how fast the panel
// answers. Without it the brand flashed and vanished — the app now loads quicker
// than the screen can be read, which reads as a glitch rather than an opening.
// It is a floor, never an addition: the wait is only ever the *remainder*, so a
// slow panel is never made slower by it. One bar sweep is 1.15s; 1.5s lets that
// finish and the wordmark land.
//
// It applies to a FIRST open only. That is the open the reasoning above is about
// — the one where there is nothing to show yet and the brand is the honest thing
// to put on screen. On every later open the panel is already in hand and can be
// painted at once, and holding a logo over it for a second and a half is not a
// brand moment, it is a delay this app spent a lot of effort not having.
const SPLASH_MIN = hubCached ? 0 : 1500;
const splashAt = Date.now();
let splashTimer = null;

// Opened in a normal browser rather than from Telegram: there is no initData, so
// every /api call answers 401 and the app used to sit on an empty skeleton
// forever — a panel that never loads. Nothing here can work without Telegram, so
// the splash stays up and turns into the way in.
let outside = false;

function showOutside(){
  outside = true;
  const bar=$('spBar'); if(bar) bar.hidden = true;
  const tag=$('spTag');
  // Inside Telegram with no initData is a different problem from being outside
  // Telegram, and it happens for a mundane reason: initData rides in the URL
  // hash, so reloading the page (a pull-to-refresh, a client restoring the view)
  // throws it away. Telling that owner "this only works inside Telegram" while
  // they are plainly inside Telegram reads as the app being broken.
  const inTelegram = !!(tg.initDataUnsafe && Object.keys(tg.initDataUnsafe).length) ||
                     (!!tg.platform && tg.platform!=='unknown') || !!window.TelegramWebviewProxy;
  if(tag) tag.textContent = inTelegram
    ? (fa ? 'این صفحه باید از نو باز شود. آن را ببندید و دوباره از دکمه منوی ربات باز کنید.'
          : 'This page needs to be opened again. Close it and reopen it from the bot’s menu button.')
    : (fa ? 'این پنل فقط داخل تلگرام کار میکند. آن را با دکمه منوی ربات باز کنید.'
          : 'This panel only works inside Telegram. Open it from the bot’s menu button.');
  const cta=$('spCta');
  if(cta){
    // The bot is substituted into the page at serve time; if the server didn't
    // know it, the channel is always a valid place to land.
    const meta=document.querySelector('meta[name="tbc-bot"]');
    const bot=(meta && meta.content || '').replace(/^@/,'');
    const handle = (bot && bot !== '__BOT__') ? bot : BRAND_HOME;
    // No bot and no channel is a deployment that has told us nowhere to send
    // them. An empty href would open t.me and a built-in one would advertise
    // somebody else, so the button simply stays hidden.
    if(handle){
      cta.href='https://t.me/'+handle;
      cta.textContent = inTelegram
        ? (fa ? 'بازگشت به ربات' : 'Back to the bot')
        : (fa ? 'باز کردن در تلگرام' : 'Open in Telegram');
      cta.hidden = false;
    }
  }
}

function hideSplash(){
  if(outside) return; // there is nothing behind it that would work
  const s=$('splash');
  if(!s || s.classList.contains('gone') || splashTimer) return;
  // Someone who asked for less motion asked for less waiting, not more.
  const left = WH_REDUCED ? 0 : SPLASH_MIN - (Date.now() - splashAt);
  if(left > 0){
    splashTimer = setTimeout(()=>{ splashTimer=null; hideSplash(); }, left);
    return;
  }
  s.classList.add('gone');
  s.setAttribute('aria-hidden','true');
}

/* ---------- render ---------- */
// Framed labels are headings, not buttons: "── X ──" (panel chrome) and the
// lighter "— X —" some sections emit inline.
function isDivider(t){ t=(t||'').trim(); return /^\s*[─—-]{2,}/.test(t) || /[─—]{2,}\s*$/.test(t) || /^[—–]\s.+\s[—–]$/.test(t); }

// valClass tints a row's right-aligned value when it is an on/off state.
function valClass(v){
  if(/^(✅|☑|✔|✓|🟢)|^(on|On|ON)\b|^(روشن|فعال)/.test(v)) return 'on';
  if(/^(❌|✖|✗|🔴|⚪|⛔)|^(off|Off|OFF)\b|^(خاموش|غیرفعال)/.test(v)) return 'off';
  return '';
}
// listRow renders one panel button as a settings-style row: leading emoji →
// icon bubble, "Label: value" → right-aligned value, trailing › → chevron,
// semantic color → tinted label text.
function listRow(b){
  let t=(b.text||'').trim();
  const row=document.createElement('button'); row.type='button'; row.className='lrow';
  const chev=/[›»]\s*$/.test(t); t=t.replace(/\s*[›»]\s*$/,'');
  let lead='';
  const m=t.match(/^(\p{Extended_Pictographic}(?:[\uFE0F\u200D]|\p{Extended_Pictographic})*)\s*/u);
  if(m && m[1]){ lead=m[1]; t=t.slice(m[0].length); }
  let val=null;
  const ci=t.indexOf(':');
  if(ci>0 && !chev && /\p{L}/u.test(t.slice(0,ci))){ // label must be words, not a clock time
    const rest=t.slice(ci+1).trim();
    if(rest && rest.length<=16){ val=rest; t=t.slice(0,ci).trim(); }
  }
  if(b.color==='success') row.classList.add('ok');
  else if(b.color==='danger') row.classList.add('crit');
  else if(b.color==='primary') row.classList.add('acc');
  // EVERY row gets an icon, not just the ones whose label happened to start with
  // an emoji. That condition meant the rows that matter — Enable, Disable,
  // Refresh, Clear — arrived bare (the panel strips their leading symbol when it
  // colours them), while the incidental neutral ones kept theirs, so the icons
  // marked the least important rows on the screen. The emoji is used when there
  // is one; otherwise the row falls back to the section's own icon, and a
  // coloured row says what it does with the colour of its bubble.
  const sec=lastSeg((b.data||'').split(':').slice(0,3).join(':'));
  row.innerHTML='<span class="lic"></span><span class="ltxt"></span>'+
    (val!==null?'<span class="lval"></span>':'')+(chev?'<span class="lchev">'+svgIcon('chevron')+'</span>':'');
  const li=row.querySelector('.lic');
  li.style.setProperty('--h', hueOf(sec||''));
  if(lead && EMOJI2SVG[lead]) li.innerHTML=svgIcon(EMOJI2SVG[lead]);
  else if(lead) li.textContent=lead;
  else li.innerHTML=icon(sec);
  row.querySelector('.ltxt').textContent=t;
  if(val!==null){ const lv=row.querySelector('.lval'); const c=valClass(val); if(c) lv.classList.add(c); lv.textContent=val; }
  row.onclick=()=>send(b.data, row);
  return row;
}

// renderSegments paints a panel screen from styled runs: command runs become
// tap-to-copy pills, while native Telegram emphasis survives in the Mini App.
// The section title is already in the header bar, so the first line is dropped.
function renderSegments(el, segs){
  el.innerHTML='';
  let started=false;
  segs.forEach(s=>{
    let txt=s.text;
    if(!started){
      const i=txt.indexOf('\n');
      if(i<0) return;              // still inside the title line
      txt=txt.slice(i+1); started=true;
      if(!txt) return;
    }
    if(s.code){
      if(s.pre){
        const pre=document.createElement('pre');
        pre.className='seg-pre'+(s.bold?' seg-bold':''); pre.textContent=txt;
        el.appendChild(pre);
        return;
      }
      const t=txt.trim();
      if(!t) return;
      const c=document.createElement('code');
      c.className='cmd'+(s.bold?' seg-bold':'')+(s.italic?' seg-italic':''); c.textContent=t;
      c.title = fa ? 'برای کپی بزنید' : 'Tap to copy';
      c.setAttribute('role','button'); c.tabIndex=0;
      c.setAttribute('aria-label',(fa?'کپی دستور ':'Copy command ')+t);
      c.onclick=()=>copyCmd(t, c);
      c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();copyCmd(t,c);}};
      el.appendChild(c);
    } else {
      const n=document.createElement(s.blockquote?'span':'span');
      n.className='seg';
      if(s.bold) n.classList.add('seg-bold');
      if(s.italic) n.classList.add('seg-italic');
      if(s.underline) n.classList.add('seg-underline');
      if(s.strike) n.classList.add('seg-strike');
      if(s.spoiler) n.classList.add('seg-spoiler');
      if(s.blockquote) n.classList.add('seg-blockquote');
      n.textContent=txt;
      el.appendChild(n);
    }
  });
}

// copyCmd copies a command to the clipboard with a pill flash + toast.
function copyCmd(text, el){
  const done=()=>{ el.classList.add('copied'); setTimeout(()=>el.classList.remove('copied'),900); toast((fa?'کپی شد: ':'Copied: ')+text); try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('light');}catch(e){} };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text, done){
  const ta=document.createElement('textarea'); ta.value=text;
  ta.style.position='fixed'; ta.style.top='-1000px'; ta.setAttribute('readonly','');
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); done();
}
function render(v){
  // Divider tap → toast only, keep the current screen.
  if(!(v.buttons&&v.buttons.length) && !v.text){ note(v.note, v.alert); return; }

  const stage=$('stage'); stage.classList.add('out');
  setTimeout(()=>{
    if(aiChatView) return; // an earlier panel response must not replace AI Help
    const text=(v.text||'').trim();
    const nl=text.indexOf('\n');
    let head = nl>=0 ? text.slice(0,nl).trim() : text;   // → header title
    let body = nl>=0 ? text.slice(nl+1).trim() : '';      // → status card
    // A first line is a title only if it reads like one. The manager's own screens
    // open with a full sentence ("نشست تلگرام یوزربات شما بسته یا منقضی شده است.")
    // and that whole sentence was being planted in the header bar. Same rule the
    // bot's reply styler uses for a heading: short, and not a finished sentence.
    if(head && ([...head].length>48 || /[.!؟?]$/.test(head))){ body=text; head=''; }
    $('title').textContent='';
    stage.innerHTML='';

    // Styled sections (Help) arrive as `segments`: prose runs plus command runs.
    // Render commands as tap-to-copy pills in the main scroll area; hide the small
    // status card (which is only meant for a one-line status).
    if(v.segments && v.segments.length){
      $('status').style.display='none';
      const hb=document.createElement('div'); hb.className='helpbody';
      renderSegments(hb, v.segments);
      stage.appendChild(hb);
    } else {
      $('body').textContent = body;
      $('status').style.display = body ? '' : 'none';
    }
    $('status').classList.toggle('hint', !(v.buttons&&v.buttons.length));

    let ri=0;
    let grid=null;  // help: a category's chip grid, once a header opens one
    let group=null; // other screens: the open card of list rows
    const isHelp=/^p:[^:]*:help(:|$)/.test(lastData);
    if(isHelp) stage.appendChild(aiHelpEntry());
    const rise=el=>{ el.style.animation='rise .26s ease both'; el.style.animationDelay=(ri++*22)+'ms'; };
    // Drop the panel's own nav chrome (Menu/Close/Back) — the header back button
    // and Telegram's own close replace it.
    //
    // Except when it is ALL a screen has. The manager's own screens — session
    // expired, and left the required channel — are one block of text plus a single
    // "back to bot" @close button, so the filter removed the only thing on them
    // that could be tapped and left the owner reading a dead end. Those are
    // precisely the screens where the way out matters most, because the header
    // arrow goes to a hub the manager is currently refusing to serve.
    let rows=(v.buttons||[]).map(row=>row.filter(b=>!/@home|@close|@manage/.test(b.data))).filter(r=>r.length);
    if(!rows.length) rows=(v.buttons||[]).filter(r=>r.length);
    rows.forEach(btns=>{

      // A category header (framed divider / @noop): a real section heading.
      // Help opens a wrap-grid of chips beneath it; other screens start a new
      // list group under the heading.
      if(btns.length===1 && (isDivider(btns[0].text) || /@noop/.test(btns[0].data))){
        group=null; grid=null;
        const h=document.createElement('div'); h.className='cathead';
        h.textContent=stripLead(btns[0].text);
        rise(h); stage.appendChild(h);
        if(isHelp){ grid=document.createElement('div'); grid.className='chipgrid'; rise(grid); stage.appendChild(grid); }
        return;
      }

      // Under a help category header → chips that size to content and wrap.
      if(grid){
        // A lone button pointing at the parent view is this screen's own back
        // link — the header arrow already is that, so it'd be a duplicate chip.
        if(btns.length===1 && lastData.startsWith(btns[0].data+':')) return;
        btns.forEach(b=>{
          const el=document.createElement('button');
          el.className='chip '+(b.color||'');
          el.innerHTML='<span class="lbl"></span>'; el.querySelector('.lbl').textContent=b.text;
          el.onclick=()=>send(b.data, el);
          grid.appendChild(el);
        });
        return;
      }

      // A single button = one setting / action / drill-in → a settings-style
      // list row, consecutive ones grouped into one card (same shape as the
      // native feature screens).
      if(btns.length===1){
        const b=btns[0];
        // The header back arrow already goes exactly there — drop the duplicate.
        if(/^[‹◂🔙]/.test((b.text||'').trim()) && lastData.startsWith(b.data+':')) return;
        if(!group){ group=document.createElement('div'); group.className='group'; rise(group); stage.appendChild(group); }
        group.appendChild(listRow(b));
        return;
      }

      group=null;
      // 2+ buttons side by side (option grids, paired actions) — semantic
      // colors arrive as soft tints via the .btn palette.
      const r=document.createElement('div'); r.className='row';
      btns.forEach(b=>{
        const el=document.createElement('button');
        el.className='btn '+(b.color||'');
        if(isDivider(b.text)) el.classList.add('divider');
        // A row of options is a segmented control, and the panel's own way of
        // saying which one is chosen is to bracket it with bullets ("• 5 •").
        // Rendered literally that is two stray dots on a slab identical to its
        // neighbours; the current choice was otherwise only findable in the prose
        // above. Show it as chosen and drop the marker.
        let txt=(b.text||'');
        const sel=/^\s*[•‣]\s*(.+?)\s*[•‣]\s*$/.exec(txt);
        if(sel){ txt=sel[1]; el.classList.add('on'); }
        el.innerHTML='<span class="lbl"></span>'; el.querySelector('.lbl').textContent=txt;
        el.onclick=()=>send(b.data, el);
        r.appendChild(el);
      });
      rise(r); stage.appendChild(r);
    });
    stage.classList.remove('out');
    // Back follows the panel hierarchy: a drill-down (p:chat:section:seg…) goes
    // up one level (e.g. a help plugin page → the help index); a section root
    // goes to the hub.
    const parts=lastData.split(':');
    backAction = parts.length>3
      ? (()=>send(parts.slice(0,-1).join(':')))
      : (()=>send('p:'+chatId+':@manage'));
    showBack(head);
    // Help and Language are tab-bar destinations, not drill-ins: keep the bar.
    if(/^p:[^:]*:help(:|$)/.test(lastData)) updateTabs('help');
    else if(/^p:[^:]*:lang(:|$)/.test(lastData)) updateTabs('lang');
    note(v.note, v.alert);
  },120);
}

// gamesCats holds the game feature categories lifted out of the hub, so the Games
// tab can render them. Filled by renderHub (from the same one round trip the hub
// already makes) and read by openGames.
const gamesCats=[];
// featureHome is where a feature screen's back arrow goes. Null means the hub;
// the Games tab sets it so backing out of Fishing returns to Games rather than
// dropping the player into the settings list they never opened.
let featureHome=null;

// catOpen reads (and with a second argument, writes) whether a category is
// expanded. Remembered per category title so the sections an owner actually uses
// stay open for them, and keyed on the title rather than an index so adding a
// feature category does not shuffle everyone's choices.
// Reading returns undefined for a category the owner has never opened or shut,
// which is NOT the same as one they deliberately closed — see renderHub.
function catOpen(title, set){
  let m={}; try{ m=JSON.parse(localStorage.getItem('cats')||'{}')||{}; }catch(e){}
  if(set===undefined) return m[title];
  m[title]=!!set;
  try{ localStorage.setItem('cats', JSON.stringify(m)); }catch(e){}
  return !!set;
}

/* ---------- manager-owned custom bot ----------
   This screen talks to /custom-bot, never to the tenant feature socket. The
   BotFather token is accepted only in this Mini App, sent once over the signed
   request, and immediately cleared from the input after a successful connect.
   The response is deliberately safe: it contains the bot username and settings,
   never the token or webhook secret. */
async function customBotReq(op, extra={}){
  const body=Object.assign({initData:tg.initData, op}, extra);
  // State is a local manager read and should never leave the owner staring at
  // the loading screen through two long network attempts. Mutations keep the
  // longer deadline because token validation and webhook registration call
  // Telegram's Bot API.
  const isState=op==='state';
  const res=await fetchT('custom-bot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)},isState?5000:15000,1);
  let data={}; try{ data=await res.json(); }catch(e){}
  if(!res.ok){ throw new Error(data.error || httpErr(res.status)); }
  const state=data.state || data;
  if(op==='state') customBotStateCache=state;
  return state;
}
let customBotStateCache=null;
function customBotTile(){

  el.innerHTML='<span class="ic">🤖</span><span class="tl"></span><span class="tv"></span>';
  el.querySelector('.tl').textContent=fa?'ربات اختصاصی':'Custom Bot';
  el.querySelector('.tv').textContent=fa?'اتصال':'Connect';
  el.onclick=()=>{ haptic('light'); openCustomBot(); };
  return el;
}
async function refreshCustomBotTile(el){
  try{
    const s=await customBotReq('state'); if(!el || !el.isConnected) return;
    const label=el.querySelector('.tl'), value=el.querySelector('.tv');
    if(s.configured){ label.textContent=(fa?'ربات اختصاصی ':'Custom Bot ')+(s.username?'@'+s.username:''); value.textContent=s.running?(fa?'روشن':'Running'):(s.enabled?(fa?'متوقف':'Stopped'):(fa?'خاموش':'Disabled')); el.title=s.blocked_reason||''; el.classList.toggle('is-on',!!s.running); }
  }catch(e){}
}
// The custom bot screen is a normal settings screen: same switches, same
// steppers, same self-saving text fields as every feature, rendered by
// paintFields/widget. It was a hand-rolled stack of eight Save buttons and two
// boxes asking for a Telegram file_id, which nobody outside this repo can
// produce. Everything that needs a real photo or a real broadcast now lives
// where it belongs — inside the owner's own bot, one /start away.
function customBotFields(state){
  const c=state.config||{};
  if(!state.configured) return {
    title: fa?'ربات اختصاصی':'Custom Bot',
    summary: fa?'یک ربات به نام خودتان، برای گرفتن پیام مردم.'
               :'A bot of your own, for taking messages from people.',
    values: {token:''},
    fields: [
      {type:'info', key:'howto', label: fa?'در سه قدم':'Three steps',
       hint: fa?'۱. در تلگرام به @BotFather پیام بدهید و /newbot را بزنید.\n۲. یک نام و یک یوزرنیم بدهید تا توکن را بفرستد.\n۳. همان خط را کپی کنید و پایین بگذارید.'
               :'1. Message @BotFather and send /newbot.\n2. Give it a name and a username; it replies with a token.\n3. Copy that line and paste it below.'},
      {type:'text', key:'token', label: fa?'توکن ربات':'Bot token',
       placeholder:'123456789:AA…',
       hint: fa?'کل خطی که BotFather داده را بگذارید؛ خودمان تمیزش می کنیم.'
               :'Paste the whole line BotFather sent; we clean it up.'},

// One sink for every control on the screen. Each maps to a /custom-bot op; the
// answer is the new state, so the screen repaints from the server rather than
// from what the control thinks it did.
async function customBotSet(field, value, revert){
  const ticket=featureTicket();
  try{
    let st;
    if(field==='token'){
      if(!String(value||'').trim()) throw new Error(fa?'توکن را وارد کنید':'Enter a token');
      st=await customBotReq('connect',{token:String(value).trim()});
    } else if(field==='enabled'){
      st=await customBotReq(value?'enable':'disable');
    } else if(field==='disconnect'){
      await customBotReq('disconnect'); st=await customBotReq('state');
    } else if(field==='channels'){
      st=await customBotReq(value.op==='del'?'channel_remove':'channel_add',{channel:value.item});
    } else {
      st=await customBotReq('set',{key:field, value});
    }
    if(featureCurrent(ticket)) renderCustomBot(st, true);
  }catch(e){
    if(!featureCurrent(ticket)) return;
    haptic('warn'); toast('⚠️ '+(e.message||e));
    if(revert) revert();
  }
}

// Serialize only known marks and indivisible emoji nodes. Pasted HTML is never
// copied into a request, and animation internals never become message text.
function cpReadEditor(editor){
  const runs=[];
  function append(text,marks){if(!text)return;const r={text,...marks},last=runs[runs.length-1];if(last&&!last.emoji&&!!last.bold===!!r.bold&&!!last.italic===!!r.italic&&(last.link||'')===(r.link||''))last.text+=text;else runs.push(r);}
  function walk(n,marks){
    if(n.nodeType===3){append(n.nodeValue,marks);return;}
    if(n.nodeType!==1)return;
    if(n.dataset.emoji){runs.push({emoji:n.dataset.emoji,...marks});return;}
    if(n.tagName==='BR'){append('\n',marks);return;}
    const next={...marks};if(n.tagName==='B'||n.tagName==='STRONG')next.bold=true;if(n.tagName==='I'||n.tagName==='EM')next.italic=true;
    if(n.tagName==='A'&&/^https?:\/\//i.test(n.getAttribute('href')||''))next.link=n.getAttribute('href');
    const block=n!==editor&&(n.tagName==='DIV'||n.tagName==='P');if(block&&runs.length&&!runs[runs.length-1].text?.endsWith('\n'))append('\n',next);
    n.childNodes.forEach(x=>walk(x,next));
  }
  editor.childNodes.forEach(n=>walk(n,{}));return runs;
}

function renderHub(v, now){
  featureKey=null; featureHome=null; farmerID=null; stopFarmerPoll();
  // No section tiles (e.g. the "create your userbot" screen when the tenant is
  // offline) → fall back to the normal text+buttons renderer.
  const hasTiles=(v.buttons||[]).some(row=>row.some(b=>!/@home|@close|@manage|@noop/.test(b.data)));
  if(!hasTiles){ render(v); return; }
  // Remember this hub so the next open can paint before the network answers.
  // Saved only once it is known to be a real hub — never the signup or expired
  // view, which must always come from the server.
  hubCacheSave(v);

  // Group: a divider (@noop) opens a category; section buttons become tiles.
  //
  // The games category is pulled out here and handed to the Games tab. Matched on
  // the divider's callback data (`@noop:cat.games`), never on its label — the
  // label is a translated string and would stop matching the day someone reworded
  // it in one language.
  const cats=[]; let cur=null; gamesCats.length=0;
  for(const row of v.buttons||[]) for(const b of row){
    if(b.data.includes(':@noop')){
      // The icon comes from the category's ID, not its label. The label cannot
      // supply one: HeaderRow builds it as StripLeadEmoji(title) wrapped in "── ──",
      // so the emoji the catalog does define is removed server-side and never
      // reaches the page. The id is right there in the callback data.
      cur={title:stripLead(b.text), key:lastSeg(b.data), tiles:[]};
      (b.data.endsWith(':cat.games') ? gamesCats : cats).push(cur);
      continue;
    }
    if(/@home|@close|@manage/.test(b.data)) continue;
    if(!cur){ cur={title:'', tiles:[]}; cats.push(cur); }
    cur.tiles.push({key:lastSeg(b.data), label:stripLead(b.text), data:b.data});
  }
  // Support / Language / Help live in the bottom tab bar, not in the grid.

  // Per-feature state, sent with the hub only (webapp.go: hubStatus). A keyboard
  // can carry a label and a callback and nothing else, which is why this screen
  // used to show fifty-three identical doors and say nothing about any of them.
  const ST = v.status || {}, SEARCH = v.search || {};
  cats.forEach(c=>c.tiles.forEach(t=>{ t.st = ST[t.key] || null; }));

  // Quick access: surface the user's most-recently-opened features as a top row,
  // pulled from the tiles that exist in this hub (newest first).
  const allTiles={}; cats.forEach(c=>c.tiles.forEach(t=>{ if(!allTiles[t.key]) allTiles[t.key]=t; }));
  const qaTiles=qaRecent().map(k=>allTiles[k]).filter(Boolean).slice(0,4);
  if(qaTiles.length) cats.unshift({title:T.quick, tiles:qaTiles, quick:true});

  // Derive the running summary from the same status values used by the library.
  // Feature rows navigate to settings; filtering never writes a setting.
  const onKeys={}; const activeTiles=[];
  Object.keys(ST).forEach(k=>{ if(ST[k].on) onKeys[k]=1; });
  cats.forEach(c=>{ if(c.quick) return; c.tiles.forEach(t=>{ if(onKeys[t.key]===1){ onKeys[t.key]=2; activeTiles.push(t); } }); });
  // Active features are available through the status filter; repeating every
  // enabled feature here pushed the actual library several screens down.

  // A hub is already on screen when this is the server's answer reconciling the
  // one painted from cache (and when Home is tapped from the hub). Repaint in
  // place then: no fade, no scroll jump — otherwise every open would show the
  // whole page fade out and back in a fraction of a second after it appeared,
  // which reads worse than the wait it replaced.
  const keep = !!$('welcome');
  const hubNavigation=featureEpoch;
  const stage=$('stage'); if(!keep && !now) stage.classList.add('out');

    const y = keep ? window.scrollY : 0;

    stage.innerHTML='';
    if(!keep){ dashboardFilter='all'; dashboardCategory='all'; }

    }

    const pulse=document.createElement('div');
    const activeCount=activeTiles.length;
    pulse.id='hubpulse';
    pulse.className='hubpulse'+(activeCount?'':' quiet');
    pulse.innerHTML='<span class="pulse-dot" aria-hidden="true"></span>'+
      '<span class="pulse-copy"><b></b><small></small></span>'+
      '<button type="button" class="pulse-action"></button>';

      ? (fa ? (activeCount+' قابلیت فعال') : (activeCount+' active '+(activeCount===1?'feature':'features')))

    pulse.querySelector('.pulse-copy small').textContent = activeCount
      ? (fa ? 'قابلیت های روشن در فضای کاری شما' : 'Enabled in your workspace')

    pulse.querySelector('.pulse-action').textContent = activeCount
      ? (fa ? 'مشاهده' : 'View')

    pulse.querySelector('.pulse-action').setAttribute('aria-label', activeCount
      ? (fa ? 'مشاهده قابلیت های فعال' : 'View active features')
      : (fa ? 'مرور قابلیت ها' : 'Browse features'));
    pulse.querySelector('.pulse-action').onclick=()=>{
      dashboardFilter=activeCount?'active':'all'; dashboardCategory='all';

    const aslot=document.createElement('div'); aslot.id='adminslot'; stage.appendChild(aslot);

    let seenFoldable = false;
    cats.forEach((c,ci)=>{

      // asking; the eight or nine feature categories below them are a browse, and
      // collapsed they turn five screenfuls into one. The count on each header is
      // what makes a shut section legible — "3 / 13" says both that there is

        toolbar.append(dashboardFilters(),dashboardCategoryPicker(cats)); stage.appendChild(toolbar);
      }
      // A first run has nothing running and nothing recently opened, so both the
      // Active-now and Quick-access rows are absent — and with every category
      // defaulting to shut, the first thing a new owner ever saw was a welcome
      // card, the line "Everything is paused", and nine closed headers. Fifty
      // three features, none of them visible, and no reason on screen to believe
      // a header would open. So the first category starts open until they have
      // expressed a preference of their own; one open section shows what a tile
      // is and what the chevrons below it are for, without bringing back the five
      // screenfuls that collapsing was there to fix.
      const choice = catOpen(c.title);
      const open = !collapsible || (choice===undefined ? !seenFoldable : choice);
      if(collapsible) seenFoldable = true;
      const box=document.createElement('div');
      const catID='feature-cat-'+ci;

        // Searchable in BOTH languages, not just the one on screen. The label is
        // whichever language the bot speaks, so on its own it left a Farsi owner

        // to find it by its Farsi one — for features the app knew both names of all
        // along. SEARCH carries the other title and the feature's command aliases
        // (webapp.go: searchTerms).

        el.dataset.state=tile.st?(tile.st.on?'active':'paused'):'unknown';

        const summary=featureSummary(tile.key);
        if(summary&&!c.quick){const hint=document.createElement('small');hint.className='tile-description';hint.textContent=summary;el.querySelector('.tl').appendChild(hint);}
        if(tile.st){

// waitText renders seconds-left as "3 ساعت و 12 دقیقه" / "3h 12m".
function waitText(sec){
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);
  if(sec<60) return fa?'کمتر از یک دقیقه':'under a minute';
  if(!h) return fa?(m+' دقیقه'):(m+'m');
  return fa?(h+' ساعت و '+m+' دقیقه'):(h+'h '+m+'m');
}

// The prize ring comes from the server (same table that actually pays), so the
// drawn wheel can never promise something the payout table doesn't have.
let WHEEL_SEGS=[1,2,5,10,20,50,100], WHEEL_WAIT=0;

// paintWheel keeps the profile row honest: ready = a live button, otherwise the
// countdown. The row is the door; spinWheelOpen() is the wheel.
function paintWheel(sec, segs){
  if(Array.isArray(segs) && segs.length) WHEEL_SEGS=segs;
  WHEEL_WAIT=sec|0;
  const row=$('wheelrow'), btn=$('wheelbtn');
  if(!row || !btn) return;
  row.style.display='';
  row.classList.toggle('ready', !(sec>0));
  btn.disabled=false; // always openable: the sheet explains the wait far better than a dead button
  btn.textContent = sec>0 ? ('⏳ '+waitText(sec)) : (fa?'بچرخان':'Spin');
}

// The disc is drawn from the app's accent — two alternating tones — with the
// jackpot wedge in gold. One saturated colour on the whole wheel, so the prize
// worth wanting is findable at a glance.
function whWedge(i, isTop){
  if(isTop) return 'var(--whgold)';
  return i%2 ? 'color-mix(in srgb, var(--accent) 58%, #0c1420)' : 'var(--accent)';
}
const WH_CONF=['#f0b429','#ff8a5c','#4ea1f0','#2fb56d','#ffd66b','#e35650'];
const WH_REDUCED=(()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } })();

// Sound is synthesised, not sampled: no audio file to serve, cache-bust, or
// wait on before the first tick. The context is opened on the Spin tap because
// mobile browsers refuse audio that didn't come from a gesture — and it stays
// silent on its own if the phone's mute switch is on.
let whAC=null;
function whAudio(){
  try{
    if(!whAC) whAC=new (window.AudioContext||window.webkitAudioContext)();
    if(whAC.state==='suspended') whAC.resume();
    return whAC;
  }catch(e){ return null; }
}
// One blip: hard attack, exponential tail. Everything the wheel says is made of
// these — the pointer's click and the win chime differ only in pitch and shape.
function whBeep(freq, ms, gain, type, delay){
  const ac=whAudio(); if(!ac) return;
  const t=ac.currentTime+(delay||0), d=ms/1000;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'triangle'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+d+0.02);
}
// The prize is worth what it sounds like: four notes for a good one, two for
// the rest — the same line confetti draws.
function whFanfare(big){
  const notes=big?[523.25,659.25,783.99,1046.5]:[523.25,659.25];
  notes.forEach((f,i)=>whBeep(f, big?300:200, 0.11, 'sine', i*0.09));
}

// spinWheelOpen builds the wheel: a real disc, a pointer that stays put, and a
// single slot under it that holds the rule before the spin and the prize after.
// The casino — its own screen, not a sheet over the profile.
//
// It is a place you go to, with a back arrow, because it is a game rather than a
// setting: a modal over somebody's balance made it feel like a dialog they had
// to dismiss to get on with things.
//
// Only the person whose Telegram client sent the request can play: every call
// carries the signed initData and the server derives the player from THAT, never
// from anything the page says. The page cannot name a user, so it cannot bet
// somebody else's coins.
//
// The stake offered is the SPENDABLE balance, never the whole one — gifted coins
// and an un-burned free trial buy runtime, not bets — and the server re-checks
// it on every roll, because a balance moves between taps.
let casinoState = null, casinoPick = null, casinoBusy = false, casinoGame = 'dice';

async function casinoReq(body){
  try{
    const r = await fetchT('casino', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({initData: tg.initData}, body))}, 15000, 2);
    if(!r.ok){ toast(httpErr(r.status)); return null; }
    return await r.json();
  }catch(e){ toast(friendlyNetworkError(e)); return null; }
}

const CZ_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];

// Telegram's real dice animation.
//
// Not a lookalike: /dice/<n>.tgs are the documents of Telegram's own
// AnimatedDice2 sticker set, the exact files the app plays when a dice message
// lands in a chat. 0 is the value-unknown state that loops while the roll is in
// flight; 1..6 each land on that face over 180 frames at 60 fps — the same 3.0 s
// the group casino waits out.
//
// The renderer is fetched only when this screen opens, never on the boot path,
// and the JSON is never held in memory between rolls: both files are HTTP-cached
// for a week, and re-parsing 350 KB from cache is a few ms against a 3 s
// animation.
let czLib = null, czAnim = null;

function czLoadLib(){
  if(window.lottie) return Promise.resolve(window.lottie);
  if(!czLib) czLib = new Promise((ok, bad) => {
    const el = document.createElement('script');
    el.src = '/lottie.js';
    el.onload = () => ok(window.lottie);
    el.onerror = () => { czLib = null; bad(new Error('lottie')); };
    document.head.appendChild(el);
  });
  return czLib;
}

// playTGS mounts one of Telegram's own animated emoji into `host`, replacing
// whatever drawn icon is already there. Built on czLoadLib so the renderer is
// still fetched once, lazily, and only by someone who actually reaches a screen
// that uses it.
//
// Returns false and touches nothing on any failure — a 404 is the ordinary case,
// because the animated set does not cover every emoji and those features keep
// their SVG. The host is only cleared AFTER the bytes are in hand, so a missing
// animation never leaves an empty box.
//
// Not used on the splash, deliberately: the splash exists because nothing else
// can be on screen yet, and making it wait on a download and a renderer would
// undo the one thing it is for.
const tgsLive = new WeakMap();
async function playTGS(host, name){
  if(!host || !name) return false;
  try{
    const [lib, res] = await Promise.race([
      Promise.all([czLoadLib(), fetch('/emoji/'+encodeURIComponent(name)+'.tgs')]),
      new Promise((_, bad) => setTimeout(() => bad(new Error('slow')), 5000)),
    ]);
    if(!res.ok) return false;
    const data = await res.json();
    if(!host.isConnected) return false;            // the screen changed under us
    const prev = tgsLive.get(host);
    if(prev){ try{ prev.destroy(); }catch(e){} }
    host.textContent = '';
    host.classList.add('tgs');
    const anim = lib.loadAnimation({ container: host, renderer: 'svg',
      loop: false, autoplay: !WH_REDUCED, animationData: data });
    // Reduced motion still gets the artwork, just held on its first frame.
    if(WH_REDUCED) anim.goToAndStop(0, true);
    tgsLive.set(host, anim);
    return true;
  }catch(e){ return false; }
}

// czWarm pulls the faces into the HTTP cache while the player is still choosing
// a stake, so the roll itself never waits on a download.
function czWarm(){ for(let i=0;i<=6;i++) fetch('/dice/'+i+'.tgs').catch(()=>{}); }

// czPlay renders one face. Returns the animation, or null if anything failed —
// callers fall back to a plain glyph, because a broken CDN must not break a game
// the server has already settled.
async function czPlay(n, loop, play){
  const host = $('czdie');
  if(!host) return null;
  try {
    // Bounded: a request that stalls without failing would otherwise leave this
    // promise unsettled forever, and the caller holds casinoBusy — the game
    // would lock up rather than degrade.
    const [lib, res] = await Promise.race([
      Promise.all([czLoadLib(), fetch('/dice/'+n+'.tgs')]),
      new Promise((_, bad) => setTimeout(() => bad(new Error('slow')), 6000)),
    ]);
    if(!res.ok) throw new Error('dice '+n);
    const data = await res.json();
    if($('czdie') !== host) return null; // screen changed under us
    if(czAnim){ czAnim.destroy(); czAnim = null; }
    host.textContent = '';
    czAnim = lib.loadAnimation({
      container: host, renderer: 'svg', loop: !!loop, autoplay: play !== false, animationData: data,
    });
    if(play === false) czAnim.goToAndStop(0, true);
    return czAnim;
  } catch(e){
    if(czAnim){ try { czAnim.destroy(); } catch(_){} czAnim = null; }
    host.textContent = n >= 1 && n <= 6 ? CZ_FACES[n-1] : '🎲';
    host.classList.add('glyph');
    return null;
  }
}

// czDone resolves when the roll animation finishes, so the result is revealed on
// the landing rather than over it.
function czDone(anim, ms){
  return new Promise(done => {
    let fired = false;
    const fin = () => { if(!fired){ fired = true; done(); } };
    if(anim) anim.addEventListener('complete', fin);
    setTimeout(fin, ms); // the animation may never have loaded
  });
}

function casinoPaint(st){

  if(st.game && st.game!==casinoGame && !casinoBusy){ casinoGame=st.game; casinoRenderStage(); }

    b.classList.toggle('on', b.dataset.game===casinoGame);

  });

  // Count the balance up/down instead of snapping: the number IS the reward, so
  // it should be watchable.
  if(prev && prev.spendable !== st.spendable) czCount($('czbalnum'), prev.spendable, st.spendable);

  const stakes=$('czstakes'); stakes.innerHTML='';
  (st.stakes||[]).filter(a => a <= st.spendable).forEach(a => {

    const all=document.createElement('button'); all.type='button'; all.className='czchip all';
    all.textContent = fa?'همه':'All';
    all.onclick = () => { $('czamt').value = st.spendable; haptic('light'); };
    stakes.appendChild(all);
  }

  const lab=$('czguesslab'), picks=$('czpicks');
  picks.innerHTML=''; picks.className='czrow'; picks.style.display='';

      b.textContent=label; b.dataset.pick=val;

      if(casinoPick===val) b.classList.add('on');

    picks.appendChild(mk(fa?'زوج':'Even','e',' wide'));
    picks.appendChild(mk(fa?'فرد':'Odd','o',' wide'));
  } else if(casinoGame==='roulette'){
    lab.style.display=''; lab.textContent=fa?'انتخاب رولت':'Roulette bet';
    picks.classList.add('roulette-grid');
    const labels=fa ? {red:'قرمز',black:'مشکی',odd:'فرد',even:'زوج'} : {red:'Red',black:'Black',odd:'Odd',even:'Even'};
    const mk=(label,val,cls)=>{
      const b=document.createElement('button'); b.type='button'; b.className='czpick'+(cls||'');
      b.textContent=label; b.dataset.pick=val;
      b.onclick=()=>{ casinoPick=val; haptic('light');

      if(casinoPick===val) b.classList.add('on');

  } else {

    go.innerHTML=(fa?'چرخاندن رولت':'Spin roulette')+' <small>'+(fa?'بیرونی '+rp.outside+'x · عدد دقیق '+rp.number+'x':'outside '+rp.outside+'x · number '+rp.number+'x')+'</small>';

// czCount animates a number from a to b. Short and eased — a reward you can see
// arriving, not a progress bar.
function czCount(el, a, b){
  if(!el) return;
  const t0=Date.now(), dur=520;
  const step=()=>{
    const k=Math.min(1,(Date.now()-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent = nf(Math.round(a+(b-a)*e));
    if(k<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// czConfetti sprays the win. Pure CSS particles, no library — the page has a
// strict CSP and this is a dozen spans.
function czConfetti(host){
  if(!host) return;
  host.innerHTML='';
  const colors=['#f5c518','#2fb56d','#4aa3ff','#e35650','#b06cf0','#ffffff'];
  for(let i=0;i<26;i++){
    const b=document.createElement('i');
    b.style.setProperty('--x', (Math.random()*200-100).toFixed(0)+'px');
    b.style.setProperty('--r', (Math.random()*720-360).toFixed(0)+'deg');
    b.style.setProperty('--d', (Math.random()*260).toFixed(0)+'ms');
    b.style.background = colors[i%colors.length];
    host.appendChild(b);
  }
  setTimeout(()=>{ if(host) host.innerHTML=''; }, 1600);
}

// These are presentation-only animations. The server has already selected and
// settled the result; visual randomness here cannot influence the wallet. The
// final symbols/number are written only when the reveal is complete, so there
// are no fake near misses or clues about a result that was not actually drawn.
function czSpinSlots(){
  const box=$('czslots'), reels=box ? box.querySelectorAll('.czreel') : [];
  if(!box) return Promise.resolve();
  const symbols=(casinoState && casinoState.slotSymbols)||['🍒','🍋','🔔','💎','7️⃣'];
  box.classList.add('spin');
  const timer=setInterval(()=>reels.forEach(r=>{ r.textContent=symbols[Math.floor(Math.random()*symbols.length)]; }), 95);
  return new Promise(done=>setTimeout(()=>{ clearInterval(timer); box.classList.remove('spin'); done(); }, 1350));
}

function czSpinRoulette(){
  const wheel=$('czroulette');
  if(!wheel) return Promise.resolve();
  wheel.classList.remove('spin');
  void wheel.offsetWidth;
  wheel.classList.add('spin');
  return new Promise(done=>setTimeout(()=>{ wheel.classList.remove('spin'); done(); }, 1350));
}

async function casinoRoll(){
  if(casinoBusy) return;
  const min = (casinoState && casinoState.min) || 1;
  const amount = Math.floor(Number($('czamt').value)||0);
  if(!(amount >= min)){ toast(fa?'⚠️ مبلغ شرط را وارد کنید.':'⚠️ Enter a stake.'); haptic('warn'); return; }
  if(casinoGame!=='slots' && !casinoPick){ toast(fa?'⚠️ یک انتخاب انجام دهید.':'⚠️ Make a selection.'); haptic('warn'); return; }
  if(casinoState && amount > casinoState.spendable){ toast(fa?'⚠️ بیشتر از موجودی قابل شرط شماست.':'⚠️ More than you can stake.'); haptic('warn'); return; }

  casinoBusy = true;
  const go=$('czgo'), die=$('czdie'), res=$('czres'), stage=$('czstage');
  if(go) go.disabled=true;
  if(res){ res.textContent=''; res.className='czres'; }
  if(stage) stage.classList.remove('win','lose');
  if(die) die.classList.remove('glyph');

  // Value 0 — Telegram's own "still rolling" state — loops while the request is
  // out. Slots and roulette use their own reveal animation after the server
  // returns the settled result.
  const spin = casinoGame==='dice' ? czPlay(0, true, true) : Promise.resolve();

  const st = await casinoReq({action:'roll', game: casinoGame, amount: amount, pick: casinoPick||''});
  if(!st || st.error || !st.rolled){
    if(casinoGame==='dice'){
      await spin;
      czPlay(0, false, false);
    }
    casinoBusy = false;
    if(go) go.disabled = false;
    if(!st) return;
    casinoPaint(st);
    if(st.error){ toast('⚠️ '+st.error); haptic('warn'); }
    return;
  }

  if(casinoGame!=='dice'){
    if(casinoGame==='slots') await czSpinSlots();
    else await czSpinRoulette();
    casinoPaint(st);
    casinoShowOutcome(st);
    casinoBusy = false;
    if(go) go.disabled = false;
    return;
  }

  // The throw itself: 3 seconds of Telegram's animation, landing on the face the
  // server picked. The result is only revealed once it has landed — showing the
  // number over a die still in the air is what made this feel fake.
  await spin;
  const roll = await czPlay(st.value || 1, false, true);
  haptic('light');
  await czDone(roll, 3400);

  casinoBusy = false;
  if(go) go.disabled = false;
  casinoPaint(st);
  casinoShowOutcome(st);
}
